version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  # Deno reads web/package.json and regenerates web/deno.lock, which CI
  # installs with --frozen: a package.json bump without the lock would fail.
  - package-ecosystem: deno
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: deno
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: docker
    directories: [/, /site]
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "ci(deps)"
