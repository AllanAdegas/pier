name: Bug
description: Algo não funciona como o esperado / Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar. **Não cole segredos** (senhas, tokens, chaves, `.env`). Vulnerabilidades: use o relato privado, não esta issue.
  - type: input
    id: version
    attributes:
      label: Versão do Pier
      description: Saída de `curl http://127.0.0.1:8700/api/v1/version`.
      placeholder: "0.6.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Como foi instalado
      options: [install.sh (imagem publicada), install.sh com PIER_BUILD=1, Binário compilado do código, Outro]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: E o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs e ambiente
      description: "`docker compose logs --tail 100 pier`, sistema operacional, versão do Docker. Remova segredos."
      render: shell
