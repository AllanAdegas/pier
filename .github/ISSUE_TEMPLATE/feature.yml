name: Feature / Funcionalidade
description: Suggest an improvement / Sugira uma melhoria
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve? / Qual problema isso resolve?
      description: Describe the situation, not only the solution. / Descreva a situação, não só a solução.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How you imagine the solution / Como você imagina a solução
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / Alternativas consideradas
      description: Including how you work around it today. / Inclusive como você contorna hoje.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution / Contribuição
      options:
        - label: I can open a PR for this / Posso abrir um PR para isso
