name: Funcionalidade / Feature
description: Sugira uma melhoria / Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve?
      description: Descreva a situação, não só a solução.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Como você imagina a solução
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Inclusive como você contorna hoje.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribuição
      options:
        - label: Posso abrir um PR para isso
