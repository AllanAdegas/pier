name: Site

# Builds site/ and publishes it to GitHub Pages. Called by release-please.yml
# after a release, or run by hand.
on:
  workflow_call:
    inputs:
      ref:
        description: Tag or branch to build
        required: false
        type: string
        default: main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.5"
      - run: deno task test
        working-directory: site
      - run: deno task build
        working-directory: site
        env:
          SITE_BASE_PATH: ${{ vars.PAGES_CNAME && '/' || '/pier/' }}
      # Default project hosting uses /pier/. A custom domain uses the root.
      # Set PAGES_CNAME only after configuring its DNS.
      - name: Custom domain
        env:
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
        run: |
          if [ -n "$PAGES_CNAME" ]; then printf '%s\n' "$PAGES_CNAME" > site/dist/CNAME; fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
