name: PR title

# Squash merges use the PR title as the commit message, and release-please
# reads Conventional Commits to decide the next version.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "The PR title must follow Conventional Commits, e.g. 'feat(api): add previews'." >&2
            echo "Got: $TITLE" >&2
            exit 1
          fi
