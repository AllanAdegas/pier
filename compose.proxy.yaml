# HTTPS panel routing uses the protected file provider written at startup from
# PIER_DOMAIN, at <local-server-data>/proxy/dynamic/pier-panel.yaml.
# The dedicated pier-panel network is declared by compose.yaml and attached
# by the managed proxy. No route token belongs in labels or this file.
# Recreate both panel and proxy when upgrading from the shared pier network.
services:
  pier:
    environment:
      PIER_DOMAIN: ${PIER_DOMAIN:?set PIER_DOMAIN in .env}
      PIER_COOKIE_SECURE: "1"
