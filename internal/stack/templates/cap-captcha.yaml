name: Cap
description: CAPTCHA auto-hospedado para a web moderna.
description_en: Self-hosted CAPTCHA for the modern web.
category: Segurança
website: https://capjs.js.org/guide/
services:
  cap:
    image: tiago2/cap:3.0.4
    port: 3000
    env:
      ADMIN_KEY: $PIER_PASSWORD_ADMIN
      REDIS_URL: redis://valkey:6379
with:
  valkey:
    args:
    - --save
    - '60'
    - '1'
    - --loglevel
    - warning
    - --maxmemory-policy
    - noeviction
