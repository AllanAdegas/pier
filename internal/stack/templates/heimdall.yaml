name: Heimdall
description: Painel para organizar as aplicações do seu servidor.
description_en: Dashboard to organize your server's applications.
category: Produtividade
website: https://github.com/linuxserver/Heimdall
services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:2.8.4
    port: 80
    data: /config
    env:
      PUID: '1000'
      PGID: '1000'
      TZ: Europe/Madrid
