name: Diun
description: Notifica quando uma imagem Docker é atualizada no registry.
description_en: Notifies you when a Docker image is updated in the registry.
category: Automação
website: https://crazymax.dev/diun/
services:
  diun:
    image: crazymax/diun:4.33.1
    command: serve
    volumes:
    - diun_data:/data
    - /var/run/docker.sock:/var/run/docker.sock
    env:
      TZ: ${TIME_ZONE:-Europe/Vienna}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_JSON: ${LOG_JSON:-false}
      DIUN_WATCH_WORKERS: ${DIUN_WATCH_WORKERS:-20}
      DIUN_WATCH_SCHEDULE: ${DIUN_WATCH_SCHEDULE:- * */6 * * *}
      DIUN_WATCH_JITTER: ${DIUN_WATCH_JITTER:-30s}
      DIUN_PROVIDERS_DOCKER: ${DIUN_PROVIDERS_DOCKER:-true}
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: ${DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT:-true}
      DIUN_NOTIF_SLACK_WEBHOOKURL: ${WEBHOOK_URL_SLACK}
