name: Cryptgeon
description: Compartilhamento seguro de notas e arquivos, inspirado no PrivNote.
category: Segurança
website: https://github.com/cupcakearmy/cryptgeon
tags:
  - cryptgeon
  - secure
  - note
  - sharing
  - privnote
  - file
routes:
  - service: app
    port: 8000
compose: |
  services:
    app:
      image: cupcakearmy/cryptgeon:latest
      environment:
        - SIZE_LIMIT=${SIZE_LIMIT:-4 MiB}
        - MAX_VIEWS=${MAX_VIEWS:-100}
        - MAX_EXPIRATION=${MAX_EXPIRATION:-360}
        - ALLOW_ADVANCED=${ALLOW_ADVANCED:-true}
        - ALLOW_FILES=${ALLOW_FILES:-true}
      depends_on:
        redis:
          condition: service_healthy
      healthcheck:
        interval: 1m
        retries: 2
        start_period: 5s
        test:
          - CMD
          - curl
          - --fail
          - http://127.0.0.1:8000/api/live/
        timeout: 3s
    redis:
      image: redis:7-alpine
      command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
      healthcheck:
        interval: 5s
        retries: 2
        test:
          - CMD
          - redis-cli
          - PING
        timeout: 10s
