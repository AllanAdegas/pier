name: SuperTokens com PostgreSQL
description: 'Autenticação open source: login seguro e gestão de sessões.'
description_en: 'Open source authentication: secure sign-in and session management.'
category: Autenticação
website: https://supertokens.com/docs/guides
services:
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:12.5.0
    port: 3567
    env:
      API_KEYS: ${PIER_PASSWORD_SUPERTOKENS}
      POSTGRESQL_CONNECTION_URI: '"postgresql://{{postgres.user}}:{{postgres.password}}@postgres:5432/{{postgres.database}}"'
with:
  postgres:
    version: '16'
    database: supertokens
