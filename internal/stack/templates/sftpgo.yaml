auth: generated
name: SFTPGo
description: Servidor SFTP, FTP/S, HTTP/S e WebDAV orientado a eventos.
description_en: Event-driven SFTP, FTP/S, HTTP/S and WebDAV server.
category: Armazenamento
website: https://docs.sftpgo.com/2.7/
services:
  sftpgo:
    image: ghcr.io/drakkan/sftpgo:v2.7-alpine
    port: 8080
    ports:
    - 2222:2222
    volumes:
    - sftpgo-data:/srv/sftpgo/data
    - sftpgo-keys:/var/lib/sftpgo
    env:
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: 'true'
      SFTPGO_DEFAULT_ADMIN_USERNAME: ${PIER_USER_SFTPGO}
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${PIER_PASSWORD_SFTPGO}
      SFTPGO_DATA_PROVIDER__DRIVER: postgresql
      SFTPGO_DATA_PROVIDER__CONNECTION_STRING: postgresql://{{postgresql.user}}:{{postgresql.password}}@postgresql:5432/{{postgresql.database}}
      SFTPGO_SFTPD__BINDINGS__0__PORT: ${PORT_SFTPGO:-2222}
      SFTPGO_LOG_LEVEL: ${LOG_LEVEL:-info}
with:
  postgresql:
    kind: postgres
    database: sftpgo-db
