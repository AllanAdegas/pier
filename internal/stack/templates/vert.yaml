name: VERT
description: Conversor de arquivos open source e totalmente local.
description_en: Open source, fully local file converter.
category: Desenvolvimento
website: https://github.com/VERT-sh/VERT
services:
  vert:
    image: ghcr.io/vert-sh/vert@sha256:51edb89e7c57197b0281ba8427fb27eea63730a3683b10d422061afab2708a49
    port: 80
    env:
      PUB_VERT_URL: ${PIER_URL_VERT}
      PUB_HOSTNAME: ${PIER_URL_VERT}
      PUB_PORT: '80'
      PUB_ENV: production
