name: Executor
description: Servidor de integrações de agentes de IA e execução de código.
description_en: Server for AI agent integrations and code execution.
category: Desenvolvimento
website: https://executor.sh/docs/hosted/docker
services:
  executor:
    image: ghcr.io/rhyssullivan/executor-selfhost:${EXECUTOR_VERSION:-1.6.10}
    port: 4788
    data: /data
    env:
      EXECUTOR_WEB_BASE_URL: ${PIER_URL_EXECUTOR}
      EXECUTOR_HOST: ${EXECUTOR_HOST:-0.0.0.0}
      PORT: ${PORT:-4788}
      EXECUTOR_DATA_DIR: /data
      EXECUTOR_DB_PATH: ${EXECUTOR_DB_PATH:-/data/data.db}
      EXECUTOR_ORG_NAME: ${EXECUTOR_ORG_NAME:-Default}
      EXECUTOR_ORG_SLUG: ${EXECUTOR_ORG_SLUG:-default}
      EXECUTOR_ALLOW_LOCAL_NETWORK: ${EXECUTOR_ALLOW_LOCAL_NETWORK:-false}
