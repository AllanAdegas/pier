name: Mosquitto
description: Broker MQTT leve, de placas de baixo consumo a servidores.
description_en: Lightweight MQTT broker, from low-power boards to servers.
category: Mensageria
website: https://mosquitto.org/documentation/
services:
  mosquitto:
    image: eclipse-mosquitto:2
    port: 1883
    private: true
    entrypoint:
    - sh
    - -ec
    - |
      umask 077
      printf 'listener 1883\nallow_anonymous false\npassword_file /mosquitto/config/passwords\n' > /mosquitto/config/mosquitto.conf
      mosquitto_passwd -b -c /mosquitto/config/passwords "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
      chown mosquitto:mosquitto /mosquitto/config/passwords
      exec /docker-entrypoint.sh mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
    - ${MQTT_BIND_IP:-127.0.0.1}:1883:1883
    volumes:
    - ./mosquitto/config:/mosquitto/config
    - ./certs:/certs
    env:
      MQTT_USERNAME: ${PIER_USER_MOSQUITTO}
      MQTT_PASSWORD: ${PIER_PASSWORD_MOSQUITTO}
