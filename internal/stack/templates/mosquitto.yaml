name: Mosquitto
description: Broker MQTT leve, de placas de baixo consumo a servidores.
category: Mensageria
website: https://mosquitto.org/documentation/
tags:
  - mosquitto
  - mqtt
  - open-source
routes:
  - service: mosquitto
    port: 1883
compose: |
  services:
    mosquitto:
      image: eclipse-mosquitto
      entrypoint: sh -c " if [ '$REQUIRE_CERTIFICATE' = 'true' ]; then echo 'listener 8883' > /mosquitto/config/mosquitto.conf && echo 'cafile /certs/ca.crt' >> /mosquitto/config/mosquitto.conf && echo 'certfile /certs/server.crt' >> /mosquitto/config/mosquitto.conf && echo 'keyfile  /certs/server.key' >> /mosquitto/config/mosquitto.conf; else echo 'listener 1883' > /mosquitto/config/mosquitto.conf; fi && echo 'require_certificate '$REQUIRE_CERTIFICATE >> /mosquitto/config/mosquitto.conf && echo 'allow_anonymous '$ALLOW_ANONYMOUS >> /mosquitto/config/mosquitto.conf; if [ -n '$PIER_USER_MOSQUITTO' ] && [ -n '$PIER_PASSWORD_MOSQUITTO' ]; then echo 'password_file /mosquitto/config/passwords' >> /mosquitto/config/mosquitto.conf && touch /mosquitto/config/passwords && chmod 0700 /mosquitto/config/passwords && chown root:root /mosquitto/config/passwords && mosquitto_passwd -b -c /mosquitto/config/passwords $PIER_USER_MOSQUITTO $PIER_PASSWORD_MOSQUITTO && chown mosquitto:mosquitto /mosquitto/config/passwords; fi && exec mosquitto -c /mosquitto/config/mosquitto.conf "
      environment:
        - MQTT_USERNAME=${PIER_USER_MOSQUITTO}
        - MQTT_PASSWORD=${PIER_PASSWORD_MOSQUITTO}
        - REQUIRE_CERTIFICATE=${REQUIRE_CERTIFICATE:-false}
        - ALLOW_ANONYMOUS=${ALLOW_ANONYMOUS:-true}
      volumes:
        - ./mosquitto/config:/mosquitto/config
        - ./certs:/certs
      ports:
        - 8883:8883
      healthcheck:
        interval: 30s
        retries: 3
        test:
          - CMD-SHELL
          - exit 0
        timeout: 10s
      labels:
        - traefik.tcp.routers.mqtt.entrypoints=mqtt
        - traefik.tcp.routers.mqtts.entrypoints=mqtts
