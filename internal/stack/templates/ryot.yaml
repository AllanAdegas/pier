name: Ryot
description: Acompanhe mídia consumida, atividades físicas e mais.
description_en: Track the media you consume, workouts and more.
category: Produtividade
website: https://github.com/ignisda/ryot
services:
  ryot:
    image: ignisda/ryot:v10.3.0
    port: 8000
    env:
      DATABASE_URL: postgres://{{postgresql.user}}:{{postgresql.password}}@postgresql:5432/{{postgresql.database}}
      SERVER_ADMIN_ACCESS_TOKEN: ${PIER_PASSWORD_64_RYOT}
      TZ: ${TZ:-Europe/Amsterdam}
with:
  postgresql:
    kind: postgres
    version: '16'
    env:
      TZ: ${TZ:-Europe/Amsterdam}
    database: ryot-db
