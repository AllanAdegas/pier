name: Cockpit
description: Plataforma de conteúdo headless, leve e rápida.
description_en: Lightweight, fast headless content platform.
category: CMS
website: https://getcockpit.com/documentation/
services:
  cockpit:
    image: cockpithq/cockpit:core-2.14.1
    volumes:
    - cockpit-config:/var/www/html/config
    - cockpit-spaces:/var/www/html/.spaces
    - cockpit-storage:/var/www/html/storage
