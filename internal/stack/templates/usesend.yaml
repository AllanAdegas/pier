name: useSend
description: Alternativa open source ao Resend, SendGrid, Mailgun e Postmark.
category: E-mail
website: https://docs.usesend.com/self-hosting/overview
tags:
  - resend
  - mailer
  - marketing emails
  - transaction emails
  - self-hosting
  - postmark
routes:
  - service: usesend
    port: 3000
compose: |
  services:
    postgres:
      image: postgres:16
      environment:
        - POSTGRES_USER=${PIER_USER_POSTGRES}
        - POSTGRES_PASSWORD=${PIER_PASSWORD_POSTGRES}
        - POSTGRES_DB=${DB_POSTGRES:-usesend}
      volumes:
        - usesend-postgres-data:/var/lib/postgresql/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 20s
    redis:
      image: redis:7
      command:
        - redis-server
        - --maxmemory-policy
        - noeviction
      volumes:
        - usesend-redis-data:/data
      healthcheck:
        interval: 5s
        retries: 20
        test:
          - CMD
          - redis-cli
          - PING
        timeout: 10s
    usesend:
      image: usesend/usesend:latest
      environment:
        - DATABASE_URL=postgresql://${PIER_USER_POSTGRES}:${PIER_PASSWORD_POSTGRES}@postgres:5432/${DB_POSTGRES:-usesend}
        - NEXTAUTH_URL=${PIER_URL_USESEND}
        - NEXTAUTH_SECRET=${PIER_PASSWORD_64_NEXTAUTHSECRET}
        - AWS_ACCESS_KEY=${AWS_ACCESS_KEY:?}
        - AWS_SECRET_KEY=${AWS_SECRET_KEY:?}
        - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:?}
        - GITHUB_ID=${GITHUB_ID:?}
        - GITHUB_SECRET=${GITHUB_SECRET:?}
        - REDIS_URL=redis://redis:6379
        - NEXT_PUBLIC_IS_CLOUD=${NEXT_PUBLIC_IS_CLOUD:-false}
        - API_RATE_LIMIT=${API_RATE_LIMIT:-1}
        - HOSTNAME=0.0.0.0
      expose:
        - 3000
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - wget -qO- http://usesend:3000 || exit 1
        timeout: 2s
  volumes:
    usesend-postgres-data: null
    usesend-redis-data: null
