name: pgAdmin
description: Administração de bancos PostgreSQL via web.
description_en: Web administration for PostgreSQL databases.
category: Dados
website: https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html
services:
  pgadmin:
    image: dpage/pgadmin4:9.19.0
    port: 80
    data: /var/lib/pgadmin
    env:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?}
