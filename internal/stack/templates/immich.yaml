name: Immich
description: Gestão de fotos e vídeos auto-hospedada.
description_en: Self-hosted photo and video management.
category: Mídia
website: https://immich.app/docs/overview/introduction
services:
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0
    data: /var/lib/postgresql/data
    env:
      DB_STORAGE_TYPE: ${DB_STORAGE_TYPE:-SSD}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_PASSWORD: ${PIER_PASSWORD_POSTGRES}
      POSTGRES_USER: ${PIER_USER_POSTGRES}
    health: 'cmd: pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
  immich:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.3.6}
    port: 2283
    volumes:
    - immich-uploads:/usr/src/app/upload
    - /etc/localtime:/etc/localtime:ro
    env:
      UPLOAD_LOCATION: ./library
      DB_DATA_LOCATION: ./postgres
      DB_PASSWORD: $PIER_PASSWORD_POSTGRES
      DB_USERNAME: $PIER_USER_POSTGRES
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-immich}
      TZ: ${TZ:-Etc/UTC}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3.3.6}
    data: /cache
    env:
      UPLOAD_LOCATION: ./library
      DB_DATA_LOCATION: ./postgres
      DB_PASSWORD: $PIER_PASSWORD_POSTGRES
      DB_USERNAME: $PIER_USER_POSTGRES
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-immich}
      TZ: ${TZ:-Etc/UTC}
with:
  redis: {}
