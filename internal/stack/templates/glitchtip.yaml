name: GlitchTip
description: Sistema de rastreamento de erros.
category: Monitoramento
website: https://glitchtip.com
tags:
  - error
  - tracking
  - sentry
routes:
  - service: web
    port: 8000
compose: |
  services:
    migrate:
      image: glitchtip/glitchtip:6.0
      command: ./manage.py migrate
      restart: "no"
      environment:
        - DATABASE_URL=postgres://$PIER_USER_POSTGRESQL:$PIER_PASSWORD_POSTGRESQL@postgres:5432/${POSTGRESQL_DATABASE:-glitchtip}
        - SECRET_KEY=$PIER_PASSWORD_64_ENCRYPTION
        - EMAIL_URL=${EMAIL_URL:-consolemail://}
        - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-test@example.com}
        - CELERY_WORKER_AUTOSCALE=${CELERY_WORKER_AUTOSCALE:-1,3}
        - CELERY_WORKER_MAX_TASKS_PER_CHILD=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
    postgres:
      image: postgres:16-alpine
      environment:
        - POSTGRES_USER=${PIER_USER_POSTGRESQL}
        - POSTGRES_PASSWORD=${PIER_PASSWORD_POSTGRESQL}
        - POSTGRES_DB=${POSTGRESQL_DATABASE:-glitchtip}
      volumes:
        - glitchtip-postgres-data:/var/lib/postgresql/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 20s
    redis:
      image: redis
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - redis-cli
          - ping
        timeout: 20s
    web:
      image: glitchtip/glitchtip:6.0
      environment:
        - DATABASE_URL=postgres://$PIER_USER_POSTGRESQL:$PIER_PASSWORD_POSTGRESQL@postgres:5432/${POSTGRESQL_DATABASE:-glitchtip}
        - SECRET_KEY=$PIER_PASSWORD_64_ENCRYPTION
        - EMAIL_URL=${EMAIL_URL:-consolemail://}
        - GLITCHTIP_DOMAIN=${PIER_URL_WEB}
        - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-test@example.com}
        - CELERY_WORKER_AUTOSCALE=${CELERY_WORKER_AUTOSCALE:-1,3}
        - CELERY_WORKER_MAX_TASKS_PER_CHILD=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
      volumes:
        - uploads:/code/uploads
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - echo
          - ok
        timeout: 20s
    worker:
      image: glitchtip/glitchtip:6.0
      command: ./bin/run-celery-with-beat.sh
      environment:
        - DATABASE_URL=postgres://$PIER_USER_POSTGRESQL:$PIER_PASSWORD_POSTGRESQL@postgres:5432/${POSTGRESQL_DATABASE:-glitchtip}
        - SECRET_KEY=$PIER_PASSWORD_64_ENCRYPTION
        - EMAIL_URL=${EMAIL_URL:-consolemail://}
        - GLITCHTIP_DOMAIN=${PIER_URL_WEB}
        - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-test@example.com}
        - CELERY_WORKER_AUTOSCALE=${CELERY_WORKER_AUTOSCALE:-1,3}
        - CELERY_WORKER_MAX_TASKS_PER_CHILD=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
      volumes:
        - uploads:/code/uploads
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - echo
          - ok
        timeout: 20s
  volumes:
    glitchtip-postgres-data: null
    uploads: null
