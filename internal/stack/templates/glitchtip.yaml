name: GlitchTip
description: Sistema de rastreamento de erros.
description_en: Error tracking system.
category: Monitoramento
website: https://glitchtip.com
services:
  migrate:
    image: glitchtip/glitchtip:6.0
    command: ./manage.py migrate
    restart: 'no'
    env:
      DATABASE_URL: postgres://{{postgres.user}}:{{postgres.password}}@postgres:5432/{{postgres.database}}
      SECRET_KEY: $PIER_PASSWORD_64_ENCRYPTION
      EMAIL_URL: ${EMAIL_URL:-consolemail://}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-test@example.com}
      CELERY_WORKER_AUTOSCALE: ${CELERY_WORKER_AUTOSCALE:-1,3}
      CELERY_WORKER_MAX_TASKS_PER_CHILD: ${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
  web:
    image: glitchtip/glitchtip:6.0
    port: 8000
    data: /code/uploads
    env:
      DATABASE_URL: postgres://{{postgres.user}}:{{postgres.password}}@postgres:5432/{{postgres.database}}
      SECRET_KEY: $PIER_PASSWORD_64_ENCRYPTION
      EMAIL_URL: ${EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: ${PIER_URL_WEB}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-test@example.com}
      CELERY_WORKER_AUTOSCALE: ${CELERY_WORKER_AUTOSCALE:-1,3}
      CELERY_WORKER_MAX_TASKS_PER_CHILD: ${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
  worker:
    image: glitchtip/glitchtip:6.0
    data: /code/uploads
    command: ./bin/run-celery-with-beat.sh
    env:
      DATABASE_URL: postgres://{{postgres.user}}:{{postgres.password}}@postgres:5432/{{postgres.database}}
      SECRET_KEY: $PIER_PASSWORD_64_ENCRYPTION
      EMAIL_URL: ${EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: ${PIER_URL_WEB}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-test@example.com}
      CELERY_WORKER_AUTOSCALE: ${CELERY_WORKER_AUTOSCALE:-1,3}
      CELERY_WORKER_MAX_TASKS_PER_CHILD: ${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
with:
  postgres:
    version: '16'
    database: glitchtip
  redis:
    version: '8.2'
