name: PairDrop
description: Compartilhamento de arquivos entre dispositivos.
description_en: File sharing between devices.
category: Produtividade
website: https://pairdrop.net/
services:
  pairdrop:
    image: lscr.io/linuxserver/pairdrop:1.11.2
    port: 3000
    env:
      PUID: '1000'
      PGID: '1000'
      TZ: Europe/Madrid
      DEBUG_MODE: 'false'
