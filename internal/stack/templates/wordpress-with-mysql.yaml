auth: first-visitor
name: WordPress com MySQL
description: Software open source para criar sites, blogs e aplicações.
description_en: Open source software to create websites, blogs and apps.
category: CMS
website: https://wordpress.org
services:
  wordpress:
    image: wordpress:7.1.4
    port: 80
    data: /var/www/html
    env:
      WORDPRESS_DB_HOST: '{{mysql.host}}'
      WORDPRESS_DB_USER: '{{mysql.user}}'
      WORDPRESS_DB_PASSWORD: '{{mysql.password}}'
      WORDPRESS_DB_NAME: '{{mysql.database}}'
with:
  mysql:
    version: '8.0'
    database: wordpress
