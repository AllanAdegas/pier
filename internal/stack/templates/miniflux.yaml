name: Miniflux
description: Leitor de feeds minimalista.
description_en: Minimalist feed reader.
category: RSS
website: https://miniflux.app/docs/index.html
services:
  miniflux:
    image: ghcr.io/miniflux/miniflux:2.3.5
    port: 8080
    env:
      BASE_URL: ${PIER_URL_MINIFLUX}
      PORT: ${PORT:-8080}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      CREATE_ADMIN: ${CREATE_ADMIN:-1}
      ADMIN_USERNAME: ${PIER_USER_ADMIN}
      ADMIN_PASSWORD: ${PIER_PASSWORD_64_ADMIN}
      DATABASE_URL: postgres://{{postgres.user}}:{{postgres.password}}@postgres:5432/{{postgres.database}}?sslmode=disable
with:
  postgres:
    version: '16'
    database: miniflux-db
