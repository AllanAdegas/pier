name: PG Back Web
description: Backups de PostgreSQL com interface web.
description_en: PostgreSQL backups with a web interface.
category: Desenvolvimento
website: https://github.com/eduardolat/pgbackweb
services:
  pgbackweb:
    image: eduardolat/pgbackweb:0.5.2
    port: 8085
    data: /backups
    env:
      PBW_ENCRYPTION_KEY: ${PIER_PASSWORD_64_PGBACKWEB}
      PBW_POSTGRES_CONN_STRING: postgresql://{{postgres.user}}:{{postgres.password}}@postgres:5432/{{postgres.database}}?sslmode=disable
      TZ: ${TIME_ZONE:-UTC}
with:
  postgres:
    database: pgbackweb-db
