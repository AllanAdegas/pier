name: Dashy
description: Painel pessoal com verificação de status, widgets e temas.
description_en: Personal dashboard with status checks, widgets and themes.
category: Produtividade
website: https://dashy.to/docs
services:
  dashy:
    image: lissy93/dashy:4.9.17
    port: 8080
    volumes:
    - ./dashy/conf.yml:/app/public/conf.yml
    env:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TIMEZONE:-UTC}
