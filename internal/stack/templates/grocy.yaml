name: Grocy
description: Gestão da casa e lista de compras via web.
category: Produtividade
website: https://github.com/grocy/grocy
tags:
  - groceries
  - household
  - management
  - grocery
  - shopping
routes:
  - service: grocy
    port: 80
compose: |
  services:
    grocy:
      image: lscr.io/linuxserver/grocy:4.6.0
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=Europe/Madrid
      volumes:
        - grocy-config:/config
      healthcheck:
        interval: 2s
        retries: 15
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:80
        timeout: 10s
  volumes:
    grocy-config: null
