auth: first-visitor
name: Grocy
description: Gestão da casa e lista de compras via web.
description_en: Household management and shopping list on the web.
category: Produtividade
website: https://github.com/grocy/grocy
services:
  grocy:
    image: lscr.io/linuxserver/grocy:4.6.0
    private: true
    port: 80
    data: /config
    env:
      PUID: '1000'
      PGID: '1000'
      TZ: Europe/Madrid
