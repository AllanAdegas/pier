auth: first-visitor
name: Windmill
description: Plataforma para automações de vários passos e aplicações internas.
description_en: Platform for multi-step automations and internal apps.
category: Automação
website: https://www.windmill.dev/docs/
services:
  lsp:
    image: ghcr.io/windmill-labs/windmill-lsp:1.603.4
    data: /root/.cache
  windmill-server:
    image: ghcr.io/windmill-labs/windmill:1.866.0
    private: true
    port: 8000
    data: /tmp/windmill/logs
    env:
      DATABASE_URL: postgres://{{db.user}}:{{db.password}}@db/{{db.database}}
      MODE: server
      SUPERADMIN_SECRET: ${PIER_SECRET_WINDMILLADMIN}
      BASE_URL: ${PIER_URL_WINDMILL_SERVER}
  windmill-worker-1:
    image: ghcr.io/windmill-labs/windmill:1.866.0
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - worker-dependency-cache:/tmp/windmill/cache
    - worker-logs:/tmp/windmill/logs
    env:
      DATABASE_URL: postgres://{{db.user}}:{{db.password}}@db/{{db.database}}
      MODE: worker
      WORKER_GROUP: default
  windmill-worker-2:
    image: ghcr.io/windmill-labs/windmill:1.866.0
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - worker-dependency-cache:/tmp/windmill/cache
    - worker-logs:/tmp/windmill/logs
    env:
      DATABASE_URL: postgres://{{db.user}}:{{db.password}}@db/{{db.database}}
      MODE: worker
      WORKER_GROUP: default
  windmill-worker-3:
    image: ghcr.io/windmill-labs/windmill:1.866.0
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - worker-dependency-cache:/tmp/windmill/cache
    - worker-logs:/tmp/windmill/logs
    env:
      DATABASE_URL: postgres://{{db.user}}:{{db.password}}@db/{{db.database}}
      MODE: worker
      WORKER_GROUP: default
  windmill-worker-native:
    image: ghcr.io/windmill-labs/windmill:1.866.0
    data: /tmp/windmill/logs
    env:
      DATABASE_URL: postgres://{{db.user}}:{{db.password}}@db/{{db.database}}
      MODE: worker
      WORKER_GROUP: native
      NUM_WORKERS: '8'
      SLEEP_QUEUE: '200'
with:
  db:
    kind: postgres
    version: '16'
    shm_size: 1g
    database: windmill-db
