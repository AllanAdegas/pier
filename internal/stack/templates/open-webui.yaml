name: Open WebUI
description: Interface amigável para IA (Ollama, API da OpenAI e outras).
category: IA
website: https://docs.openwebui.com
tags:
  - ai
  - models
  - deployment
  - open-web-ui
  - integration
routes:
  - service: open-webui
    port: 8080
compose: |
  services:
    open-webui:
      image: ghcr.io/open-webui/open-webui:main
      volumes:
        - open-webui:/app/backend/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:8080
        timeout: 30s
  volumes:
    open-webui: null
