name: Snapdrop
description: Transferência de arquivos na rede local ou pela internet.
category: Produtividade
website: https://github.com/RobinLinus/snapdrop
tags:
  - file
  - sharing
  - transfer
  - local
  - network
  - internet
routes:
  - service: snapdrop
    port: 80
compose: |
  services:
    snapdrop:
      image: linuxserver/snapdrop:version-b8b78cc2
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=Europe/Madrid
      volumes:
        - snapdrop-config:/config
      healthcheck:
        interval: 2s
        retries: 15
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:80
        timeout: 10s
  volumes:
    snapdrop-config: null
