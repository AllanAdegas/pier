name: Lidarr
description: Gestão de coleção de músicas para Usenet e BitTorrent.
description_en: Music collection manager for Usenet and BitTorrent.
category: Mídia
website: https://hub.docker.com/r/linuxserver/lidarr
services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls40
    port: 8686
    volumes:
    - lidarr-config:/config
    - lidarr-music:/music
    - lidarr-downloads:/downloads
    env:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-America/Toronto}
