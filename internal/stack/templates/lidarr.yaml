name: Lidarr
description: Gestão de coleção de músicas para Usenet e BitTorrent.
category: Mídia
website: https://hub.docker.com/r/linuxserver/lidarr
tags:
  - media
  - server
  - music
  - audio
routes:
  - service: lidarr
    port: 8686
compose: |
  services:
    lidarr:
      image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls40
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=${TZ:-America/Toronto}
      volumes:
        - lidarr-config:/config
        - lidarr-music:/music
        - lidarr-downloads:/downloads
      healthcheck:
        interval: 2s
        retries: 15
        test:
          - CMD
          - curl
          - -f
          - http://localhost:8686
        timeout: 10s
  volumes:
    lidarr-config: null
    lidarr-downloads: null
    lidarr-music: null
