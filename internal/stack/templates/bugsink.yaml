name: Bugsink
description: Rastreamento de erros auto-hospedado.
category: Monitoramento
website: https://www.bugsink.com/docs/
tags:
  - python
  - error-tracking
  - django
  - mysql
routes:
  - service: web
    port: 8000
compose: |
  services:
    mysql:
      image: mysql:latest
      restart: unless-stopped
      environment:
        - MYSQL_ROOT_PASSWORD=${PIER_PASSWORD_MYSQLROOT}
        - MYSQL_DATABASE=${MYSQL_DATABASE:-bugsink}
        - MYSQL_USER=${PIER_USER_MYSQL}
        - MYSQL_PASSWORD=${PIER_PASSWORD_MYSQL}
      volumes:
        - my-datavolume:/var/lib/mysql
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - mysqladmin
          - ping
          - -h
          - 127.0.0.1
        timeout: 20s
    web:
      image: bugsink/bugsink
      restart: unless-stopped
      environment:
        - SECRET_KEY=$PIER_PASSWORD_64_BUGSINK
        - CREATE_SUPERUSER=${BUGSINK_ADMIN_EMAIL:?}:$PIER_PASSWORD_BUGSINK
        - BASE_URL=$PIER_URL_WEB
        - DATABASE_URL=mysql://${PIER_USER_MYSQL}:$PIER_PASSWORD_MYSQL@mysql:3306/${MYSQL_DATABASE:-bugsink}
        - BEHIND_HTTPS_PROXY=True
        - SITE_TITLE=${SITE_TITLE:-Bugsink}
        - TIME_ZONE=${TIME_ZONE:-UTC}
        - PHONEHOME=${PHONEHOME:-False}
        - EMAIL_HOST=${EMAIL_HOST}
        - EMAIL_PORT=${EMAIL_PORT:-587}
        - EMAIL_HOST_USER=${EMAIL_HOST_USER}
        - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
        - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
        - EMAIL_USE_SSL=${EMAIL_USE_SSL:-False}
        - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      depends_on:
        mysql:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - python -c 'import requests; requests.get("http://localhost:8000/").raise_for_status()'
        timeout: 20s
  volumes:
    my-datavolume: null
