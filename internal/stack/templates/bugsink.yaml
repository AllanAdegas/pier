name: Bugsink
description: Rastreamento de erros auto-hospedado.
description_en: Self-hosted error tracking.
category: Monitoramento
website: https://www.bugsink.com/docs/
services:
  web:
    image: bugsink/bugsink:2.6.3
    port: 8000
    env:
      SECRET_KEY: $PIER_PASSWORD_64_BUGSINK
      CREATE_SUPERUSER: ${BUGSINK_ADMIN_EMAIL:?}:$PIER_PASSWORD_BUGSINK
      BASE_URL: $PIER_URL_WEB
      DATABASE_URL: mysql://{{mysql.user}}:{{mysql.password}}@mysql:3306/{{mysql.database}}
      BEHIND_HTTPS_PROXY: 'True'
      SITE_TITLE: ${SITE_TITLE:-Bugsink}
      TIME_ZONE: ${TIME_ZONE:-UTC}
      PHONEHOME: ${PHONEHOME:-False}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
with:
  mysql:
    database: bugsink
