name: Logto
description: Solução de identidade completa, do front ao backend.
category: Autenticação
website: https://docs.logto.io/docs/tutorials/get-started/#logto-oss-self-hosted
tags:
  - logto
  - identity
  - login
  - authentication
  - oauth
  - oidc
  - openid
routes:
  - service: logto
    port: 3001
compose: |
  services:
    logto:
      image: svhd/logto:${TAG-latest}
      entrypoint:
        - sh
        - -c
        - npm run cli db seed -- --swe && npm run alteration deploy latest && npm start
      environment:
        - TRUST_PROXY_HEADER=1
        - DB_URL=postgres://${PIER_USER_POSTGRES}:${PIER_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-logto}
        - ENDPOINT=$LOGTO_ENDPOINT
        - ADMIN_ENDPOINT=$LOGTO_ADMIN_ENDPOINT
      depends_on:
        postgres:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - exit 0
        timeout: 20s
    postgres:
      image: postgres:14-alpine
      user: postgres
      environment:
        POSTGRES_DB: ${POSTGRES_DB:-logto}
        POSTGRES_PASSWORD: ${PIER_PASSWORD_POSTGRES}
        POSTGRES_USER: ${PIER_USER_POSTGRES}
      volumes:
        - logto-postgres-data:/var/lib/postgresql/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - pg_isready
          - -U
          - $PIER_USER_POSTGRES
          - -d
          - $POSTGRES_DB
        timeout: 20s
  volumes:
    logto-postgres-data: null
