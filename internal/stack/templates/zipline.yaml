name: Zipline
description: Servidor de upload de arquivos compatível com ShareX, fácil de configurar.
description_en: ShareX-compatible file upload server, easy to configure.
category: Mídia
website: https://zipline.diced.sh/docs/config
services:
  zipline:
    image: ghcr.io/diced/zipline:4.8.3
    port: 3000
    volumes:
    - zipline-uploads:/zipline/uploads
    - zipline-public:/zipline/public
    env:
      CORE_RETURN_HTTPS: ${CORE_RETURN_HTTPS:-false}
      CORE_SECRET: ${PIER_PASSWORD_64_ZIPLINE}
      DATABASE_URL: postgres://{{postgres.user}}:{{postgres.password}}@postgres/{{postgres.database}}
      CORE_LOGGER: ${CORE_LOGGER:-true}
with:
  postgres:
    version: '16'
    database: zipline-db
