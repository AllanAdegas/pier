name: Linkwarden
description: Gerenciador de favoritos colaborativo que preserva as páginas.
description_en: Collaborative bookmark manager that preserves pages.
category: Produtividade
website: https://docs.linkwarden.app/self-hosting/setup
services:
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.16.1
    port: 3000
    data: /data/data
    env:
      NEXTAUTH_URL: ${PIER_URL_LINKWARDEN}/api/v1/auth
      NEXTAUTH_SECRET: ${PIER_PASSWORD_LINKWARDENNEXTAUTH}
      MEILI_MASTER_KEY: ${PIER_PASSWORD_MEILI}
      DATABASE_URL: postgresql://{{postgresql.user}}:{{postgresql.password}}@postgresql:5432/{{postgresql.database}}
    depends_on:
      meilisearch:
        condition: service_healthy
      postgresql:
        condition: service_healthy
  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    data: /meili_data
    env:
      MEILI_MASTER_KEY: ${PIER_PASSWORD_MEILI}
    health:
    - CMD
    - curl
    - -f
    - http://127.0.0.1:7700/health
with:
  postgresql:
    kind: postgres
    version: '16'
    database: linkwarden
