name: Tolgee
description: Plataforma de gestão de localização para desenvolvedores e tradutores.
description_en: Localization management platform for developers and translators.
category: Produtividade
website: https://tolgee.io/
services:
  tolgee:
    image: tolgee/tolgee:v3.242.5
    port: 8080
    data: /data
    env:
      TOLGEE_AUTHENTICATION_ENABLED: 'true'
      TOLGEE_AUTHENTICATION_INITIAL_PASSWORD: $PIER_PASSWORD_TOLGEE
      TOLGEE_AUTHENTICATION_INITIAL_USERNAME: admin
      TOLGEE_AUTHENTICATION_JWT_SECRET: $PIER_PASSWORD_JWT
      TOLGEE_POSTGRES_AUTOSTART_ENABLED: 'false'
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/${POSTGRES_DB:-tolgee}
      SPRING_DATASOURCE_USERNAME: '{{postgresql.user}}'
      SPRING_DATASOURCE_PASSWORD: '{{postgresql.password}}'
with:
  postgresql:
    kind: postgres
    version: '16'
    database: tolgee
