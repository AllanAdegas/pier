name: Snipe-IT
description: Gestão de ativos de TI open source.
description_en: Open source IT asset management.
category: Produtividade
website: https://snipe-it.readme.io/docs/introduction
services:
  app:
    image: snipe/snipe-it:v8.7.1
    port: 80
    data: /var/lib/snipeit
    env:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: base64:${PIER_BASE64_32_APPKEY}
      APP_URL: ${PIER_URL_APP}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      APP_LOCALE: ${APP_LOCALE:-en-US}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: '3306'
      DB_DATABASE: '{{mariadb.database}}'
      DB_USERNAME: '{{mariadb.user}}'
      DB_PASSWORD: '{{mariadb.password}}'
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-null}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_FROM_ADDR: ${MAIL_FROM_ADDR:-you@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Snipe-IT}
with:
  mariadb:
    version: '11.8'
    database: snipeit
