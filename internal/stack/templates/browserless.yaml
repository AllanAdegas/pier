name: Browserless
description: Chrome headless como serviço.
description_en: Headless Chrome as a service.
category: Desenvolvimento
website: https://docs.browserless.io/
services:
  browserless:
    image: ghcr.io/browserless/chromium:v2.61.0
    port: 3000
    expose:
    - 3000
    env:
      TOKEN: $PIER_PASSWORD_BROWSERLESS
