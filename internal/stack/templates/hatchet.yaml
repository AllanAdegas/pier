name: Hatchet
description: Tarefas em segundo plano em escala, sobre uma fila tolerante a falhas.
category: Automação
website: https://docs.hatchet.run/self-hosting/docker-compose
tags:
  - ai-agents
  - background-tasks
  - data-pipelines
  - scheduling
routes:
  - service: hatchet-dashboard
    port: 80
  - service: rabbitmq
    port: 15672
compose: |
  services:
    hatchet-dashboard:
      image: ghcr.io/hatchet-dev/hatchet/hatchet-dashboard:latest
      command: sh ./entrypoint.sh --config /hatchet/config
      environment:
        - DATABASE_URL=postgres://$PIER_USER_POSTGRES:$PIER_PASSWORD_POSTGRES@postgres:5432/$POSTGRES_DB
      volumes:
        - hatchet-certs:/hatchet/certs
        - hatchet-config:/hatchet/config
      depends_on:
        migration:
          condition: service_completed_successfully
        postgres:
          condition: service_healthy
        rabbitmq:
          condition: service_healthy
        setup-config:
          condition: service_completed_successfully
    hatchet-engine:
      image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:latest
      command: /hatchet/hatchet-engine --config /hatchet/config
      restart: on-failure
      environment:
        - DATABASE_URL=postgres://$PIER_USER_POSTGRES:$PIER_PASSWORD_POSTGRES@postgres:5432/$POSTGRES_DB
        - SERVER_GRPC_BIND_ADDRESS=${SERVER_GRPC_BIND_ADDRESS:-0.0.0.0}
        - SERVER_GRPC_INSECURE=${SERVER_GRPC_INSECURE:-t}
      volumes:
        - hatchet-certs:/hatchet/certs
        - hatchet-config:/hatchet/config
      depends_on:
        migration:
          condition: service_completed_successfully
        postgres:
          condition: service_healthy
        rabbitmq:
          condition: service_healthy
        setup-config:
          condition: service_completed_successfully
    migration:
      image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:latest
      command: /hatchet/hatchet-migrate
      restart: "no"
      environment:
        - DATABASE_URL=postgres://$PIER_USER_POSTGRES:$PIER_PASSWORD_POSTGRES@postgres:5432/$POSTGRES_DB
      depends_on:
        postgres:
          condition: service_healthy
    postgres:
      image: postgres:16-alpine
      environment:
        - POSTGRES_USER=$PIER_USER_POSTGRES
        - POSTGRES_PASSWORD=$PIER_PASSWORD_POSTGRES
        - POSTGRES_DB=${POSTGRES_DB:-hatchet}
      volumes:
        - postgresql-data:/var/lib/postgresql/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 20s
    rabbitmq:
      image: rabbitmq:3-management
      hostname: rabbitmq
      environment:
        - RABBITMQ_DEFAULT_USER=$PIER_USER_RABBITMQ
        - RABBITMQ_DEFAULT_PASS=$PIER_PASSWORD_RABBITMQ
        - PORT=${RABBITMQ_PORT:-5672}
      volumes:
        - rabbitmq-data:/var/lib/rabbitmq/
      healthcheck:
        interval: 5s
        retries: 10
        test: rabbitmq-diagnostics -q ping
        timeout: 30s
    setup-config:
      image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:latest
      command: /hatchet/hatchet-admin quickstart --skip certs --generated-config-dir /hatchet/config --overwrite=false
      restart: "no"
      environment:
        - DATABASE_URL=postgres://$PIER_USER_POSTGRES:$PIER_PASSWORD_POSTGRES@postgres:5432/$POSTGRES_DB
        - SERVER_TASKQUEUE_RABBITMQ_URL=amqp://$PIER_USER_RABBITMQ:$PIER_PASSWORD_RABBITMQ@rabbitmq:5672/
        - SERVER_AUTH_COOKIE_DOMAIN=${SERVER_AUTH_COOKIE_DOMAIN:-localhost:8080}
        - SERVER_AUTH_COOKIE_INSECURE=${SERVER_AUTH_COOKIE_INSECURE:-t}
        - SERVER_GRPC_BIND_ADDRESS=${SERVER_GRPC_BIND_ADDRESS:-0.0.0.0}
        - SERVER_GRPC_INSECURE=${SERVER_GRPC_INSECURE:-t}
        - SERVER_GRPC_BROADCAST_ADDRESS=${SERVER_GRPC_BROADCAST_ADDRESS:-localhost:7077}
        - SERVER_DEFAULT_ENGINE_VERSION=V1
        - SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS=${SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS:-hatchet-engine:7077}
      volumes:
        - hatchet_certs:/hatchet/certs
        - hatchet_config:/hatchet/config
      depends_on:
        migration:
          condition: service_completed_successfully
        postgres:
          condition: service_healthy
        rabbitmq:
          condition: service_healthy
  volumes:
    hatchet-certs: null
    hatchet-config: null
    hatchet_certs: null
    hatchet_config: null
    postgresql-data: null
    rabbitmq-data: null
