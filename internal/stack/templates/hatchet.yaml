auth: generated
name: Hatchet
description: Tarefas em segundo plano em escala, sobre uma fila tolerante a falhas.
description_en: Background tasks at scale, on a fault-tolerant queue.
category: Automação
website: https://docs.hatchet.run/self-hosting/docker-compose
services:
  hatchet-dashboard:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-dashboard:v0.120.0
    private: true
    port: 80
    command: sh ./entrypoint.sh --config /hatchet/config
    volumes:
    - hatchet-certs:/hatchet/certs
    - hatchet-config:/hatchet/config
    env:
      DATABASE_URL: postgres://{{postgres.user}}:{{postgres.password}}@postgres:5432/{{postgres.database}}
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      setup-config:
        condition: service_completed_successfully
  hatchet-engine:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:v0.120.0
    command: /hatchet/hatchet-engine --config /hatchet/config
    restart: on-failure
    volumes:
    - hatchet-certs:/hatchet/certs
    - hatchet-config:/hatchet/config
    env:
      DATABASE_URL: postgres://{{postgres.user}}:{{postgres.password}}@postgres:5432/{{postgres.database}}
      SERVER_GRPC_BIND_ADDRESS: ${SERVER_GRPC_BIND_ADDRESS:-0.0.0.0}
      SERVER_GRPC_INSECURE: ${SERVER_GRPC_INSECURE:-t}
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      setup-config:
        condition: service_completed_successfully
  migration:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:v0.120.0
    command: /hatchet/hatchet-migrate
    restart: 'no'
    env:
      DATABASE_URL: postgres://{{postgres.user}}:{{postgres.password}}@postgres:5432/{{postgres.database}}
  rabbitmq:
    image: rabbitmq:3-management
    private: true
    port: 15672
    data: /var/lib/rabbitmq/
    hostname: rabbitmq
    env:
      RABBITMQ_DEFAULT_USER: $PIER_USER_RABBITMQ
      RABBITMQ_DEFAULT_PASS: $PIER_PASSWORD_RABBITMQ
      PORT: ${RABBITMQ_PORT:-5672}
    health: 'cmd: rabbitmq-diagnostics -q ping'
  setup-config:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:v0.120.0
    command: /hatchet/hatchet-admin quickstart --skip certs --generated-config-dir /hatchet/config --overwrite=false
    restart: 'no'
    volumes:
    - hatchet-certs:/hatchet/certs
    - hatchet-config:/hatchet/config
    env:
      DATABASE_URL: postgres://{{postgres.user}}:{{postgres.password}}@postgres:5432/{{postgres.database}}
      SERVER_TASKQUEUE_RABBITMQ_URL: amqp://$PIER_USER_RABBITMQ:$PIER_PASSWORD_RABBITMQ@rabbitmq:5672/
      SERVER_AUTH_COOKIE_DOMAIN: ${SERVER_AUTH_COOKIE_DOMAIN:-localhost:8080}
      SERVER_AUTH_COOKIE_INSECURE: 'false'
      # Read by the seed step of "hatchet-admin quickstart" (hatchet v0.120.0,
      # pkg/config/database: ADMIN_EMAIL, ADMIN_PASSWORD, ADMIN_NAME). The
      # password must hold upper, lower and a digit, hence the fixed prefix.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: Hx9k${PIER_PASSWORD_32_HATCHETADMIN}
      SERVER_GRPC_BIND_ADDRESS: ${SERVER_GRPC_BIND_ADDRESS:-0.0.0.0}
      SERVER_GRPC_INSECURE: ${SERVER_GRPC_INSECURE:-t}
      SERVER_GRPC_BROADCAST_ADDRESS: ${SERVER_GRPC_BROADCAST_ADDRESS:-localhost:7077}
      SERVER_DEFAULT_ENGINE_VERSION: V1
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: ${SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS:-hatchet-engine:7077}
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
with:
  postgres:
    version: '16'
    database: hatchet
