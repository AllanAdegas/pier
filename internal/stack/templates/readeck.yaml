name: Readeck
description: Guarde para sempre o conteúdo das páginas que você quer ler.
description_en: Keep forever the content of the pages you want to read.
category: Produtividade
website: https://readeck.org/en/docs/
services:
  readeck:
    image: codeberg.org/readeck/readeck:0.23.5
    port: 8000
    data: /readeck
    env:
      READECK_USE_X_FORWARDED: ${READECK_USE_X_FORWARDED:-true}
