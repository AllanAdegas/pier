name: Plex
description: Organiza vídeo, música e fotos e transmite para qualquer dispositivo.
description_en: Organizes video, music and photos and streams them to any device.
category: Mídia
website: https://docs.linuxserver.io/images/docker-plex/
services:
  plex:
    image: lscr.io/linuxserver/plex:1.43.5
    port: 32400
    volumes:
    - plex-config:/config
    - plex-tv:/tv
    - plex-movies:/movies
    env:
      _APP_URL: $PIER_URL_PLEX
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-America/Toronto}
      PLEX_CLAIM: ${PLEX_CLAIM}
