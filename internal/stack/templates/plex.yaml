name: Plex
description: Organiza vídeo, música e fotos e transmite para qualquer dispositivo.
category: Mídia
website: https://docs.linuxserver.io/images/docker-plex/
tags:
  - media
  - server
  - movies
  - tv
  - music
routes:
  - service: plex
    port: 32400
compose: |
  services:
    plex:
      image: lscr.io/linuxserver/plex:latest
      environment:
        - _APP_URL=$PIER_URL_PLEX
        - PUID=1000
        - PGID=1000
        - TZ=${TZ:-America/Toronto}
        - PLEX_CLAIM=${PLEX_CLAIM}
      volumes:
        - plex-config:/config
        - plex-tv:/tv
        - plex-movies:/movies
      healthcheck:
        interval: 2s
        retries: 15
        test:
          - CMD
          - curl
          - -f
          - http://localhost:32400/identity
        timeout: 10s
  volumes:
    plex-config: null
    plex-movies: null
    plex-tv: null
