name: FreeScout
description: Help desk e caixa de entrada compartilhada, leve e open source.
description_en: Lightweight, open source help desk and shared inbox.
category: Atendimento
website: https://github.com/freescout-help-desk/freescout/wiki/
services:
  freescout:
    image: nfrastack/freescout:2.2.24
    port: 80
    volumes:
    - freescout-data:/data
    - freescout-logs:/www/logs
    env:
      DB_HOST: mariadb
      DB_NAME: '{{mariadb.database}}'
      DB_USER: '{{mariadb.user}}'
      DB_PASS: '{{mariadb.password}}'
      SITE_URL: ${PIER_URL_FREESCOUT}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASS: ${PIER_PASSWORD_ADMIN}
      DISPLAY_ERRORS: ${DISPLAY_ERRORS:-FALSE}
      TIMEZONE: ${TIMEZONE:-UTC}
with:
  mariadb:
    version: '11.8'
