name: Moodle
description: Plataforma de ensino a distância.
category: CMS
website: https://moodle.org
tags:
  - moodle
  - elearning
  - education
  - lms
  - cms
  - code
routes:
  - service: moodle
    port: 8080
compose: |
  services:
    mariadb:
      image: mariadb:11.1
      environment:
        - ALLOW_EMPTY_PASSWORD=no
        - MYSQL_ROOT_PASSWORD=$PIER_PASSWORD_ROOT
        - MYSQL_DATABASE=bitnami_moodle
        - MYSQL_USER=$PIER_USER_MARIADB
        - MYSQL_PASSWORD=$PIER_PASSWORD_MARIADB
        - MARIADB_CHARACTER_SET=utf8mb4
        - MARIADB_COLLATE=utf8mb4_unicode_ci
      volumes:
        - mariadb-data:/var/lib/mysql
      healthcheck:
        interval: 10s
        retries: 5
        test:
          - CMD-SHELL
          - bash -c '</dev/tcp/localhost/3306'
        timeout: 5s
    moodle:
      image: docker.io/bitnamilegacy/moodle:4.3
      environment:
        - MOODLE_DATABASE_HOST=mariadb
        - MOODLE_DATABASE_PORT_NUMBER=3306
        - MOODLE_DATABASE_USER=$PIER_USER_MARIADB
        - MOODLE_DATABASE_NAME=bitnami_moodle
        - MOODLE_DATABASE_PASSWORD=$PIER_PASSWORD_MARIADB
        - ALLOW_EMPTY_PASSWORD=no
        - MOODLE_USERNAME=${MOODLE_USERNAME:-user}
        - MOODLE_PASSWORD=$PIER_PASSWORD_MOODLE
        - MOODLE_EMAIL=user@example.com
        - MOODLE_SITE_NAME=${MOODLE_SITE_NAME:-New Site}
      volumes:
        - moodle-data:/bitnami/moodle
        - moodledata-data:/bitnami/moodledata
      depends_on:
        - mariadb
      healthcheck:
        interval: 20s
        retries: 5
        test:
          - CMD
          - php
          - -r
          - 'exit(file_exists(''/opt/bitnami/moodle/config.php'') ? 0 : 1);'
        timeout: 10s
  volumes:
    mariadb-data: null
    moodle-data: null
    moodledata-data: null
