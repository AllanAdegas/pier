name: Neon WS Proxy
description: Proxy WebSocket para usar o driver serverless da Neon com o seu Postgres.
description_en: WebSocket proxy to use Neon's serverless driver with your own Postgres.
category: Rede
website: https://neon.tech
services:
  neon-proxy:
    image: ghcr.io/neondatabase/wsproxy@sha256:7f2e2149aa6a57ba382a140102fba44f5053f3e44389ccc18adcecf896054efb
    port: 2112
    env:
      APPEND_PORT: postgres:5432
      ALLOW_ADDR_REGEX: .*
      LOG_TRAFFIC: 'false'
      LOG_CONN_INFO: 'true'
with:
  postgres:
    env:
      POSTGRES_HOST_AUTH_METHOD: password
    database: postgres
