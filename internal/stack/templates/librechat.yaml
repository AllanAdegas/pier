name: LibreChat
description: Interface de chat para vários modelos de IA, com foco em privacidade.
category: IA
website: https://docs.librechat.ai/install/configuration/dotenv.html
tags:
  - ai
  - chat
  - gpt
  - claude
  - palm
  - openai
  - azure
  - huggingface
routes:
  - service: librechat
    port: 3080
compose: |
  services:
    librechat:
      image: ghcr.io/danny-avila/librechat-dev-api:6ecd1b510faaa593ad954fb6276c18e5f12a8e53
      environment:
        - DOMAIN_CLIENT=${PIER_URL_LIBRECHAT}
        - DOMAIN_SERVER=${PIER_URL_LIBRECHAT}
        - HOST=0.0.0.0
        - PORT=3080
        - MONGO_URI=mongodb://${PIER_USER_MONGO}:${PIER_PASSWORD_MONGO}@mongodb:27017/librechat?authSource=admin
        - MEILI_HOST=http://meilisearch:7700
        - MEILI_MASTER_KEY=${PIER_PASSWORD_MEILI}
        - RAG_PORT=8000
        - RAG_API_URL=http://rag-api:8000
        - JWT_SECRET=${PIER_PASSWORD_JWT}
        - JWT_REFRESH_SECRET=${PIER_PASSWORD_64_JWT}
        - APP_TITLE=${APP_TITLE:-LibreChat}
        - ALLOW_EMAIL_LOGIN=${ALLOW_EMAIL_LOGIN:-true}
        - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
        - ALLOW_SOCIAL_LOGIN=${ALLOW_SOCIAL_LOGIN:-false}
        - ALLOW_SOCIAL_REGISTRATION=${ALLOW_SOCIAL_REGISTRATION:-false}
        - ALLOW_PASSWORD_RESET=${ALLOW_PASSWORD_RESET:-false}
        - ALLOW_UNVERIFIED_EMAIL_LOGIN=${ALLOW_UNVERIFIED_EMAIL_LOGIN:-true}
        - CREDS_KEY=${PIER_PASSWORD_64_CREDS}
        - CREDS_IV=${PIER_PASSWORD_CREDS}
        - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-user_provided}
        - GOOGLE_KEY=${GOOGLE_API_KEY:-user_provided}
        - OPENAI_API_KEY=${OPENAI_API_KEY:-user_provided}
        - ASSISTANTS_API_KEY=${ASSISTANTS_API_KEY:-user_provided}
        - DEBUG_LOGGING=${DEBUG_LOGGING:-false}
        - DEBUG_OPENAI=${DEBUG_OPENAI:-false}
        - DEBUG_PLUGINS=${DEBUG_OPENAI:-false}
        - NO_INDEX=${NO_INDEX:-true}
      volumes:
        - librechat-images:/app/client/public/images
        - librechat-logs:/app/api/logs
        - librechat-uploads:/app/uploads
        - content: |
            version: 1.2.8
          source: ./librechat.yaml
          target: /app/librechat.yaml
          type: bind
      depends_on:
        meilisearch:
          condition: service_healthy
        mongodb:
          condition: service_healthy
        rag-api:
          condition: service_healthy
        vectordb:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 5
        test:
          - CMD
          - wget
          - --no-verbose
          - --tries=1
          - --spider
          - http://127.0.0.1:3080/health
        timeout: 10s
    meilisearch:
      image: getmeili/meilisearch:v1.35.1
      environment:
        - MEILI_MASTER_KEY=${PIER_PASSWORD_MEILI}
        - MEILI_NO_ANALYTICS=${MEILI_NO_ANALYTICS:-false}
        - MEILI_ENV=production
        - MEILI_HOST=http://meilisearch:7700
      volumes:
        - meilisearch-data:/meili_data
      healthcheck:
        interval: 2s
        retries: 15
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:7700/health
        timeout: 10s
    mongodb:
      image: mongo:8
      environment:
        - MONGO_INITDB_ROOT_USERNAME=${PIER_USER_MONGO}
        - MONGO_INITDB_ROOT_PASSWORD=${PIER_PASSWORD_MONGO}
      volumes:
        - mongodb-data:/data/db
      healthcheck:
        interval: 5s
        retries: 3
        test:
          - CMD
          - mongosh
          - --eval
          - db.runCommand('ping').ok
          - 127.0.0.1:27017/test
          - --quiet
        timeout: 10s
    rag-api:
      image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:v0.7.3
      environment:
        - POSTGRES_DB=rag
        - POSTGRES_USER=${PIER_USER_POSTGRES}
        - POSTGRES_PASSWORD=${PIER_PASSWORD_POSTGRES}
        - DB_HOST=vectordb
        - DB_USER=${PIER_USER_POSTGRES}
        - DB_PASSWORD=${PIER_PASSWORD_POSTGRES}
        - DB_NAME=rag
        - RAG_PORT=8000
        - RAG_OPENAI_API_KEY=${OPENAI_API_KEY:-user_provided}
      depends_on:
        vectordb:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - python
          - -c
          - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
        timeout: 10s
    vectordb:
      image: ankane/pgvector:v0.5.1
      environment:
        - POSTGRES_DB=rag
        - POSTGRES_USER=${PIER_USER_POSTGRES}
        - POSTGRES_PASSWORD=${PIER_PASSWORD_POSTGRES}
        - POSTGRES_HOST_AUTH_METHOD=trust
      volumes:
        - vectordb-data:/var/lib/postgresql/data
      healthcheck:
        interval: 2s
        retries: 5
        start_period: 10s
        test:
          - CMD
          - pg_isready
          - --username=$PIER_USER_POSTGRES
          - --host=127.0.0.1
          - --port=5432
          - --dbname=rag
        timeout: 1m
  volumes:
    librechat-images: null
    librechat-logs: null
    librechat-uploads: null
    meilisearch-data: null
    mongodb-data: null
    vectordb-data: null
