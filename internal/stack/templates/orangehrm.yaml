name: OrangeHRM
description: Gestão de RH open source.
description_en: Open source HR management.
category: Produtividade
website: https://starterhelp.orangehrm.com/hc/en-us
services:
  orangehrm:
    image: orangehrm/orangehrm:5.9
    port: 80
    data: /orangehrm
    env:
      ORANGEHRM_DATABASE_HOST: mariadb
      ORANGEHRM_DATABASE_USER: '{{mariadb.user}}'
      ORANGEHRM_DATABASE_PASSWORD: '{{mariadb.password}}'
      ORANGEHRM_DATABASE_NAME: '{{mariadb.database}}'
with:
  mariadb:
    database: orangehrm-db
