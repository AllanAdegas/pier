name: New API
description: Gateway de LLM e gestão de ativos de IA.
description_en: LLM gateway and AI asset management.
category: Desenvolvimento
website: https://docs.newapi.pro/en/getting-started/
services:
  new-api:
    image: calciumion/new-api:v0.9.2.0
    port: 3000
    env:
      SQL_DSN: postgres://{{postgresql.user}}:{{postgresql.password}}@postgresql:5432/{{postgresql.database}}?sslmode=disable&TimeZone=${TZ:-Asia/Shanghai}
      REDIS_CONN_STRING: redis://redis:6379
      TZ: ${TZ:-Asia/Shanghai}
      SESSION_SECRET: $PIER_PASSWORD_64_SESSION_SECRET
      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED:-true}
with:
  postgresql:
    kind: postgres
    version: '16'
    database: newapi
  redis: {}
