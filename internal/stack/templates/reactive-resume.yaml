name: Reactive Resume
description: Construtor de currículos que respeita a sua privacidade.
category: Produtividade
website: https://rxresu.me/
tags:
  - reactive-resume
  - resume-builder
  - open-source
  - 2fa
routes:
  - service: reactive-resume
    port: 3000
compose: |
  services:
    chrome:
      image: ghcr.io/browserless/chrome:latest
      environment:
        - HEALTH=true
        - TIMEOUT=10000
        - CONCURRENT=10
        - TOKEN=$PIER_PASSWORD_CHROMETOKEN
      healthcheck:
        interval: 10s
        retries: 5
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:3000/
        timeout: 3s
      platform: linux/amd64
    minio:
      image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
      command: server /data --console-address ":9001"
      environment:
        - MINIO_SERVER_URL=$MINIO_SERVER_URL
        - MINIO_BROWSER_REDIRECT_URL=$MINIO_BROWSER_REDIRECT_URL
        - MINIO_ROOT_USER=$PIER_USER_MINIO
        - MINIO_ROOT_PASSWORD=$PIER_PASSWORD_MINIO
      volumes:
        - minio-data:/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - mc
          - ready
          - local
        timeout: 20s
    postgres:
      image: postgres:16-alpine
      environment:
        - POSTGRES_DB=${POSTGRES_DB:-postgres}
        - POSTGRES_USER=$PIER_USER_POSTGRES
        - POSTGRES_PASSWORD=$PIER_PASSWORD_POSTGRES
      volumes:
        - postgres-data:/var/lib/postgresql/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 20s
    reactive-resume:
      image: amruthpillai/reactive-resume:v4.3.7
      environment:
        - PUBLIC_URL=$PIER_URL_REACTIVE_RESUME
        - STORAGE_URL=${PIER_URL_MINIO}/default
        - DATABASE_URL=postgresql://$PIER_USER_POSTGRES:$PIER_PASSWORD_POSTGRES@postgres:5432/${POSTGRES_DB:-postgres}
        - ACCESS_TOKEN_SECRET=$PIER_PASSWORD_ACCESSTOKEN
        - REFRESH_TOKEN_SECRET=$PIER_PASSWORD_REFRESHTOKEN
        - CHROME_TOKEN=$PIER_PASSWORD_CHROMETOKEN
        - CHROME_URL=ws://chrome:3000/chrome
        - REDIS_URL=redis://redis:6379
        - STORAGE_ENDPOINT=minio
        - STORAGE_PORT=9000
        - STORAGE_REGION=us-east-1
        - STORAGE_BUCKET=default
        - STORAGE_ACCESS_KEY=$PIER_USER_MINIO
        - STORAGE_SECRET_KEY=$PIER_PASSWORD_MINIO
        - STORAGE_USE_SSL=false
        - DISABLE_SIGNUPS=${DISABLE_SIGNUPS:-false}
        - DISABLE_EMAIL_AUTH=${DISABLE_EMAIL_AUTH:-false}
      depends_on:
        - postgres
        - minio
        - chrome
      healthcheck:
        interval: 10s
        retries: 5
        start_period: 10s
        test:
          - CMD
          - node
          - -e
          - 'require(''http'').get(''http://127.0.0.1:3000'', res => process.exit(res.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))'
        timeout: 3s
    redis:
      image: redis:7-alpine
      command: redis-server
      volumes:
        - redis_data:/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - redis-cli
          - ping
        timeout: 20s
  volumes:
    minio-data: null
    postgres-data: null
    redis_data: null
