auth: generated
name: Firefox
description: Navegador Firefox rodando no servidor, acessado pelo navegador.
description_en: Firefox browser running on the server, used from your browser.
category: Produtividade
website: https://github.com/jlesage/docker-firefox
services:
  firefox:
    image: jlesage/firefox:v26.09.1
    port: 5800
    data: /config
    env:
      WEB_AUTHENTICATION: '1'
      WEB_AUTHENTICATION_ALLOW_INSECURE: '1'
      WEB_AUTHENTICATION_USERNAME: ${PIER_USER_FIREFOX}
      WEB_AUTHENTICATION_PASSWORD: ${PIER_PASSWORD_FIREFOX}
