name: Fizzy
description: Kanban para issues e ideias, da 37signals.
description_en: Kanban for issues and ideas, by 37signals.
category: Produtividade
website: https://github.com/basecamp/fizzy
services:
  fizzy:
    image: ghcr.io/basecamp/fizzy@sha256:6dbd7c25ed51eae2b215cbb3c4b6727143502c3d8a2c9e286c8f282f35ed8fb7
    port: 80
    volumes:
    - fizzy-data:/rails/db
    - fizzy-storage:/rails/storage
    env:
      SECRET_KEY_BASE: $PIER_PASSWORD_FIZZY
      RAILS_MASTER_KEY: $PIER_PASSWORD_64_MASTERKEY
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: 'true'
      RAILS_SERVE_STATIC_FILES: 'true'
      DATABASE_ADAPTER: sqlite
      SOLID_QUEUE_CONNECTS_TO: 'false'
      VAPID_PRIVATE_KEY: $VAPID_PRIVATE_KEY
      VAPID_PUBLIC_KEY: $VAPID_PUBLIC_KEY
