name: SiYuan
description: Gestão de conhecimento pessoal com foco em privacidade.
category: Produtividade
website: https://github.com/siyuan-note/siyuan
tags:
  - note-taking
  - markdown
  - pkm
routes:
  - service: siyuan
    port: 6806
compose: |
  services:
    siyuan:
      image: b3log/siyuan:v3.3.5
      environment:
        - TZ=${TZ:-UTC}
        - PUID=1000
        - PGID=1000
        - SIYUAN_ACCESS_AUTH_CODE=${PIER_PASSWORD_SIYUAN}
      volumes:
        - siyuan_workspace:/siyuan/workspace
      healthcheck:
        interval: 15s
        retries: 5
        start_period: 20s
        test:
          - CMD
          - wget
          - --spider
          - --quiet
          - http://127.0.0.1:6806/api/system/version
        timeout: 10s
  volumes:
    siyuan_workspace: null
