name: Grafana com PostgreSQL
description: Análise e monitoramento open source para qualquer banco de dados.
description_en: Open source analytics and monitoring for any database.
category: Monitoramento
website: https://grafana.com
services:
  grafana:
    image: grafana/grafana-oss:13.0.2
    port: 3000
    data: /var/lib/grafana
    env:
      GF_SERVER_ROOT_URL: ${PIER_URL_GRAFANA}
      GF_SERVER_DOMAIN: ${PIER_HOST_GRAFANA}
      GF_SECURITY_ADMIN_PASSWORD: ${PIER_PASSWORD_GRAFANA}
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgresql
      GF_DATABASE_USER: '{{postgresql.user}}'
      GF_DATABASE_PASSWORD: '{{postgresql.password}}'
      GF_DATABASE_NAME: '{{postgresql.database}}'
with:
  postgresql:
    kind: postgres
    version: '16'
    database: grafana
