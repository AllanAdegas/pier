name: LiteLLM
description: Chame mais de 100 APIs de LLM no formato da OpenAI.
category: IA
website: https://docs.litellm.ai
tags:
  - ai
  - qdrant
  - weaviate
  - langchain
  - openai
  - gpt
  - llm
  - lmops
routes:
  - service: litellm
    port: 4000
compose: |
  services:
    litellm:
      image: ghcr.io/berriai/litellm-database:main-stable
      command:
        - --config
        - /app/config.yaml
        - --port
        - "4000"
        - --num_workers
        - "2"
        - --run_gunicorn
        - --max_requests_before_restart
        - "1000"
      environment:
        - LITELLM_LOG=${LITELLM_LOG:-ERROR}
        - LITELLM_MODE=${LITELLM_MODE:-PRODUCTION}
        - LITELLM_MASTER_KEY=${PIER_PASSWORD_MASTERKEY}
        - UI_USERNAME=${PIER_USER_UI}
        - UI_PASSWORD=${PIER_PASSWORD_UI}
        - DATABASE_URL=postgresql://${PIER_USER_POSTGRES}:${PIER_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-litellm}
        - REDIS_HOST=${REDIS_HOST:-redis}
        - REDIS_PORT=${REDIS_PORT:-6379}
        - POSTGRES_USER=${PIER_USER_POSTGRES}
        - POSTGRES_PASSWORD=${PIER_PASSWORD_POSTGRES}
        - POSTGRES_DB=${POSTGRES_DB:-litellm}
        - OPENAI_API_KEY=${OPENAI_API_KEY}
        - OPENAI_API_BASE=${OPENAI_API_BASE}
        - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
        - ANTHROPIC_API_BASE=${ANTHROPIC_API_BASE}
        - VOYAGE_API_KEY=${VOYAGE_API_KEY}
        - VOYAGE_API_BASE=${VOYAGE_API_BASE}
        - STORE_MODEL_IN_DB=${STORE_MODEL_IN_DB}
      volumes:
        - content: |-
            general_settings:
              proxy_batch_write_at: 60
              store_prompts_in_spend_logs: false

            router_settings:
              redis_host: os.environ/REDIS_HOST
              redis_port: os.environ/REDIS_PORT
              redis_password: os.environ/REDIS_PASSWORD
              enable_pre_call_check: true

            litellm_settings:
              set_verbose: false
              json_logs: true
              log_raw_request_response: false
              # turn_off_message_logging: false
              # redact_user_api_key_info: false
              service_callback: ["prometheus_system"]
              drop_params: true
              # max_budget: 100
              # budget_duration: 30d
              num_retries: 1
              request_timeout: 120
              telemetry: false
              cache: true
              cache_params:
                type: redis
                host: os.environ/REDIS_HOST
                port: os.environ/REDIS_PORT
                password: os.environ/REDIS_PASSWORD
                namespace: "litellm_cache"
                ttl: 600
              success_callback:
                # - "langfuse"
                - "prometheus"
              failure_callback:
                # - "langfuse"
                - "prometheus"
            model_list:
              # OpenAI
              - model_name: gpt-4
                litellm_params:
                  model: openai/gpt-4
                  api_key: os.environ/OPENAI_API_KEY
                  api_base: os.environ/OPENAI_API_BASE
              - model_name: gpt-4o
                litellm_params:
                  model: openai/gpt-4o
                  api_key: os.environ/OPENAI_API_KEY
                  api_base: os.environ/OPENAI_API_BASE
              - model_name: gpt-4o-mini
                litellm_params:
                  model: openai/gpt-4o-mini
                  api_key: os.environ/OPENAI_API_KEY
                  api_base: os.environ/OPENAI_API_BASE
              # Anthropic
              - model_name: claude-3-haiku
                litellm_params:
                  model: claude-3-haiku-20240307
                  api_key: "os.environ/ANTHROPIC_API_KEY"
                  api_base: "os.environ/ANTHROPIC_API_BASE"
              - model_name: claude-3.5-sonnet
                litellm_params:
                  model: claude-3-5-sonnet-20240620
                  api_key: "os.environ/ANTHROPIC_API_KEY"
                  api_base: "os.environ/ANTHROPIC_API_BASE"
              # VoyageAI
              - model_name: voyage-law-2
                model_info:
                  output_vector_size: 1024
                litellm_params:
                  model: voyage/voyage-law-2
                  api_key: "os.environ/VOYAGE_API_KEY"
                  api_base: "os.environ/VOYAGE_API_BASE"
                  # rpm: 300
                  # tpm: 1000000
              - model_name: voyage-multilingual-2
                model_info:
                  mode: embedding
                  max_tokens: 32000
                  max_input_tokens: 32000
                  output_vector_size: 1024
                litellm_params:
                  model: voyage/voyage-multilingual-2
                  api_key: "os.environ/VOYAGE_API_KEY"
                  api_base: "os.environ/VOYAGE_API_BASE"
                  input_cost_per_token: 0.00000012
                  output_cost_per_token: 0
                  # rpm: 300
                  # tpm: 1000000
          source: ./litellm-config.yaml
          target: /app/config.yaml
          type: bind
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
          - CMD
          - python
          - -c
          - import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',timeout=5)
        timeout: 5s
    postgres:
      image: postgres:16-alpine
      environment:
        - POSTGRES_DB=${POSTGRES_DB:-litellm}
        - POSTGRES_PASSWORD=$PIER_PASSWORD_POSTGRES
        - POSTGRES_USER=$PIER_USER_POSTGRES
      volumes:
        - pg-data:/var/lib/postgresql/data
      healthcheck:
        interval: 5s
        retries: 3
        test:
          - CMD-SHELL
          - pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 5s
    redis:
      image: redis:7-alpine
      command: redis-server --appendonly yes
      volumes:
        - redis-data:/data
      healthcheck:
        interval: 5s
        retries: 3
        test:
          - CMD
          - redis-cli
          - ping
        timeout: 5s
  volumes:
    pg-data: null
    redis-data: null
