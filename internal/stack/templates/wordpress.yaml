auth: first-visitor
name: WordPress
description: O CMS mais usado do mundo, com MariaDB dedicado.
description_en: The world's most used CMS, with a dedicated MariaDB.
category: CMS
website: https://wordpress.org
verified: true
services:
  wordpress:
    image: wordpress:6
    port: 80
    data: /var/www/html
    env:
      WORDPRESS_DB_HOST: '{{db.host}}'
      WORDPRESS_DB_USER: '{{db.user}}'
      WORDPRESS_DB_PASSWORD: '{{db.password}}'
      WORDPRESS_DB_NAME: '{{db.database}}'
with:
  db:
    kind: mariadb
    user: wordpress
    database: wordpress
