name: Yamtrack
description: Acompanhe filmes, séries, animes, mangás, jogos e livros.
category: Produtividade
website: https://github.com/FuzzyGrim/Yamtrack/wiki
tags:
  - self-hosted
  - automation
  - tracker
  - media
  - movies
  - shows
  - anime
  - manga
routes:
  - service: yamtrack
    port: 8000
compose: |
  services:
    redis:
      image: redis:7-alpine
      volumes:
        - yamtrack_redis_data:/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - redis-cli
          - ping
        timeout: 20s
    yamtrack:
      image: ghcr.io/fuzzygrim/yamtrack
      environment:
        - URLS=${PIER_URL_YAMTRACK}
        - TZ=${TZ:-Europe/Berlin}
        - SECRET=${PIER_PASSWORD_SECRET}
        - REGISTRATION=${REGISTRATION_ENABLED:-true}
        - REDIS_URL=redis://redis:6379
      volumes:
        - yamtrack_data:/yamtrack/db
      depends_on:
        redis:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - wget --quiet --tries=1 --spider http://127.0.0.1:8000/health/ || exit 1
        timeout: 20s
  volumes:
    yamtrack_data: null
    yamtrack_redis_data: null
