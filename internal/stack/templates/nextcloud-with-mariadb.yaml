name: Nextcloud com MariaDB
description: Arquivos, colaboração e comunicação em uma plataforma própria.
category: Armazenamento
website: https://docs.nextcloud.com
tags:
  - cloud
  - collaboration
  - communication
  - filestorage
  - data
routes:
  - service: nextcloud
    port: 80
compose: |
  services:
    nextcloud:
      image: lscr.io/linuxserver/nextcloud:latest
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=${TZ:-Europe/Paris}
        - MYSQL_DATABASE=${MARIADB_DATABASE:-nextcloud}
        - MYSQL_USER=${PIER_USER_MARIADB}
        - MYSQL_PASSWORD=${PIER_PASSWORD_MARIADB}
        - MYSQL_HOST=nextcloud-db
        - REDIS_HOST=redis
        - REDIS_PORT=6379
      volumes:
        - nextcloud-config:/config
        - nextcloud-data:/data
      depends_on:
        nextcloud-db:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        interval: 30s
        retries: 15
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:80/status.php
        timeout: 10s
    nextcloud-db:
      image: mariadb:11
      environment:
        - MYSQL_ROOT_PASSWORD=${PIER_PASSWORD_ROOT}
        - MYSQL_DATABASE=${MARIADB_DATABASE:-nextcloud}
        - MYSQL_USER=${PIER_USER_MARIADB}
        - MYSQL_PASSWORD=${PIER_PASSWORD_MARIADB}
      volumes:
        - nextcloud-mariadb-data:/var/lib/mysql
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - healthcheck.sh
          - --connect
          - --innodb_initialized
        timeout: 20s
    redis:
      image: redis:7.4-alpine
      volumes:
        - nextcloud-redis-data:/data
      healthcheck:
        interval: 5s
        retries: 20
        test:
          - CMD
          - redis-cli
          - PING
        timeout: 10s
  volumes:
    nextcloud-config: null
    nextcloud-data: null
    nextcloud-mariadb-data: null
    nextcloud-redis-data: null
