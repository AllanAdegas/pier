name: imgcompress
description: Compressão e conversão de imagens offline, com remoção de fundo por IA.
description_en: Offline image compression and conversion, with AI background removal.
category: Mídia
website: https://imgcompress.karimzouine.com
services:
  imgcompress:
    image: karimz1/imgcompress:0.6.0
    port: 5000
    env:
      DISABLE_LOGO: ${DISABLE_LOGO:-false}
      DISABLE_STORAGE_MANAGEMENT: ${DISABLE_STORAGE_MANAGEMENT:-false}
