name: Bitcoin Core
description: Nó completo do Bitcoin.
description_en: Bitcoin full node.
category: Backend
website: https://hub.docker.com/r/ruimarinho/bitcoin-core/
services:
  bitcoin-core:
    image: ruimarinho/bitcoin-core:32
    data: /home/bitcoin/.bitcoin
    command:
    - -datadir=/home/bitcoin/.bitcoin
    - -rpcbind=127.0.0.1
    - -rpcallowip=127.0.0.1
    - -rpcuser=${BITCOIN_RPCUSER}
    - -rpcpassword=${PIER_PASSWORD_PASSWORD64}
    - -printtoconsole=${BITCOIN_PRINTTOCONSOLE}
    - -txindex=${BITCOIN_TXINDEX}
    - -server=${BITCOIN_SERVER}
    env:
      BITCOIN_RPCUSER: ${BITCOIN_RPCUSER:-bitcoinuser}
      BITCOIN_RPCPASSWORD: ${PIER_PASSWORD_PASSWORD64}
      BITCOIN_PRINTTOCONSOLE: ${BITCOIN_PRINTTOCONSOLE:-1}
      BITCOIN_TXINDEX: ${BITCOIN_TXINDEX:-1}
      BITCOIN_SERVER: ${BITCOIN_SERVER:-1}
