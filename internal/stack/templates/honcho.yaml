name: Honcho
description: Memória e raciocínio para agentes de IA personalizados.
category: IA
website: https://honcho.dev/docs/v3/contributing/self-hosting
tags:
  - ai
  - memory
  - llm
  - agents
  - rag
  - postgres
  - pgvector
  - redis
routes:
  - service: api
    port: 8000
compose: |
  services:
    api:
      image: ghcr.io/plastic-labs/honcho:v3.0.12
      entrypoint:
        - sh
        - docker/entrypoint.sh
      environment:
        - DB_CONNECTION_URI=postgresql+psycopg://${PIER_USER_POSTGRES}:${PIER_PASSWORD_POSTGRES}@database:5432/postgres
        - CACHE_URL=redis://redis:6379/0?suppress=true
        - CACHE_ENABLED=true
        - LOG_LEVEL=${LOG_LEVEL:-INFO}
        - AUTH_USE_AUTH=false
        - LLM_OPENAI_API_KEY=${LLM_OPENAI_API_KEY}
        - VECTOR_STORE_TYPE=pgvector
      depends_on:
        database:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        interval: 10s
        retries: 5
        start_period: 30s
        test:
          - CMD
          - /app/.venv/bin/python
          - -c
          - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()
        timeout: 5s
    database:
      image: pgvector/pgvector:pg15
      environment:
        - POSTGRES_DB=postgres
        - POSTGRES_USER=${PIER_USER_POSTGRES}
        - POSTGRES_PASSWORD=${PIER_PASSWORD_POSTGRES}
      volumes:
        - honcho_pgdata:/var/lib/postgresql/data/
      healthcheck:
        interval: 5s
        retries: 5
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 5s
    deriver:
      image: ghcr.io/plastic-labs/honcho:v3.0.12
      entrypoint:
        - /app/.venv/bin/python
        - -m
        - src.deriver
      environment:
        - DB_CONNECTION_URI=postgresql+psycopg://${PIER_USER_POSTGRES}:${PIER_PASSWORD_POSTGRES}@database:5432/postgres
        - CACHE_URL=redis://redis:6379/0?suppress=true
        - CACHE_ENABLED=true
        - LOG_LEVEL=${LOG_LEVEL:-INFO}
        - AUTH_USE_AUTH=false
        - LLM_OPENAI_API_KEY=${LLM_OPENAI_API_KEY}
        - VECTOR_STORE_TYPE=pgvector
      depends_on:
        api:
          condition: service_healthy
        database:
          condition: service_healthy
        redis:
          condition: service_healthy
    redis:
      image: redis:8.2
      volumes:
        - honcho_redis_data:/data
      healthcheck:
        interval: 5s
        retries: 5
        test:
          - CMD-SHELL
          - redis-cli ping
        timeout: 5s
  volumes:
    honcho_pgdata: null
    honcho_redis_data: null
