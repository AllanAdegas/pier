auth: none
name: Honcho
description: Memória e raciocínio para agentes de IA personalizados.
description_en: Memory and reasoning for personalized AI agents.
category: IA
website: https://honcho.dev/docs/v3/contributing/self-hosting
services:
  api:
    image: ghcr.io/plastic-labs/honcho:v3.0.12
    private: true
    port: 8000
    entrypoint:
    - sh
    - docker/entrypoint.sh
    env:
      DB_CONNECTION_URI: postgresql+psycopg://{{database.user}}:{{database.password}}@database:5432/postgres
      CACHE_URL: redis://redis:6379/0?suppress=true
      CACHE_ENABLED: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_USE_AUTH: 'false'
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY}
      VECTOR_STORE_TYPE: pgvector
    health:
    - CMD
    - /app/.venv/bin/python
    - -c
    - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()
  deriver:
    image: ghcr.io/plastic-labs/honcho:v3.0.12
    entrypoint:
    - /app/.venv/bin/python
    - -m
    - src.deriver
    env:
      DB_CONNECTION_URI: postgresql+psycopg://{{database.user}}:{{database.password}}@database:5432/postgres
      CACHE_URL: redis://redis:6379/0?suppress=true
      CACHE_ENABLED: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_USE_AUTH: 'false'
      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY}
      VECTOR_STORE_TYPE: pgvector
    depends_on:
      api:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
with:
  database:
    kind: postgres
    version: '15'
    flavor: pgvector
    database: postgres
  redis:
    version: '8.2'
