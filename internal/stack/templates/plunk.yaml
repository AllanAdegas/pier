name: Plunk
description: Plataforma de e-mail open source sobre a AWS.
description_en: Open source email platform on AWS.
category: E-mail
website: https://docs.useplunk.com/getting-started/introduction
services:
  plunk:
    image: driaug/plunk:1.3.6
    port: 3000
    entrypoint:
    - /app/entry.sh
    env:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://{{postgresql.user}}:{{postgresql.password}}@postgresql/plunk-db?schema=public
      JWT_SECRET: ${PIER_PASSWORD_JWTSECRET}
      AWS_REGION: ${AWS_REGION:?}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
      AWS_SES_CONFIGURATION_SET: ${AWS_SES_CONFIGURATION_SET:?}
      NEXT_PUBLIC_API_URI: ${PIER_URL_PLUNK}/api
      APP_URI: ${PIER_URL_PLUNK}
      API_URI: ${PIER_URL_PLUNK}/api
      DISABLE_SIGNUPS: ${DISABLE_SIGNUPS:-False}
      NODE_OPTIONS: --no-network-family-autoselection
with:
  postgresql:
    kind: postgres
    version: '16'
    database: plunk-db
  redis: {}
