name: NodeBB
description: Plataforma de fóruns de nova geração.
description_en: Next-generation forum platform.
category: Mensageria
website: https://docs.nodebb.org/
services:
  nodebb:
    image: ghcr.io/nodebb/nodebb:4.16.7
    port: 4567
    command: |
      /bin/bash -c " cat > /usr/src/app/setup.json <<EOL {
          \"defaults\": {
              \"postgres\": {
                  \"host\": \"postgres\",
                  \"port\": 5432,
                  \"database\": \"nodebb\",
                  \"username\": \"{{postgres.user}}\",
                  \"password\": \"{{postgres.password}}\"
              }
          }
      } EOL && tini -- entrypoint.sh "
    volumes:
    - nodebb_build:/usr/src/app/build
    - nodebb_uploads:/usr/src/app/public/uploads
    - nodebb_config:/opt/config
with:
  postgres:
    database: nodebb
