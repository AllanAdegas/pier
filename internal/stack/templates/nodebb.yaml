name: NodeBB
description: Plataforma de fóruns de nova geração.
category: Mensageria
website: https://docs.nodebb.org/
tags:
  - communication
  - forums
  - discussion
routes:
  - service: nodebb
    port: 4567
compose: |
  services:
    nodebb:
      image: ghcr.io/nodebb/nodebb:latest
      command: |
        /bin/bash -c " cat > /usr/src/app/setup.json <<EOL {
            \"defaults\": {
                \"postgres\": {
                    \"host\": \"postgres\",
                    \"port\": 5432,
                    \"database\": \"nodebb\",
                    \"username\": \"${PIER_USER_POSTGRES}\",
                    \"password\": \"${PIER_PASSWORD_POSTGRES}\"
                }
            }
        } EOL && tini -- entrypoint.sh "
      volumes:
        - nodebb_build:/usr/src/app/build
        - nodebb_uploads:/usr/src/app/public/uploads
        - nodebb_config:/opt/config
      depends_on:
        postgres:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 3
        test:
          - CMD-SHELL
          - bash -c ':> /dev/tcp/127.0.0.1/4567' || exit 1
        timeout: 20s
    postgres:
      image: postgres:17.2-alpine
      environment:
        - POSTGRES_USER=${PIER_USER_POSTGRES}
        - POSTGRES_PASSWORD=${PIER_PASSWORD_POSTGRES}
        - POSTGRES_DB=nodebb
      volumes:
        - nodebb_postgres_data:/var/lib/postgresql/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 20s
  volumes:
    nodebb_build: null
    nodebb_config: null
    nodebb_postgres_data: null
    nodebb_uploads: null
