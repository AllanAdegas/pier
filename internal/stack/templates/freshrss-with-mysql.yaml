name: FreshRSS com MySQL
description: Agregador de feeds livre e auto-hospedável.
category: RSS
website: https://freshrss.org/index.html
tags:
  - rss
  - feed
routes:
  - service: freshrss
    port: 80
compose: |
  services:
    freshrss:
      image: freshrss/freshrss:latest
      environment:
        - CRON_MIN=${CRON_MIN:-1,31}
        - MYSQL_DB=${MYSQL_DATABASE:-freshrss}
        - MYSQL_USER=${PIER_USER_MYSQL}
        - MYSQL_PASSWORD=${PIER_PASSWORD_MYSQL}
      volumes:
        - freshrss-data:/var/www/FreshRSS/data
        - freshrss-extensions:/var/www/FreshRSS/extensions
      depends_on:
        freshrss-db:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 3
        test:
          - CMD-SHELL
          - bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1
        timeout: 20s
    freshrss-db:
      image: mysql:8
      environment:
        - MYSQL_ROOT_PASSWORD=$PIER_PASSWORD_ROOT
        - MYSQL_DATABASE=${MYSQL_DATABASE:-freshrss}
        - MYSQL_USER=$PIER_USER_MYSQL
        - MYSQL_PASSWORD=$PIER_PASSWORD_MYSQL
      volumes:
        - mysql-data:/var/lib/mysql
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - mysqladmin
          - ping
          - -h
          - 127.0.0.1
        timeout: 20s
  volumes:
    freshrss-data: null
    freshrss-extensions: null
    mysql-data: null
