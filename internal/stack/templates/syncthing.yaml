auth: none
name: Syncthing
description: Sincroniza arquivos entre computadores em tempo real.
description_en: Syncs files between computers in real time.
category: Armazenamento
website: https://syncthing.net/
services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:2.1.7
    private: true
    port: 8384
    ports:
    - 22000:22000/tcp
    - 22000:22000/udp
    - 21027:21027/udp
    volumes:
    - syncthing_config:/config
    - syncthing_data1:/data1
    - syncthing_data2:/data2
    env:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-Etc/UTC}
