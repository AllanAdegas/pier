auth: generated
name: authentik
description: Provedor de identidade open source, flexível e versátil.
description_en: Flexible and versatile open source identity provider.
category: Autenticação
website: https://docs.goauthentik.io/docs/installation/docker-compose
services:
  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.5.6}
    port: 9000
    command: server
    volumes:
    - ./data:/data
    - ./custom-templates:/templates
    env:
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${PIER_PASSWORD_AUTHENTIKADMIN}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${PIER_SECRET_AUTHENTIKTOKEN}
      AUTHENTIK_POSTGRESQL__HOST: ${POSTGRES_HOST:-postgresql}
      AUTHENTIK_POSTGRESQL__USER: '{{postgresql.user}}'
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: '{{postgresql.password}}'
      AUTHENTIK_SECRET_KEY: ${PIER_PASSWORD_64_AUTHENTIKSERVER}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED:-true}
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD}
      AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL__USE_TLS}
      AUTHENTIK_EMAIL__USE_SSL: ${AUTHENTIK_EMAIL__USE_SSL}
      AUTHENTIK_EMAIL__TIMEOUT: ${AUTHENTIK_EMAIL__TIMEOUT}
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__FROM}
  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.5.6}
    command: worker
    user: root
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./data:/data
    - ./certs:/certs
    - ./custom-templates:/templates
    env:
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${PIER_PASSWORD_AUTHENTIKADMIN}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${PIER_SECRET_AUTHENTIKTOKEN}
      AUTHENTIK_POSTGRESQL__HOST: ${POSTGRES_HOST:-postgresql}
      AUTHENTIK_POSTGRESQL__USER: '{{postgresql.user}}'
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: '{{postgresql.password}}'
      AUTHENTIK_SECRET_KEY: ${PIER_PASSWORD_64_AUTHENTIKSERVER}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED}
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD}
      AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL__USE_TLS}
      AUTHENTIK_EMAIL__USE_SSL: ${AUTHENTIK_EMAIL__USE_SSL}
      AUTHENTIK_EMAIL__TIMEOUT: ${AUTHENTIK_EMAIL__TIMEOUT}
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__FROM}
with:
  postgresql:
    kind: postgres
    version: '16'
    database: authentik
