name: cloudflared
description: 'Cliente do Cloudflare Tunnel: expõe serviços privados pela borda da Cloudflare.'
description_en: 'Cloudflare Tunnel client: exposes private services through Cloudflare''s edge.'
category: Rede
website: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    network_mode: host
    env:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
