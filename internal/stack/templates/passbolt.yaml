name: Passbolt
description: Gerenciador de senhas open source para equipes (edição comunidade).
category: Autenticação
website: https://www.passbolt.com/ce/docker
tags:
  - security
  - credentials
  - password-manager
  - open source
routes:
  - service: passbolt
    port: 80
compose: |
  services:
    mariadb:
      image: mariadb:11
      environment:
        - MARIADB_ROOT_PASSWORD=${PIER_PASSWORD_ROOTMARIADB}
        - MARIADB_DATABASE=${MYSQL_DB:-passbolt-db}
        - MARIADB_USER=${PIER_USER_PASSBOLT}
        - MARIADB_PASSWORD=${PIER_PASSWORD_PASSBOLT}
      volumes:
        - passbolt_mariadb_data:/var/lib/mysql
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - healthcheck.sh
          - --connect
          - --innodb_initialized
        timeout: 20s
    passbolt:
      image: passbolt/passbolt:latest-ce
      command:
        - /usr/bin/wait-for.sh
        - -t
        - "0"
        - mariadb:3306
        - --
        - /docker-entrypoint.sh
      environment:
        - APP_FULL_BASE_URL=${PIER_URL_PASSBOLT}
        - DATASOURCES_DEFAULT_HOST=mariadb
        - DATASOURCES_DEFAULT_USERNAME=${PIER_USER_PASSBOLT}
        - DATASOURCES_DEFAULT_PASSWORD=${PIER_PASSWORD_PASSBOLT}
        - DATASOURCES_DEFAULT_DATABASE=${MYSQL_DB:-passbolt-db}
      volumes:
        - gpg_volume:/etc/passbolt/gpg
        - jwt_volume:/etc/passbolt/jwt
      depends_on:
        mariadb:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:80
        timeout: 20s
  volumes:
    gpg_volume: null
    jwt_volume: null
    passbolt_mariadb_data: null
