name: Passbolt
description: Gerenciador de senhas open source para equipes (edição comunidade).
description_en: Open source password manager for teams (community edition).
category: Autenticação
website: https://www.passbolt.com/ce/docker
services:
  passbolt:
    image: passbolt/passbolt@sha256:403314438b9e74ab3f45ebb1dc2f8d6129430a6e5d3cf7e8c1d0f6f2e8337a56
    port: 80
    command:
    - /usr/bin/wait-for.sh
    - -t
    - '0'
    - mariadb:3306
    - --
    - /docker-entrypoint.sh
    volumes:
    - gpg_volume:/etc/passbolt/gpg
    - jwt_volume:/etc/passbolt/jwt
    env:
      APP_FULL_BASE_URL: ${PIER_URL_PASSBOLT}
      DATASOURCES_DEFAULT_HOST: mariadb
      DATASOURCES_DEFAULT_USERNAME: '{{mariadb.user}}'
      DATASOURCES_DEFAULT_PASSWORD: '{{mariadb.password}}'
      DATASOURCES_DEFAULT_DATABASE: '{{mariadb.database}}'
with:
  mariadb:
    database: passbolt-db
