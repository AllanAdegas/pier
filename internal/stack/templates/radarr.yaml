name: Radarr
description: Gestão de coleção de filmes para Usenet e BitTorrent.
description_en: Movie collection manager for Usenet and BitTorrent.
category: Mídia
website: https://hub.docker.com/r/linuxserver/radarr
services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    port: 7878
    data: /config
    env:
      _APP_URL: $PIER_URL_RADARR
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-America/Toronto}
