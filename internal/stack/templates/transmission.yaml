name: Transmission
description: Cliente BitTorrent rápido e simples.
description_en: Fast, simple BitTorrent client.
category: Mídia
website: https://docs.linuxserver.io/images/docker-transmission/
services:
  transmission:
    image: lscr.io/linuxserver/transmission:4.1.4
    port: 9091
    volumes:
    - transmission-config:/config
    - transmission-downloads:/downloads
    - transmission-watch:/watch
    env:
      PUID: '1000'
      PGID: '1000'
      USER: ${PIER_USER_ADMIN}
      PASS: ${PIER_PASSWORD_ADMIN}
