name: Sonarr
description: Gestão de coleção de séries para Usenet e BitTorrent.
description_en: TV series collection manager for Usenet and BitTorrent.
category: Mídia
website: https://hub.docker.com/r/linuxserver/sonarr
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    port: 8989
    data: /config
    env:
      _APP_URL: $PIER_URL_SONARR
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-America/Toronto}
