name: Docling
description: Converte documentos (PDF, DOCX, PPTX, imagens, HTML) para Markdown e JSON com IA.
description_en: Converts documents (PDF, DOCX, PPTX, images, HTML) to Markdown and JSON with AI.
category: IA
website: https://github.com/DS4SD/docling-serve
services:
  docling-serve:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.38.2
    port: 5001
    env:
      DOCLING_SERVE_ENABLE_UI: ${DOCLING_SERVE_ENABLE_UI:-true}
      DOCLING_SERVE_LOG_LEVEL: ${DOCLING_SERVE_LOG_LEVEL:-WARNING}
      DOCLING_NUM_THREADS: ${DOCLING_NUM_THREADS:-4}
