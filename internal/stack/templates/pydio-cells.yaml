name: Pydio Cells
description: Compartilhamento de arquivos grandes com automação e controle de acesso.
category: Armazenamento
website: https://docs.pydio.com/
tags:
  - storage
routes:
  - service: cells
    port: 8080
compose: |
  services:
    cells:
      image: pydio/cells:4.4
      environment:
        - CELLS_SITE_EXTERNAL=${PIER_URL_CELLS}
        - CELLS_SITE_NO_TLS=1
      volumes:
        - cells_data:/var/cells
    mariadb:
      image: mariadb:11
      environment:
        - MYSQL_ROOT_PASSWORD=${PIER_PASSWORD_MYSQLROOT}
        - MYSQL_DATABASE=${MYSQL_DATABASE:-cells}
        - MYSQL_USER=${PIER_USER_MYSQL}
        - MYSQL_PASSWORD=${PIER_PASSWORD_MYSQL}
      volumes:
        - mysql_data:/var/lib/mysql
      healthcheck:
        interval: 10s
        retries: 5
        test:
          - CMD
          - healthcheck.sh
          - --connect
          - --innodb_initialized
        timeout: 20s
  volumes:
    cells_data: null
    mysql_data: null
