name: Overseerr
description: Gestão de pedidos e descoberta de mídia para o ecossistema Plex.
description_en: Request management and media discovery for the Plex ecosystem.
category: Mídia
website: https://docs.overseerr.dev/getting-started/installation#docker
services:
  overseerr:
    image: sctx/overseerr:1.35.0
    port: 5055
    data: /app/config
    env:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-America/Toronto}
