name: Flipt
description: Feature flags e configuração remota ao lado do código, em Git.
category: Backend
website: https://docs.flipt.io/cloud/overview
tags:
  - feature flags
  - devops
  - ci
  - cd
routes:
  - service: flipt
    port: 8080
compose: |
  services:
    flipt:
      image: docker.flipt.io/flipt/flipt:latest
      volumes:
        - flipt-data:/var/opt/flipt
      healthcheck:
        interval: 2s
        retries: 15
        test:
          - CMD
          - wget
          - --spider
          - --quiet
          - http://127.0.0.1:8080
        timeout: 10s
  volumes:
    flipt-data: null
