name: Redmine
description: Aplicação web flexível de gestão de projetos.
description_en: Flexible project management web application.
category: Produtividade
website: https://www.redmine.org/
services:
  redmine:
    image: redmine:6-alpine
    port: 3000
    volumes:
    - redmine-config:/usr/src/redmine/config
    - redmine-files:/usr/src/redmine/files
    - redmine-themes:/usr/src/redmine/themes
    - redmine-plugins:/usr/src/redmine/plugins
    env:
      SECRET_KEY_BASE: ${PIER_PASSWORD_64_REDMINE}
      REDMINE_DB_POSTGRES: postgresql
      REDMINE_DB_PORT: '5432'
      REDMINE_DB_USERNAME: '{{postgresql.user}}'
      REDMINE_DB_PASSWORD: '{{postgresql.password}}'
      REDMINE_DB_DATABASE: '{{postgresql.database}}'
with:
  postgresql:
    kind: postgres
    database: redmine-db
