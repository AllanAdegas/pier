name: Easy!Appointments
description: Agendamento online de compromissos.
description_en: Online appointment scheduling.
category: Produtividade
website: https://easyappointments.org/
services:
  easyappointments:
    image: alextselegidis/easyappointments:1.6.1
    port: 80
    env:
      BASE_URL: ${PIER_URL_EASYAPPOINTMENTS}
      DB_HOST: mysql
      DB_NAME: easyappointments
      DB_USERNAME: root
      DB_PASSWORD: '{{mysql.root_password}}'
with:
  mysql:
    version: '8.0'
    database: easyappointments
