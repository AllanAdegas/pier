name: Drupal com PostgreSQL
description: Sistema de gestão de conteúdo web, livre e open source, em PHP.
description_en: Free and open source web content management system, in PHP.
category: CMS
website: https://www.drupal.org/about
services:
  drupal:
    image: drupal:10-apache
    port: 80
    volumes:
    - is_directory: true
      source: drupal_modules
      target: /var/www/html/modules
      type: volume
    - is_directory: true
      source: drupal_profiles
      target: /var/www/html/profiles
      type: volume
    - is_directory: true
      source: drupal_themes
      target: /var/www/html/themes
      type: volume
    - is_directory: true
      source: drupal_sites
      target: /var/www/html/sites
      type: volume
    env:
      DB_HOST: postgres
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: '{{postgres.password}}'
with:
  postgres:
    version: '16'
    user: postgres
    database: postgres
