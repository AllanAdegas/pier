name: Portabase
description: Backup e monitoramento de bancos de dados.
category: Dados
website: https://portabase.io/docs
tags:
  - backup
  - database
  - monitoring
  - open-source
routes:
  - service: portabase
    port: 80
compose: |
  services:
    portabase:
      image: portabase/portabase:1.28.1
      restart: always
      environment:
        - PROJECT_URL=$PIER_URL_PORTABASE
        - PROJECT_SECRET=$PIER_PASSWORD_64_PORTABASE
        - DATABASE_URL=postgresql://$PIER_USER_POSTGRES:$PIER_PASSWORD_POSTGRES@postgres:5432/${POSTGRES_DB:-portabase}?schema=public
        - PROJECT_NAME=${PROJECT_NAME:-Portabase}
        - TZ=${TZ:-Europe/Paris}
        - LOG_LEVEL=${LOG_LEVEL:-info}
        - RETENTION_CRON=${RETENTION_CRON:-0 7 * * *}
        - STALE_BACKUP_THRESHOLD_HOURS=${STALE_BACKUP_THRESHOLD_HOURS:-6}
        - BACKUP_FOLDER_NAME=${BACKUP_FOLDER_NAME:-backups}
        - TELEMETRY=${TELEMETRY:-true}
        - SKIP_ONBOARDING=${SKIP_ONBOARDING:-false}
        - API_ENABLED=${API_ENABLED:-false}
        - OPENAPI_ENABLED=${OPENAPI_ENABLED:-false}
        - MCP_ENABLED=${MCP_ENABLED:-false}
        - SMTP_HOST=${SMTP_HOST}
        - SMTP_PORT=${SMTP_PORT}
        - SMTP_USER=${SMTP_USER}
        - SMTP_PASSWORD=${SMTP_PASSWORD}
        - SMTP_FROM=${SMTP_FROM}
        - SMTP_SECURE=${SMTP_SECURE:-false}
      volumes:
        - portabase-data:/data
      depends_on:
        postgres:
          condition: service_healthy
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 60s
        test:
          - CMD-SHELL
          - curl -f http://localhost/api/health
        timeout: 5s
    postgres:
      image: postgres:18-alpine
      environment:
        - POSTGRES_DB=${POSTGRES_DB:-portabase}
        - POSTGRES_USER=$PIER_USER_POSTGRES
        - POSTGRES_PASSWORD=$PIER_PASSWORD_POSTGRES
      volumes:
        - postgres-data:/var/lib/postgresql
      healthcheck:
        interval: 10s
        retries: 5
        test:
          - CMD-SHELL
          - pg_isready -U $POSTGRES_USER -d ${POSTGRES_DB}
        timeout: 5s
  volumes:
    portabase-data: null
    postgres-data: null
