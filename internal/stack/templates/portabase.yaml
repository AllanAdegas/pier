name: Portabase
description: Backup e monitoramento de bancos de dados.
description_en: Database backup and monitoring.
category: Dados
website: https://portabase.io/docs
services:
  portabase:
    image: portabase/portabase:1.28.1
    port: 80
    data: /data
    env:
      PROJECT_URL: $PIER_URL_PORTABASE
      PROJECT_SECRET: $PIER_PASSWORD_64_PORTABASE
      DATABASE_URL: postgresql://{{postgres.user}}:{{postgres.password}}@postgres:5432/{{postgres.database}}?schema=public
      PROJECT_NAME: ${PROJECT_NAME:-Portabase}
      TZ: ${TZ:-Europe/Paris}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RETENTION_CRON: ${RETENTION_CRON:-0 7 * * *}
      STALE_BACKUP_THRESHOLD_HOURS: ${STALE_BACKUP_THRESHOLD_HOURS:-6}
      BACKUP_FOLDER_NAME: ${BACKUP_FOLDER_NAME:-backups}
      TELEMETRY: ${TELEMETRY:-true}
      SKIP_ONBOARDING: ${SKIP_ONBOARDING:-false}
      API_ENABLED: ${API_ENABLED:-false}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-false}
with:
  postgres:
    version: '18'
    database: portabase
