name: Pterodactyl Panel
description: Painel open source de gestão de servidores de jogos.
description_en: Open source game server management panel.
category: Mídia
website: https://pterodactyl.io/
services:
  pterodactyl:
    image: ghcr.io/pterodactyl/panel:v1.12.3
    port: 80
    command:
    - /entrypoint.sh
    volumes:
    - panel-var:/app/var/
    - panel-nginx:/etc/nginx/http.d/
    - panel-certs:/etc/letsencrypt/
    - content: |
        #!/bin/sh
        set -e

         echo "Setting logs permissions..."
         chown -R nginx: /app/storage/logs/

         USER_EXISTS=$(php artisan tinker --no-ansi --execute='echo \Pterodactyl\Models\User::where("email", "'"$ADMIN_EMAIL"'")->exists() ? "1" : "0";')

         if [ "$USER_EXISTS" = "0" ]; then
           echo "Admin User does not exist, creating user now."
           php artisan p:user:make --no-interaction \
             --admin=1 \
             --email="$ADMIN_EMAIL" \
             --username="$ADMIN_USERNAME" \
             --name-first="$ADMIN_FIRSTNAME" \
             --name-last="$ADMIN_LASTNAME" \
             --password="$ADMIN_PASSWORD"
           echo "Admin user created successfully!"
         else
           echo "Admin User already exists, skipping creation."
         fi

         exec supervisord --nodaemon
      mode: '0755'
      source: ./etc/entrypoint.sh
      target: /entrypoint.sh
      type: bind
    env:
      HASHIDS_SALT: $PIER_PASSWORD_HASHIDS
      HASHIDS_LENGTH: '8'
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_USERNAME: ${PIER_USER_ADMIN}
      ADMIN_FIRSTNAME: ${ADMIN_FIRSTNAME:-Admin}
      ADMIN_LASTNAME: ${ADMIN_LASTNAME:-User}
      ADMIN_PASSWORD: ${PIER_PASSWORD_ADMIN}
      PTERODACTYL_HTTPS: ${PTERODACTYL_HTTPS:-false}
      APP_ENV: production
      APP_ENVIRONMENT_ONLY: 'false'
      APP_URL: $PIER_URL_PTERODACTYL
      APP_TIMEZONE: ${TIMEZONE:-UTC}
      APP_SERVICE_AUTHOR: ${APP_SERVICE_AUTHOR:-author@example.com}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      REDIS_HOST: redis
      DB_DATABASE: pterodactyl-db
      DB_USERNAME: '{{mariadb.user}}'
      DB_HOST: mariadb
      DB_PORT: '3306'
      DB_PASSWORD: '{{mariadb.password}}'
      MAIL_FROM: $MAIL_FROM
      MAIL_DRIVER: $MAIL_DRIVER
      MAIL_HOST: $MAIL_HOST
      MAIL_PORT: $MAIL_PORT
      MAIL_USERNAME: $MAIL_USERNAME
      MAIL_PASSWORD: $MAIL_PASSWORD
      MAIL_ENCRYPTION: $MAIL_ENCRYPTION
with:
  mariadb:
    version: '11.8'
    database: pterodactyl-db
  redis: {}
