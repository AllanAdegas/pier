name: Karakeep
description: Guarde links, notas e imagens, com etiquetas automáticas por IA e busca em texto completo.
description_en: Save links, notes and images, with AI auto-tagging and full-text search.
category: Produtividade
website: https://docs.karakeep.app/
services:
  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:157.0.8103.38-r1
    command:
    - --no-sandbox
    - --disable-gpu
    - --disable-dev-shm-usage
    - --hide-scrollbars
    - --disable-blink-features=AutomationControlled
    - --window-size=1440,900
  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    data: /meili_data
    env:
      MEILI_NO_ANALYTICS: ${MEILI_NO_ANALYTICS:-true}
      NEXTAUTH_SECRET: ${PIER_PASSWORD_KARAKEEPNEXTAUTH}
      MEILI_MASTER_KEY: ${PIER_PASSWORD_MEILI}
      NEXTAUTH_URL: ${PIER_URL_WEB}
  web:
    image: ghcr.io/karakeep-app/karakeep:0.33.2
    port: 3000
    data: /data
    env:
      NEXTAUTH_URL: ${PIER_URL_WEB}
      NEXTAUTH_SECRET: ${PIER_PASSWORD_KARAKEEPNEXTAUTH}
      MEILI_MASTER_KEY: ${PIER_PASSWORD_MEILI}
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DISABLE_SIGNUPS: ${DISABLE_SIGNUPS:-false}
      DATA_DIR: /data
