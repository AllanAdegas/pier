name: qBittorrent
description: Cliente BitTorrent open source.
category: Mídia
website: https://docs.linuxserver.io/images/docker-qbittorrent/
tags:
  - torrent
  - streaming
  - webui
routes:
  - service: vuetorrent-backend
    port: 8080
compose: |
  services:
    qbit:
      image: lscr.io/linuxserver/qbittorrent:latest
      environment:
        - WEBUI_PORT=${WEBUI_PORT:-8080}
        - PUID=1000
        - PGID=1000
      volumes:
        - qbittorrent-config:/config
        - qbittorrent-downloads:/downloads
        - qbittorrent-torrents:/torrents
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - wget
          - -q
          - --spider
          - http://127.0.0.1:8080/
        timeout: 20s
    vuetorrent-backend:
      image: ghcr.io/vuetorrent/vuetorrent-backend:latest
      environment:
        - PORT=${WEBUI_PORT:-8080}
        - QBIT_BASE=${PIER_URL_VUETORRENT_BACKEND}
        - RELEASE_TYPE=${RELEASE_TYPE:-stable}
        - UPDATE_VT_CRON=${UPDATE_VT_CRON:-"0 * * * *"}
      volumes:
        - vuetorrent-config:/config
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - wget
          - -q
          - --spider
          - http://127.0.0.1:8080/
        timeout: 20s
  volumes:
    qbittorrent-config: null
    qbittorrent-downloads: null
    qbittorrent-torrents: null
    vuetorrent-config: null
