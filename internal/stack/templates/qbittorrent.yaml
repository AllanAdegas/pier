name: qBittorrent
description: Cliente BitTorrent open source.
description_en: Open source BitTorrent client.
category: Mídia
website: https://docs.linuxserver.io/images/docker-qbittorrent/
services:
  qbit:
    image: lscr.io/linuxserver/qbittorrent:5.3.0
    volumes:
    - qbittorrent-config:/config
    - qbittorrent-downloads:/downloads
    - qbittorrent-torrents:/torrents
    env:
      WEBUI_PORT: ${WEBUI_PORT:-8080}
      PUID: '1000'
      PGID: '1000'
  vuetorrent-backend:
    image: ghcr.io/vuetorrent/vuetorrent-backend:2.7.4
    port: 8080
    data: /config
    env:
      PORT: ${WEBUI_PORT:-8080}
      QBIT_BASE: ${PIER_URL_VUETORRENT_BACKEND}
      RELEASE_TYPE: ${RELEASE_TYPE:-stable}
      UPDATE_VT_CRON: ${UPDATE_VT_CRON:-"0 * * * *"}
