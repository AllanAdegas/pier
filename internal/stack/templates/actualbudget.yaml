name: Actual Budget
description: Aplicativo de finanças pessoais local-first.
category: Finanças
website: https://actualbudget.org/docs/install/docker
tags:
  - budgeting
  - actual
  - finance
  - budget
  - money
  - expenses
  - income
routes:
  - service: actual_server
    port: 5006
compose: |
  services:
    actual_server:
      image: actualbudget/actual-server:latest
      environment:
        - ACTUAL_LOGIN_METHOD=password
      volumes:
        - actual_data:/data
      healthcheck:
        interval: 5s
        retries: 3
        test:
          - CMD-SHELL
          - bash -c ':> /dev/tcp/127.0.0.1/5006' || exit 1
        timeout: 20s
  volumes:
    actual_data: null
