name: Onetime Secret
description: Compartilhe segredos com links que se destroem após uma leitura.
description_en: Share secrets with links that self-destruct after one view.
category: Segurança
website: https://docs.onetimesecret.com
services:
  onetimesecret:
    image: onetimesecret/onetimesecret:v0.26.19
    port: 3000
    env:
      AUTH_AUTOVERIFY: ${AUTH_AUTOVERIFY:-true}
      AUTH_SIGNUP: ${AUTH_SIGNUP:-true}
      COLONEL: ${COLONEL:-admin@example.com}
      HOST: ${HOST:-localhost}
      REDIS_URL: redis://:{{redis.password}}@redis:6379/0
      SECRET: ${PIER_PASSWORD_ONETIMESECRET}
      SSL: ${SSL:-false}
      RACK_ENV: production
with:
  redis:
    version: '8.2'
    password: true
