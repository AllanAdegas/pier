name: Onetime Secret
description: Compartilhe segredos com links que se destroem após uma leitura.
category: Segurança
website: https://docs.onetimesecret.com
tags:
  - auth
  - password
  - secret
  - secure
routes:
  - service: onetimesecret
    port: 3000
compose: |
  services:
    onetimesecret:
      image: onetimesecret/onetimesecret:latest
      environment:
        - AUTH_AUTOVERIFY=${AUTH_AUTOVERIFY:-true}
        - AUTH_SIGNUP=${AUTH_SIGNUP:-true}
        - COLONEL=${COLONEL:-admin@example.com}
        - HOST=${HOST:-localhost}
        - REDIS_URL=redis://:${PIER_PASSWORD_REDIS}@redis:6379/0
        - SECRET=${PIER_PASSWORD_ONETIMESECRET}
        - SSL=${SSL:-false}
        - RACK_ENV=production
      depends_on:
        redis:
          condition: service_healthy
      healthcheck:
        interval: 30s
        retries: 3
        test:
          - CMD
          - ruby
          - -rnet/http
          - -e
          - 'exit(Net::HTTP.get_response(URI(''http://localhost:3000'')).is_a?(Net::HTTPSuccess) ? 0 : 1)'
        timeout: 10s
    redis:
      image: redis:8-alpine
      command: redis-server --requirepass ${PIER_PASSWORD_REDIS}
      healthcheck:
        interval: 30s
        retries: 3
        test:
          - CMD
          - redis-cli
          - ping
        timeout: 10s
