name: LibreSpeed
description: Teste de velocidade leve e auto-hospedado.
description_en: Lightweight, self-hosted speed test.
category: Desenvolvimento
website: https://github.com/librespeed/speedtest
services:
  librespeed:
    image: ghcr.io/librespeed/speedtest:6.3.1
    port: 82
    env:
      MODE: standalone
      TELEMETRY: 'false'
      DISTANCE: km
      WEBPORT: '82'
