name: Emby
description: Servidor de mídia para organizar e transmitir seu conteúdo.
category: Mídia
website: https://emby.media/support/articles/Home.html
tags:
  - media
  - server
  - movies
  - tv
  - music
routes:
  - service: emby
    port: 8096
compose: |
  services:
    emby:
      image: lscr.io/linuxserver/emby:latest
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=Europe/Madrid
      volumes:
        - emby-config:/config
        - emby-tvshows:/tvshows
        - emby-movies:/movies
      healthcheck:
        interval: 2s
        retries: 15
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:8096
        timeout: 10s
  volumes:
    emby-config: null
    emby-movies: null
    emby-tvshows: null
