name: Emby
description: Servidor de mídia para organizar e transmitir seu conteúdo.
description_en: Media server to organize and stream your content.
category: Mídia
website: https://emby.media/support/articles/Home.html
services:
  emby:
    image: lscr.io/linuxserver/emby:4.10.2
    port: 8096
    volumes:
    - emby-config:/config
    - emby-tvshows:/tvshows
    - emby-movies:/movies
    env:
      PUID: '1000'
      PGID: '1000'
      TZ: Europe/Madrid
