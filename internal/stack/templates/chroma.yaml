auth: none
name: Chroma
description: Banco open source de busca e recuperação para aplicações de IA.
description_en: Open source search and retrieval database for AI applications.
category: IA
website: https://cookbook.chromadb.dev/
services:
  chromadb:
    image: chromadb/chroma:1.0.15
    private: true
    port: 8000
    data: /data
    env:
      IS_PERSISTENT: 'TRUE'
      PERSIST_DIRECTORY: /data
