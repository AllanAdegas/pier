name: OpenWA com PostgreSQL e Redis
description: OpenWA para produção, com PostgreSQL, Redis e painel.
description_en: OpenWA for production, with PostgreSQL, Redis and a dashboard.
category: Mensageria
website: https://github.com/rmyndharis/OpenWA
services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:0.23.1
    port: 2785
    data: /app/data
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    cap_drop:
    - ALL
    mem_limit: ${OPENWA_MEM_LIMIT:-2g}
    pids_limit: ${OPENWA_PIDS_LIMIT:-2048}
    read_only: true
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 45s
    tmpfs:
    - /tmp
    env:
      NODE_ENV: production
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      PORT: '2785'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BASE_URL: ${PIER_URL_OPENWA}
      DASHBOARD_URL: ${PIER_URL_OPENWA}
      API_MASTER_KEY: ${PIER_PASSWORD_OPENWA}
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgresql
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: $PIER_USER_POSTGRES
      DATABASE_PASSWORD: $PIER_PASSWORD_POSTGRES
      DATABASE_NAME: ${POSTGRES_DB:-openwa}
      DATABASE_SYNCHRONIZE: 'false'
      POSTGRES_SCHEMA: public
      ENGINE_TYPE: ${ENGINE_TYPE:-whatsapp-web.js}
      SESSION_DATA_PATH: ./data/sessions
      PUPPETEER_HEADLESS: 'true'
      PUPPETEER_ARGS: --no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage
      PUPPETEER_EXECUTABLE_PATH: /usr/local/bin/puppeteer-chrome
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: ./data/media
      REDIS_ENABLED: 'true'
      REDIS_HOST: openwa-redis
      REDIS_PORT: '6379'
      QUEUE_ENABLED: 'true'
      CACHE_ENABLED: 'true'
      AUTO_START_SESSIONS: ${AUTO_START_SESSIONS:-false}
    depends_on:
      openwa-redis:
        condition: service_healthy
      postgresql:
        condition: service_healthy
  openwa-redis:
    image: redis:7-alpine
    data: /data
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    security_opt:
    - no-new-privileges:true
    health:
    - CMD
    - redis-cli
    - ping
  postgresql:
    image: postgres:16-alpine
    data: /var/lib/postgresql/data
    security_opt:
    - no-new-privileges:true
    env:
      POSTGRES_USER: $PIER_USER_POSTGRES
      POSTGRES_PASSWORD: $PIER_PASSWORD_POSTGRES
      POSTGRES_DB: ${POSTGRES_DB:-openwa}
    health: 'cmd: pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
