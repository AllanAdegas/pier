name: Checkmate
description: Monitoramento open source de servidores e sites.
description_en: Open source server and website monitoring.
category: Monitoramento
website: https://docs.checkmate.so/
services:
  checkmate:
    image: ghcr.io/bluewave-labs/checkmate-backend-mono-multiarch:v3.2.0
    port: 52345
    env:
      UPTIME_APP_API_BASE_URL: ${PIER_URL_CHECKMATE}/api/v1
      UPTIME_APP_CLIENT_HOST: ${PIER_URL_CHECKMATE}
      DB_CONNECTION_STRING: mongodb://mongodb:27017/uptime_db
      CLIENT_HOST: ${PIER_URL_CHECKMATE}
      JWT_SECRET: ${PIER_PASSWORD_64_JWT}
    needs:
    - mongodb
  mongodb:
    image: ghcr.io/bluewave-labs/checkmate-mongo:v3.2.0
    data: /data/db
    command:
    - mongod
    - --quiet
    - --bind_ip_all
