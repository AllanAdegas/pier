name: Wings
description: Plano de controle de servidores do Pterodactyl Panel.
category: Desenvolvimento
website: https://pterodactyl.io/
tags:
  - game
  - game server
  - management
  - panel
  - minecraft
routes:
  - service: wings
    port: 8443
compose: |
  services:
    wings:
      image: ghcr.io/pterodactyl/wings:v1.12.1
      environment:
        - TZ=${TIMEZONE:-UTC}
        - WINGS_USERNAME=$PIER_USER_WINGS
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /var/lib/docker/containers/:/var/lib/docker/containers/
        - /var/lib/pterodactyl/volumes:/var/lib/pterodactyl/volumes
        - /tmp/pterodactyl:/tmp/pterodactyl
        - wings_lib:/var/lib/pterodactyl/
        - wings_logs:/var/log/pterodactyl/
        - content: |-
            debug: false
            uuid: ReplaceConfig
            token_id: ReplaceConfig
            token: ReplaceConfig
            api:
              host: 0.0.0.0
              port: 8443 # Warning, panel must have 443 as daemon port, while here it should should be 8443, the route of this service must use port 8443
              ssl:
                enabled: false
                cert: ReplaceConfig
                key: ReplaceConfig
              upload_limit: 100
            system:
              data: /var/lib/pterodactyl/volumes
              sftp:
                bind_port: 2022
            allowed_mounts: []
            remote: ''
          source: ./etc/config.yml
          target: /etc/pterodactyl/config.yml
          type: bind
      ports:
        - 2022:2022
  volumes:
    wings_lib: null
    wings_logs: null
