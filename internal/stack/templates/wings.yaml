name: Wings
description: Plano de controle de servidores do Pterodactyl Panel.
description_en: Server control plane for Pterodactyl Panel.
category: Desenvolvimento
website: https://pterodactyl.io/
services:
  wings-init:
    image: busybox:1.37.0
    restart: 'no'
    volumes:
    - wings-config:/config
    env:
      WINGS_CONFIG: ${WINGS_CONFIG:?}
    entrypoint:
    - sh
    - -ec
    - |
      case "$$WINGS_CONFIG" in *ReplaceConfig*|*'REPLACE FROM CONFIG'*) exit 1;; esac
      umask 077
      printf '%s\n' "$$WINGS_CONFIG" > /config/config.yml
  wings:
    depends_on:
      wings-init:
        condition: service_completed_successfully
    image: ghcr.io/pterodactyl/wings:v1.12.1
    port: 8443
    ports:
    - 2022:2022
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /var/lib/docker/containers/:/var/lib/docker/containers/
    - /var/lib/pterodactyl/volumes:/var/lib/pterodactyl/volumes
    - /tmp/pterodactyl:/tmp/pterodactyl
    - wings_lib:/var/lib/pterodactyl/
    - wings_logs:/var/log/pterodactyl/
    - wings-config:/etc/pterodactyl:ro
    env:
      TZ: ${TIMEZONE:-UTC}
      WINGS_USERNAME: $PIER_USER_WINGS
