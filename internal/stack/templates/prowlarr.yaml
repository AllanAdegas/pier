name: Prowlarr
description: Gerenciador de indexadores para a stack *arr.
description_en: Indexer manager for the *arr stack.
category: Mídia
website: https://hub.docker.com/r/linuxserver/prowlarr
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0
    port: 9696
    data: /config
    env:
      _APP_URL: $PIER_URL_PROWLARR
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-America/Toronto}
