name: Grimmory
description: Gerencie, leia e anote toda a sua coleção de livros em um só lugar.
category: Mídia
website: https://github.com/grimmory-tools/grimmory
tags:
  - books
  - ebooks
  - library
  - reader
routes:
  - service: grimmory
    port: 80
compose: |
  services:
    grimmory:
      image: grimmory/grimmory:nightly-20260403-3a371f7
      environment:
        - USER_ID=${GRIMMORY_USER_ID:-0}
        - GROUP_ID=${GRIMMORY_GROUP_ID:-0}
        - TZ=${TZ:-UTC}
        - DATABASE_URL=jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE:-grimmory-db}
        - DATABASE_USERNAME=${PIER_USER_MARIADB}
        - DATABASE_PASSWORD=${PIER_PASSWORD_MARIADB}
        - BOOKLORE_PORT=80
      volumes:
        - grimmory-data:/app/data
        - grimmory-books:/books
        - grimmory-bookdrop:/bookdrop
      depends_on:
        mariadb:
          condition: service_healthy
      healthcheck:
        interval: 10s
        retries: 10
        test: wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1
        timeout: 5s
    mariadb:
      image: mariadb:12
      environment:
        - MARIADB_USER=${PIER_USER_MARIADB}
        - MARIADB_PASSWORD=${PIER_PASSWORD_MARIADB}
        - MARIADB_ROOT_PASSWORD=${PIER_PASSWORD_MARIADBROOT}
        - MARIADB_DATABASE=${MARIADB_DATABASE:-grimmory-db}
      volumes:
        - mariadb-data:/var/lib/mysql
      healthcheck:
        interval: 10s
        retries: 10
        test:
          - CMD
          - healthcheck.sh
          - --connect
          - --innodb_initialized
        timeout: 5s
  volumes:
    grimmory-bookdrop: null
    grimmory-books: null
    grimmory-data: null
    mariadb-data: null
