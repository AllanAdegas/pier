name: Grimmory
description: Gerencie, leia e anote toda a sua coleção de livros em um só lugar.
description_en: Manage, read and annotate your whole book collection in one place.
category: Mídia
website: https://github.com/grimmory-tools/grimmory
services:
  grimmory:
    image: grimmory/grimmory:nightly-20260403-3a371f7
    port: 80
    volumes:
    - grimmory-data:/app/data
    - grimmory-books:/books
    - grimmory-bookdrop:/bookdrop
    env:
      USER_ID: ${GRIMMORY_USER_ID:-0}
      GROUP_ID: ${GRIMMORY_GROUP_ID:-0}
      TZ: ${TZ:-UTC}
      DATABASE_URL: jdbc:mariadb://mariadb:3306/{{mariadb.database}}
      DATABASE_USERNAME: '{{mariadb.user}}'
      DATABASE_PASSWORD: '{{mariadb.password}}'
      BOOKLORE_PORT: '80'
with:
  mariadb:
    version: '11.8'
    database: grimmory-db
