name: NocoBase
description: Plataforma no-code/low-code extensível, com IA.
description_en: Extensible no-code/low-code platform, with AI.
category: Desenvolvimento
website: https://docs.nocobase.com/
services:
  nocobase:
    image: nocobase/nocobase:1.9.33
    port: 13000
    data: /app/nocobase/storage
    env:
      APP_KEY: ${PIER_PASSWORD_64_APPKEY}
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: '{{postgres.database}}'
      DB_USER: '{{postgres.user}}'
      DB_PASSWORD: '{{postgres.password}}'
with:
  postgres:
    database: nocobase-db
