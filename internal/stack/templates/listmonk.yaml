name: listmonk
description: Gestor de newsletters e listas de e-mail.
description_en: Newsletter and mailing list manager.
category: E-mail
website: https://listmonk.app/
services:
  listmonk:
    image: listmonk/listmonk:v6.0.0
    port: 9000
    data: /listmonk/uploads
    env:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: postgres
      LISTMONK_db__database: listmonk
      LISTMONK_db__user: '{{postgres.user}}'
      LISTMONK_db__password: '{{postgres.password}}'
      LISTMONK_db__port: '5432'
      TZ: Etc/UTC
  listmonk-initial-database-setup:
    image: listmonk/listmonk:v6.0.0
    command: ./listmonk --install --yes --idempotent
    restart: 'no'
    env:
      LISTMONK_db__host: postgres
      LISTMONK_db__database: listmonk
      LISTMONK_db__user: '{{postgres.user}}'
      LISTMONK_db__password: '{{postgres.password}}'
      LISTMONK_db__port: '5432'
with:
  postgres:
    version: '18'
    database: listmonk
