name: listmonk
description: Gestor de newsletters e listas de e-mail.
category: E-mail
website: https://listmonk.app/
tags:
  - newsletter
  - mailing list
  - self-hosted
  - open source
routes:
  - service: listmonk
    port: 9000
compose: |
  services:
    listmonk:
      image: listmonk/listmonk:v6.0.0
      environment:
        - LISTMONK_app__address=0.0.0.0:9000
        - LISTMONK_db__host=postgres
        - LISTMONK_db__database=listmonk
        - LISTMONK_db__user=$PIER_USER_POSTGRES
        - LISTMONK_db__password=$PIER_PASSWORD_POSTGRES
        - LISTMONK_db__port=5432
        - TZ=Etc/UTC
      volumes:
        - listmonk-data:/listmonk/uploads
      depends_on:
        postgres:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - wget
          - -q
          - --spider
          - http://127.0.0.1:9000
        timeout: 20s
    listmonk-initial-database-setup:
      image: listmonk/listmonk:v6.0.0
      command: ./listmonk --install --yes --idempotent
      restart: "no"
      environment:
        - LISTMONK_db__host=postgres
        - LISTMONK_db__database=listmonk
        - LISTMONK_db__user=$PIER_USER_POSTGRES
        - LISTMONK_db__password=$PIER_PASSWORD_POSTGRES
        - LISTMONK_db__port=5432
      depends_on:
        postgres:
          condition: service_healthy
    postgres:
      image: postgres:18-alpine
      environment:
        - POSTGRES_DB=listmonk
        - POSTGRES_PASSWORD=$PIER_PASSWORD_POSTGRES
        - POSTGRES_USER=$PIER_USER_POSTGRES
      volumes:
        - postgres-data:/var/lib/postgresql
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 20s
  volumes:
    listmonk-data: null
    postgres-data: null
