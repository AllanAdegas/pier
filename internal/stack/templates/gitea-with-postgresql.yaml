name: Gitea com PostgreSQL
description: 'Serviço Git leve: controle de versão, colaboração e hospedagem de código.'
category: Git
website: https://docs.gitea.com
tags:
  - version control
  - collaboration
  - code
  - hosting
  - lightweight
  - postgresql
routes:
  - service: gitea
    port: 3000
compose: |
  services:
    gitea:
      image: gitea/gitea:latest
      environment:
        - USER_UID=1000
        - USER_GID=1000
        - GITEA__database__DB_TYPE=postgres
        - GITEA__database__HOST=postgresql
        - GITEA__database__NAME=${POSTGRESQL_DATABASE-gitea}
        - GITEA__database__USER=$PIER_USER_POSTGRESQL
        - GITEA__database__PASSWD=$PIER_PASSWORD_POSTGRESQL
      volumes:
        - gitea-data:/data
        - gitea-timezone:/etc/timezone:ro
        - gitea-localtime:/etc/localtime:ro
      ports:
        - "22222:22"
      depends_on:
        postgresql:
          condition: service_healthy
      healthcheck:
        interval: 2s
        retries: 15
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:3000
        timeout: 10s
    postgresql:
      image: postgres:16-alpine
      environment:
        - POSTGRES_USER=${PIER_USER_POSTGRESQL}
        - POSTGRES_PASSWORD=${PIER_PASSWORD_POSTGRESQL}
        - POSTGRES_DB=${POSTGRESQL_DATABASE}
      volumes:
        - gitea-postgresql-data:/var/lib/postgresql/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 20s
  volumes:
    gitea-data: null
    gitea-localtime: null
    gitea-postgresql-data: null
    gitea-timezone: null
