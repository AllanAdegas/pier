auth: first-visitor
name: Gitea com PostgreSQL
description: 'Serviço Git leve: controle de versão, colaboração e hospedagem de código.'
description_en: 'Lightweight Git service: version control, collaboration and code hosting.'
category: Git
website: https://docs.gitea.com
services:
  gitea:
    image: gitea/gitea:28.3.0
    port: 3000
    ports:
    - '22222:22'
    volumes:
    - gitea-data:/data
    - gitea-timezone:/etc/timezone:ro
    - gitea-localtime:/etc/localtime:ro
    env:
      USER_UID: '1000'
      USER_GID: '1000'
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgresql
      GITEA__database__NAME: '{{postgresql.database}}'
      GITEA__database__USER: '{{postgresql.user}}'
      GITEA__database__PASSWD: '{{postgresql.password}}'
with:
  postgresql:
    kind: postgres
    version: '16'
