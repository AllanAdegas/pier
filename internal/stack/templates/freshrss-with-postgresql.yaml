name: FreshRSS com PostgreSQL
description: Agregador de feeds livre e auto-hospedável.
description_en: Free, self-hostable feed aggregator.
category: RSS
website: https://freshrss.org/index.html
services:
  freshrss:
    image: freshrss/freshrss:1.30.4
    port: 80
    volumes:
    - freshrss-data:/var/www/FreshRSS/data
    - freshrss-extensions:/var/www/FreshRSS/extensions
    env:
      CRON_MIN: ${CRON_MIN:-1,31}
      POSTGRES_DB: '{{freshrss-db.database}}'
      POSTGRES_USER: '{{freshrss-db.user}}'
      POSTGRES_PASSWORD: '{{freshrss-db.password}}'
      POSTGRES_HOST: freshrss-db
with:
  freshrss-db:
    kind: postgres
    version: '16'
    database: freshrss
