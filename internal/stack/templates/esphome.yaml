name: ESPHome
description: Casa inteligente de forma simples.
category: Automação
website: https://esphome.io/guides/getting_started_command_line/
tags:
  - home
  - smart
  - assistant
  - microcontroller
routes: []
compose: |
  services:
    esphome:
      image: ghcr.io/esphome/esphome:2025.12.4
      environment:
        - USERNAME=${PIER_USER_ADMIN}
        - PASSWORD=${PIER_PASSWORD_ADMIN}
      volumes:
        - esp_config:/config
        - /etc/localtime:/etc/localtime:ro
      network_mode: host
      privileged: true
  volumes:
    esp_config: null
