name: ESPHome
description: Casa inteligente de forma simples.
description_en: Smart home made simple.
category: Automação
website: https://esphome.io/guides/getting_started_command_line/
services:
  esphome:
    image: ghcr.io/esphome/esphome:2025.12.4
    network_mode: host
    privileged: true
    volumes:
    - esp_config:/config
    - /etc/localtime:/etc/localtime:ro
    env:
      USERNAME: ${PIER_USER_ADMIN}
      PASSWORD: ${PIER_PASSWORD_ADMIN}
