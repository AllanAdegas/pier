name: AppFlowy
description: Espaço de trabalho colaborativo com IA, com controle total dos seus dados.
description_en: Collaborative AI workspace, with full control of your data.
category: Produtividade
website: https://docs.appflowy.io/docs/documentation/appflowy-cloud
services:
  admin_frontend:
    image: appflowyinc/admin_frontend:0.9.149
    env:
      APPFLOWY_GOTRUE_BASE_URL: ${PIER_URL_NGINX}/gotrue
      APPFLOWY_BASE_URL: ${PIER_URL_NGINX}
    depends_on:
      appflowy_cloud:
        condition: service_started
      gotrue:
        condition: service_healthy
  ai:
    image: appflowyinc/appflowy_ai:0.9.149
    env:
      OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_SERVER_PORT: '5001'
      DEFAULT_AI_MODEL: gpt-4.1-mini
      DEFAULT_AI_COMPLETION_MODEL: gpt-4.1-mini
      AI_APPFLOWY_HOST: ${PIER_URL_APPFLOWY_WEB}
      APPFLOWY_GOTRUE_JWT_SECRET: ${PIER_PASSWORD_JWT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
      APPFLOWY_S3_ACCESS_KEY: '{{minio.user}}'
      APPFLOWY_S3_SECRET_KEY: '{{minio.password}}'
      APPFLOWY_S3_BUCKET: ${APPFLOWY_S3_BUCKET:-appflowy}
      APPFLOWY_S3_REGION: ${APPFLOWY_S3_REGION:-us-east-1}
      AI_DATABASE_URL: postgres://{{postgres.user}}:{{postgres.password}}@postgres:5432/{{postgres.database}}
      AI_REDIS_URL: redis://redis:6379
      AI_USE_MINIO: 'true'
      AI_MINIO_URL: http://minio:9000
    needs:
    - postgres
  appflowy_cloud:
    image: appflowyinc/appflowy_cloud:0.9.149
    env:
      RUST_LOG: ${RUST_LOG:-info}
      APPFLOWY_BASE_URL: ${PIER_URL_NGINX}
      APPFLOWY_ENVIRONMENT: production
      APPFLOWY_DATABASE_URL: postgres://{{postgres.user}}:{{postgres.password}}@postgres:5432/{{postgres.database}}
      APPFLOWY_REDIS_URI: redis://redis:6379
      APPFLOWY_GOTRUE_JWT_SECRET: ${PIER_PASSWORD_JWT}
      APPFLOWY_GOTRUE_BASE_URL: http://gotrue:9999
      APPFLOWY_S3_CREATE_BUCKET: ${APPFLOWY_S3_CREATE_BUCKET:-true}
      APPFLOWY_S3_USE_MINIO: 'true'
      APPFLOWY_S3_MINIO_URL: http://minio:9000
      APPFLOWY_S3_ACCESS_KEY: '{{minio.user}}'
      APPFLOWY_S3_SECRET_KEY: '{{minio.password}}'
      APPFLOWY_S3_BUCKET: ${APPFLOWY_S3_BUCKET:-appflowy}
      APPFLOWY_S3_REGION: ${APPFLOWY_S3_REGION:-us-east-1}
      APPFLOWY_MAILER_SMTP_HOST: ${APPFLOWY_MAILER_SMTP_HOST:-smtp.gmail.com}
      APPFLOWY_MAILER_SMTP_PORT: ${APPFLOWY_MAILER_SMTP_PORT:-587}
      APPFLOWY_MAILER_SMTP_USERNAME: ${APPFLOWY_MAILER_SMTP_USERNAME:-notify@appflowy.io}
      APPFLOWY_MAILER_SMTP_EMAIL: ${APPFLOWY_MAILER_SMTP_EMAIL:-notify@appflowy.io}
      APPFLOWY_MAILER_SMTP_PASSWORD: ${APPFLOWY_MAILER_SMTP_PASSWORD:-email_sender_password}
      APPFLOWY_MAILER_SMTP_TLS_KIND: ${APPFLOWY_MAILER_SMTP_TLS_KIND:-none}
      APPFLOWY_ACCESS_CONTROL: 'true'
      APPFLOWY_DATABASE_MAX_CONNECTIONS: '40'
      AI_SERVER_HOST: ai
      AI_SERVER_PORT: '5001'
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      APPFLOWY_WEB_URL: ${PIER_URL_APPFLOWY_WEB}
    depends_on:
      gotrue:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  appflowy_web:
    image: appflowyinc/appflowy_web:0.9.132
    port: 80
    env:
      APPFLOWY_BASE_URL: ${PIER_URL_NGINX}
      APPFLOWY_GOTRUE_BASE_URL: ${PIER_URL_NGINX}/gotrue
      APPFLOWY_WS_BASE_URL: ${PIER_URL_NGINX}/ws/v2
    needs:
    - appflowy_cloud
  appflowy_worker:
    image: appflowyinc/appflowy_worker:0.9.149
    env:
      RUST_LOG: info
      APPFLOWY_ENVIRONMENT: production
      APPFLOWY_WORKER_ENVIRONMENT: production
      APPFLOWY_WORKER_REDIS_URL: redis://redis:6379
      APPFLOWY_WORKER_DATABASE_URL: postgres://{{postgres.user}}:{{postgres.password}}@postgres:5432/{{postgres.database}}
      APPFLOWY_WORKER_DATABASE_NAME: '{{postgres.database}}'
      APPFLOWY_WORKER_IMPORT_TICK_INTERVAL: '30'
      APPFLOWY_S3_USE_MINIO: 'true'
      APPFLOWY_S3_MINIO_URL: http://minio:9000
      APPFLOWY_S3_ACCESS_KEY: '{{minio.user}}'
      APPFLOWY_S3_SECRET_KEY: '{{minio.password}}'
      APPFLOWY_S3_BUCKET: ${APPFLOWY_S3_BUCKET:-appflowy}
      APPFLOWY_S3_REGION: ${APPFLOWY_S3_REGION:-us-east-1}
      APPFLOWY_MAILER_SMTP_HOST: ${APPFLOWY_MAILER_SMTP_HOST:-smtp.gmail.com}
      APPFLOWY_MAILER_SMTP_PORT: ${APPFLOWY_MAILER_SMTP_PORT:-587}
      APPFLOWY_MAILER_SMTP_USERNAME: ${APPFLOWY_MAILER_SMTP_USERNAME:-notify@appflowy.io}
      APPFLOWY_MAILER_SMTP_EMAIL: ${APPFLOWY_MAILER_SMTP_EMAIL:-notify@appflowy.io}
      APPFLOWY_MAILER_SMTP_PASSWORD: ${APPFLOWY_MAILER_SMTP_PASSWORD:-email_sender_password}
      APPFLOWY_MAILER_SMTP_TLS_KIND: ${APPFLOWY_MAILER_SMTP_TLS_KIND:-none}
    needs:
    - postgres
    - redis
  gotrue:
    image: appflowyinc/gotrue:0.9.149
    env:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      PORT: '9999'
      GOTRUE_ADMIN_EMAIL: ${GOTRUE_ADMIN_EMAIL:-admin@example.com}
      GOTRUE_ADMIN_PASSWORD: ${PIER_PASSWORD_ADMIN}
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_SITE_URL: appflowy-flutter://
      GOTRUE_URI_ALLOW_LIST: '**'
      GOTRUE_JWT_SECRET: ${PIER_PASSWORD_JWT}
      GOTRUE_JWT_EXP: ${GOTRUE_JWT_EXP:-7200}
      GOTRUE_DB_DRIVER: postgres
      API_EXTERNAL_URL: ${PIER_URL_NGINX}/gotrue
      DATABASE_URL: postgres://{{postgres.user}}:{{postgres.password}}@postgres:5432/{{postgres.database}}?search_path=auth
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /verify
      GOTRUE_MAILER_URLPATHS_INVITE: /verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /verify
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_MAX_FREQUENCY: 1ns
      GOTRUE_RATE_LIMIT_EMAIL_SENT: '100'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
    health: 'cmd: curl --fail http://127.0.0.1:9999/health || exit 1'
    needs:
    - postgres
  nginx:
    image: nginx:1.29.2
    port: 80
    volumes:
    - content: "# Please do not directly edit this file.\n\nerror_log  /var/log/nginx/error.log notice;\npid        /var/run/nginx.pid;\n\n\nevents {\n    worker_connections  1024;\n}\n\n\nhttp {\n    resolver 127.0.0.11 valid=10s;\n    map $http_upgrade $connection_upgrade {\n        default upgrade;\n        '' close;\n    }\n\n    server {\n        listen 80;\n        client_max_body_size 10M;\n        underscores_in_headers on;\n\n        # Backend services\n        set $appflowy_cloud_backend \"http://appflowy_cloud:8000\";\n        set $gotrue_backend \"http://gotrue:9999\";\n        set $admin_frontend_backend \"http://admin_frontend:3000\";\n        # GoTrue Authentication Service\n        location /gotrue/ {\n            proxy_pass $gotrue_backend;\n\n            rewrite ^/gotrue(/.*)$ $1 break;\n            \n            # Allow headers like redirect_to to be handed over to the gotrue\n            # for correct redirecting\n            proxy_set_header Host $http_host;\n      \
        \      proxy_pass_request_headers on;\n        }\n\n        # WebSocket endpoint - handle both /ws and /ws/v2\n        location /ws {\n            proxy_pass $appflowy_cloud_backend;\n\n            proxy_http_version 1.1;\n            proxy_set_header Upgrade $http_upgrade;\n            proxy_set_header Connection \"Upgrade\";\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_read_timeout 86400s;\n        }\n\n        # API endpoints\n        location /api {\n            proxy_pass $appflowy_cloud_backend;\n            proxy_set_header X-Request-Id $request_id;\n            proxy_set_header Host $http_host;\n\n            # Special handling for publish endpoint\n            location ~* ^/api/workspace/([a-zA-Z0-9_-]+)/publish$ {\n                proxy_pass $appflowy_cloud_backend;\n    \
        \            proxy_request_buffering off;\n                client_max_body_size 256M;\n            }\n\n            # Chat endpoint (streaming)\n            location /api/chat {\n                proxy_pass $appflowy_cloud_backend;\n\n                proxy_http_version 1.1;\n                proxy_set_header Connection \"\";\n                chunked_transfer_encoding on;\n                proxy_buffering off;\n                proxy_cache off;\n\n                proxy_read_timeout 600s;\n                proxy_connect_timeout 600s;\n                proxy_send_timeout 600s;\n            }\n\n            # Import endpoint\n            location /api/import {\n                proxy_pass $appflowy_cloud_backend;\n\n                proxy_set_header X-Request-Id $request_id;\n                proxy_set_header Host $http_host;\n\n                proxy_read_timeout 600s;\n                proxy_connect_timeout 600s;\n                proxy_send_timeout 600s;\n\n                proxy_request_buffering\
        \ off;\n                proxy_buffering off;\n                proxy_cache off;\n                client_max_body_size 2G;\n            }\n        }\n\n        # Admin Frontend\n        # Optional Module, comment this section if you did not deploy admin_frontend in docker-compose.yml\n        location /console {\n            proxy_pass $admin_frontend_backend;\n\n            proxy_set_header X-Scheme $scheme;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n\n            proxy_http_version 1.1;\n            proxy_set_header Connection \"\";\n\n            proxy_buffering off;\n            proxy_cache off;\n\n            proxy_read_timeout 60s;\n            proxy_connect_timeout 60s;\n            proxy_send_timeout 60s;\n        }\n\n        # Redirect root path to /console\n        location = / {\n       \
        \     return 301 /console;\n        }\n\n        # Health check endpoint\n        location /health {\n            access_log off;\n            return 200 \"healthy\\n\";\n            add_header Content-Type text/plain;\n        }\n    }\n}\n"
      read_only: true
      source: ./nginx/nginx.conf
      target: /etc/nginx/nginx.conf
      type: bind
    needs:
    - appflowy_cloud
    - gotrue
    - admin_frontend
with:
  minio: {}
  postgres:
    version: '16'
    env:
      POSTGRES_HOST: postgres
    flavor: pgvector
    database: appflowy
  redis:
    version: '8.2'
