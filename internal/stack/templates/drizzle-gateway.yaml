name: Drizzle Gateway
description: Drizzle Studio auto-hospedado.
description_en: Self-hosted Drizzle Studio.
category: Desenvolvimento
website: https://gateway.drizzle.team/
services:
  drizzle-gateway:
    image: ghcr.io/drizzle-team/gateway:1.7.0
    port: 4983
    data: /app
    env:
      STORE_PATH: /app
      MASTERPASS: $PIER_PASSWORD_DRIZZLE
