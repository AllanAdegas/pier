name: Gitea com MariaDB
description: 'Serviço Git leve: controle de versão, colaboração e hospedagem de código.'
category: Git
website: https://docs.gitea.com
tags:
  - version control
  - collaboration
  - code
  - hosting
  - lightweight
  - mariadb
routes:
  - service: gitea
    port: 3000
compose: |
  services:
    gitea:
      image: gitea/gitea:latest
      environment:
        - USER_UID=1000
        - USER_GID=1000
        - GITEA__database__DB_TYPE=mysql
        - GITEA__database__HOST=mariadb
        - GITEA__database__NAME=${MYSQL_DATABASE-gitea}
        - GITEA__database__USER=$PIER_USER_MYSQL
        - GITEA__database__PASSWD=$PIER_PASSWORD_MYSQL
      volumes:
        - gitea-data:/data
        - gitea-timezone:/etc/timezone:ro
        - gitea-localtime:/etc/localtime:ro
      ports:
        - "22222:22"
      depends_on:
        mariadb:
          condition: service_healthy
      healthcheck:
        interval: 2s
        retries: 15
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:3000
        timeout: 10s
    mariadb:
      image: mariadb:11
      environment:
        - MYSQL_USER=${PIER_USER_MYSQL}
        - MYSQL_PASSWORD=${PIER_PASSWORD_MYSQL}
        - MYSQL_DATABASE=${MYSQL_DATABASE}
        - MYSQL_ROOT_PASSWORD=${PIER_PASSWORD_MYSQLROOT}
      volumes:
        - gitea-mariadb-data:/var/lib/mysql
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - healthcheck.sh
          - --connect
          - --innodb_initialized
        timeout: 20s
  volumes:
    gitea-data: null
    gitea-localtime: null
    gitea-mariadb-data: null
    gitea-timezone: null
