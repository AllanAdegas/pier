name: Navidrome
description: Servidor de música compatível com clientes Subsonic.
description_en: Music server compatible with Subsonic clients.
category: Mídia
website: https://www.navidrome.org/docs/
services:
  navidrome:
    image: deluan/navidrome:0.64.2
    port: 4533
    volumes:
    - ./data:/data
    - ./music:/music:ro
    env:
      ND_BASEURL: ${PIER_URL_NAVIDROME}
      ND_SCANSCHEDULE: ${ND_SCANSCHEDULE:-1h}
      ND_LOGLEVEL: ${ND_LOGLEVEL:-info}
      ND_SESSIONTIMEOUT: ${ND_SESSIONTIMEOUT:-24h}
      ND_ENABLEINSIGHTSCOLLECTOR: ${ND_ENABLEINSIGHTSCOLLECTOR:-false}
