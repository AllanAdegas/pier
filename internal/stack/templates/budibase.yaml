name: Budibase
description: Plataforma low-code para criar aplicações de negócio e fluxos em minutos.
description_en: Low-code platform to build business apps and workflows in minutes.
category: Automação
website: https://docs.budibase.com/docs/docker-compose
services:
  app-service:
    image: budibase.docker.scarf.sh/budibase/apps:v3.51.0
    env:
      SELF_HOSTED: '1'
      COUCH_DB_URL: http://$PIER_USER_COUCHDB:$PIER_PASSWORD_COUCHDB@couchdb-service:5984
      WORKER_URL: http://worker-service:4003
      MINIO_URL: http://minio-service:9000
      MINIO_ACCESS_KEY: '{{minio-service.user}}'
      MINIO_SECRET_KEY: '{{minio-service.password}}'
      INTERNAL_API_KEY: $PIER_PASSWORD_128_BUDIBASE
      BUDIBASE_ENVIRONMENT: ${BUDIBASE_ENVIRONMENT:-PRODUCTION}
      PORT: '4002'
      API_ENCRYPTION_KEY: $PIER_PASSWORD_64_BUDIBASEAPI
      ENCRYPTION_KEY: $PIER_PASSWORD_64_BUDIBASE
      JWT_SECRET: $PIER_PASSWORD_64_BUDIBASEJWT
      LOG_LEVEL: info
      ENABLE_ANALYTICS: ${ENABLE_ANALYTICS:-true}
      REDIS_URL: redis-service:6379
      REDIS_PASSWORD: '{{redis-service.password}}'
      BB_ADMIN_USER_EMAIL: ''
      BB_ADMIN_USER_PASSWORD: ''
    needs:
    - worker-service
    - redis-service
  couchdb-service:
    image: budibase/database:2.1.0
    data: /data
    env:
      COUCHDB_PASSWORD: $PIER_PASSWORD_COUCHDB
      COUCHDB_USER: $PIER_USER_COUCHDB
      TARGETBUILD: docker-compose
  proxy-service:
    image: budibase/proxy:v3.51.0
    port: 10000
    env:
      PROXY_RATE_LIMIT_WEBHOOKS_PER_SECOND: '10'
      PROXY_RATE_LIMIT_API_PER_SECOND: '20'
      APPS_UPSTREAM_URL: http://app-service:4002
      WORKER_UPSTREAM_URL: http://worker-service:4003
      MINIO_UPSTREAM_URL: http://minio-service:9000
      COUCHDB_UPSTREAM_URL: http://couchdb-service:5984
      RESOLVER: 127.0.0.11
    needs:
    - worker-service
    - app-service
    - couchdb-service
    - minio-service
  worker-service:
    image: budibase.docker.scarf.sh/budibase/worker:v3.51.0
    env:
      SELF_HOSTED: '1'
      PORT: '4003'
      CLUSTER_PORT: '10000'
      API_ENCRYPTION_KEY: $PIER_PASSWORD_64_BUDIBASEAPI
      JWT_SECRET: $PIER_PASSWORD_64_BUDIBASEJWT
      MINIO_ACCESS_KEY: '{{minio-service.user}}'
      MINIO_SECRET_KEY: '{{minio-service.password}}'
      MINIO_URL: http://minio-service:9000
      APPS_URL: http://app-service:4002
      COUCH_DB_USERNAME: $PIER_USER_COUCHDB
      COUCH_DB_PASSWORD: $PIER_PASSWORD_COUCHDB
      COUCH_DB_URL: http://$PIER_USER_COUCHDB:$PIER_PASSWORD_COUCHDB@couchdb-service:5984
      INTERNAL_API_KEY: $PIER_PASSWORD_128_BUDIBASE
      REDIS_URL: redis-service:6379
      REDIS_PASSWORD: '{{redis-service.password}}'
with:
  minio-service:
    kind: minio
  redis-service:
    kind: redis
    version: '8.2'
    password: true
