name: Sessy
description: 'Observabilidade de e-mail: monitore e analise seus envios.'
description_en: 'Email observability: monitor and analyze your sending.'
category: Monitoramento
website: https://github.com/marckohlbrugge/sessy/blob/main/docs/docker-deployment.md
services:
  sessy:
    image: ghcr.io/marckohlbrugge/sessy@sha256:4d281c96a928a0f6ac855f17635147a35c2e45cba44bf9d5eff2b492d78fc7fe
    port: 80
    data: /rails/storage
    env:
      SECRET_KEY_BASE: $PIER_HEX_64_SESSYSECRET
      HTTP_AUTH_USERNAME: $PIER_USER_SESSY
      HTTP_AUTH_PASSWORD: $PIER_PASSWORD_SESSY
