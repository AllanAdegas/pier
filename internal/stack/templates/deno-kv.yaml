name: Deno KV
description: Banco chave-valor da Deno.
description_en: Deno's key-value database.
category: Dados
website: https://docs.deno.com/deploy/kv/manual/
services:
  denokv:
    image: ghcr.io/denoland/denokv:0.14.0
    port: 4512
    command: --sqlite-path /data/denokv.sqlite serve --access-token ${PIER_PASSWORD_DENOKV}
    volumes:
    - ./data:/data
    env:
      ACCESS_TOKEN: ${PIER_PASSWORD_DENOKV}
