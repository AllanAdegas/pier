name: LibreOffice
description: Suíte de escritório livre, no navegador.
category: Produtividade
website: https://docs.linuxserver.io/images/docker-libreoffice/
tags:
  - office
  - document
  - spreadsheet
  - presentation
  - open-source
routes:
  - service: libreoffice
    port: 3000
compose: |
  services:
    libreoffice:
      image: lscr.io/linuxserver/libreoffice:latest
      environment:
        - PUID=${PUID:-1000}
        - PGID=${PGID:-1000}
        - TZ=${TZ:-Etc/UTC}
      volumes:
        - libreoffice-config:/config
      healthcheck:
        interval: 30s
        retries: 3
        test:
          - CMD
          - wget
          - -q
          - --spider
          - http://localhost:3000
        timeout: 10s
  volumes:
    libreoffice-config: null
