auth: generated
name: LibreOffice
description: Suíte de escritório livre, no navegador.
description_en: Free office suite, in the browser.
category: Produtividade
website: https://docs.linuxserver.io/images/docker-libreoffice/
services:
  libreoffice:
    image: lscr.io/linuxserver/libreoffice:25.8.7
    port: 3000
    data: /config
    env:
      CUSTOM_USER: ${PIER_USER_LIBREOFFICE}
      PASSWORD: ${PIER_PASSWORD_LIBREOFFICE}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
