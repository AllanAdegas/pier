name: Obsidian
description: Notas com links e plugins, no navegador via área de trabalho remota.
description_en: Notes with links and plugins, in the browser through a remote desktop.
category: Produtividade
website: https://docs.linuxserver.io/images/docker-obsidian
services:
  obsidian:
    image: lscr.io/linuxserver/obsidian:1.15.0
    port: 3000
    data: /config
    security_opt:
    - seccomp=unconfined
    shm_size: 1gb
    env:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      CUSTOM_USER: ${PIER_USER_OBSIDIAN}
      PASSWORD: ${PIER_PASSWORD_OBSIDIAN}
