name: Uptime Kuma
description: Monitoramento de disponibilidade com páginas de status e alertas.
category: Monitoramento
website: https://github.com/louislam/uptime-kuma
verified: true
routes:
  - service: uptime-kuma
    port: 3001
compose: |
  services:
    uptime-kuma:
      image: louislam/uptime-kuma:1
      volumes:
        - data:/app/data
  volumes:
    data:
