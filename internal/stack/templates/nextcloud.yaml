auth: first-visitor
name: Nextcloud
description: Arquivos, colaboração e comunicação em uma plataforma própria.
description_en: Files, collaboration and communication on your own platform.
category: Armazenamento
website: https://docs.nextcloud.com
services:
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:35.0.2
    port: 80
    volumes:
    - nextcloud-config:/config
    - nextcloud-data:/data
    env:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-Europe/Madrid}
