name: Nextcloud
description: Arquivos, colaboração e comunicação em uma plataforma própria.
category: Armazenamento
website: https://docs.nextcloud.com
tags:
  - cloud
  - collaboration
  - communication
  - filestorage
  - data
routes:
  - service: nextcloud
    port: 80
compose: |
  services:
    nextcloud:
      image: lscr.io/linuxserver/nextcloud:latest
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=${TZ:-Europe/Madrid}
      volumes:
        - nextcloud-config:/config
        - nextcloud-data:/data
      healthcheck:
        interval: 30s
        retries: 15
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:80/status.php
        timeout: 10s
  volumes:
    nextcloud-config: null
    nextcloud-data: null
