name: Joomla com MariaDB
description: CMS livre e open source para construir sites.
description_en: Free and open source CMS to build websites.
category: CMS
website: https://joomla.org
services:
  joomla:
    image: joomla:6.2.0
    port: 80
    data: /var/www/html
    env:
      JOOMLA_DB_HOST: mariadb
      JOOMLA_DB_USER: '{{mariadb.user}}'
      JOOMLA_DB_PASSWORD: '{{mariadb.password}}'
      JOOMLA_DB_NAME: '{{mariadb.database}}'
with:
  mariadb:
    database: joomla-db
