auth: first-visitor
name: Flowise
description: Ferramenta low-code para fluxos de LLM e agentes de IA.
description_en: Low-code tool for LLM flows and AI agents.
category: IA
website: https://docs.flowiseai.com/
services:
  flowise:
    image: flowiseai/flowise:3.1.4
    port: 3001
    data: /root/.flowise
    env:
      APP_URL: ${PIER_URL_FLOWISE}
      DEBUG: ${DEBUG:-false}
      DISABLE_FLOWISE_TELEMETRY: ${DISABLE_FLOWISE_TELEMETRY:-true}
      PORT: ${PORT:-3001}
      DATABASE_PATH: /root/.flowise
      APIKEY_PATH: /root/.flowise
      SECRETKEY_PATH: /root/.flowise
      LOG_PATH: /root/.flowise/logs
      BLOB_STORAGE_PATH: /root/.flowise/storage
