name: Mailpit
description: Caixa de e-mail de testes — captura mensagens SMTP (porta 1025) e as exibe na web.
category: Desenvolvimento
website: https://mailpit.axllent.org
verified: true
routes:
  - service: mailpit
    port: 8025
compose: |
  services:
    mailpit:
      image: axllent/mailpit:latest
      volumes:
        - data:/data
      environment:
        MP_DATABASE: /data/mailpit.db
  volumes:
    data:
