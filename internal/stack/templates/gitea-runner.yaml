auth: first-visitor
name: Gitea Runner
description: Runner do Gitea Actions em Docker.
description_en: Gitea Actions runner in Docker.
category: Desenvolvimento
website: https://github.com/go-gitea/gitea
services:
  runner:
    image: docker.io/gitea/runner:1.0.8
    working_dir: /data
    volumes:
    - runner-data:/data
    - /var/run/docker.sock:/var/run/docker.sock
    env:
      GITEA_INSTANCE_URL: ${GITEA_INSTANCE_URL}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-gitea-runner}
      GITEA_RUNNER_LABELS: ${GITEA_RUNNER_LABELS:-ubuntu-latest:docker://node:22}
      GITEA_TOKEN: ${GITEA_TOKEN}
