auth: first-visitor
name: WordPress com MariaDB
description: Software open source para criar sites, blogs e aplicações.
description_en: Open source software to create websites, blogs and apps.
category: CMS
website: https://wordpress.org
services:
  wordpress:
    image: wordpress:7.1.4
    port: 80
    data: /var/www/html
    env:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: '{{mariadb.user}}'
      WORDPRESS_DB_PASSWORD: '{{mariadb.password}}'
      WORDPRESS_DB_NAME: wordpress
with:
  mariadb:
    database: wordpress
