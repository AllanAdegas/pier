name: WordPress com MariaDB
description: Software open source para criar sites, blogs e aplicações.
category: CMS
website: https://wordpress.org
tags:
  - cms
  - blog
  - content
  - management
  - mariadb
routes:
  - service: wordpress
    port: 80
compose: |
  services:
    mariadb:
      image: mariadb:11
      environment:
        - MYSQL_ROOT_PASSWORD=$PIER_PASSWORD_ROOT
        - MYSQL_DATABASE=wordpress
        - MYSQL_USER=$PIER_USER_WORDPRESS
        - MYSQL_PASSWORD=$PIER_PASSWORD_WORDPRESS
      volumes:
        - mariadb-data:/var/lib/mysql
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - healthcheck.sh
          - --connect
          - --innodb_initialized
        timeout: 20s
    wordpress:
      image: wordpress:latest
      environment:
        - WORDPRESS_DB_HOST=mariadb
        - WORDPRESS_DB_USER=$PIER_USER_WORDPRESS
        - WORDPRESS_DB_PASSWORD=$PIER_PASSWORD_WORDPRESS
        - WORDPRESS_DB_NAME=wordpress
      volumes:
        - wordpress-files:/var/www/html
      depends_on:
        - mariadb
      healthcheck:
        interval: 2s
        retries: 10
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1
        timeout: 10s
  volumes:
    mariadb-data: null
    wordpress-files: null
