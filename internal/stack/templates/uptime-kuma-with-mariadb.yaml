name: Uptime Kuma com MariaDB
description: Monitora em tempo real a disponibilidade das suas aplicações.
category: Monitoramento
website: https://github.com/louislam/uptime-kuma?tab=readme-ov-file
tags:
  - monitoring
  - status
  - performance
  - web
  - services
  - applications
  - real-time
routes:
  - service: uptime-kuma
    port: 3001
compose: |
  services:
    mariadb:
      image: mariadb:11
      environment:
        - MYSQL_USER=${PIER_USER_MARIADB}
        - MYSQL_PASSWORD=${PIER_PASSWORD_MARIADB}
        - MYSQL_ROOT_PASSWORD=${PIER_PASSWORD_ROOT}
        - MYSQL_DATABASE=${MYSQL_DATABASE:-uptime-kuma-db}
      volumes:
        - mariadb-data:/var/lib/mysql
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - healthcheck.sh
          - --connect
          - --innodb_initialized
        timeout: 20s
    uptime-kuma:
      image: louislam/uptime-kuma:2
      environment:
        - TZ=${TZ:-Etc/UTC}
      volumes:
        - uptime-kuma-data:/app/data
      depends_on:
        mariadb:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - extra/healthcheck
        timeout: 5s
  volumes:
    mariadb-data: null
    uptime-kuma-data: null
