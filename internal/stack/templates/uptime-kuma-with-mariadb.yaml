auth: first-visitor
name: Uptime Kuma com MariaDB
description: Monitora em tempo real a disponibilidade das suas aplicações.
description_en: Monitors the availability of your applications in real time.
category: Monitoramento
website: https://github.com/louislam/uptime-kuma?tab=readme-ov-file
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    port: 3001
    data: /app/data
    env:
      TZ: ${TZ:-Etc/UTC}
with:
  mariadb:
    database: uptime-kuma-db
