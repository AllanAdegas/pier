name: Prefect
description: Orquestração e observabilidade de workflows.
category: Automação
website: https://www.prefect.io/
tags:
  - workflow
  - orchestration
  - data-pipeline
  - python
  - automation
  - data-processing
  - data-integration
  - etl
routes:
  - service: prefect
    port: 4200
compose: |
  services:
    agent:
      image: prefecthq/prefect:3-python3.12
      entrypoint:
        - /opt/prefect/entrypoint.sh
        - prefect
        - worker
        - start
        - --pool=${DEFAULT_POOL_NAME}
        - --with-healthcheck
        - --name=${DEFAULT_WORKER_NAME}
        - --limit=${DEFAULT_POOL_LIMIT}
      environment:
        - PREFECT_API_URL=http://prefect:4200/api
        - PREFECT_API_KEY=${PIER_PASSWORD_APIKEY}
        - DEFAULT_POOL_NAME=${DEFAULT_POOL_NAME:-default}
        - DEFAULT_POOL_LIMIT=${DEFAULT_POOL_LIMIT:-1}
        - DEFAULT_WORKER_NAME=${DEFAULT_WORKER_NAME:-worker1}
      depends_on:
        prefect:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 3
        test:
          - CMD-SHELL
          - pwd
        timeout: 5s
    postgresql:
      image: postgres:16-alpine
      environment:
        - POSTGRES_USER=$PIER_USER_POSTGRES
        - POSTGRES_PASSWORD=$PIER_PASSWORD_POSTGRES
        - POSTGRES_DB=${POSTGRES_DB:-prefect}
      volumes:
        - pg-data:/var/lib/postgresql/data
      healthcheck:
        interval: 5s
        retries: 3
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 5s
    prefect:
      image: prefecthq/prefect:3-latest
      command:
        - prefect
        - server
        - start
        - --host
        - 0.0.0.0
        - --port
        - "4200"
      environment:
        - PREFECT_API_URL=${PIER_URL_PREFECT}/api
        - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://${PIER_USER_POSTGRES}:${PIER_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-prefect}
        - PREFECT_API_KEY=${PIER_PASSWORD_APIKEY}
        - PREFECT_EXPERIMENTAL_WARN=${PREFECT_EXPERIMENTAL_WARN:-false}
        - PREFECT_EXPERIMENTAL_ENABLE_SCHEDULE_CONCURRENCY=${PREFECT_EXPERIMENTAL_ENABLE_SCHEDULE_CONCURRENCY:-false}
        - PREFECT_RUNNER_SERVER_ENABLE=${PREFECT_RUNNER_SERVER_ENABLE:-false}
        - PREFECT_DEFAULT_WORK_POOL_NAME=${DEFAULT_POOL_NAME:-default}
      depends_on:
        postgresql:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 3
        test:
          - CMD
          - python
          - -c
          - import requests as r;r.get('http://127.0.0.1:4200/api/health').raise_for_status()
        timeout: 5s
  volumes:
    pg-data: null
