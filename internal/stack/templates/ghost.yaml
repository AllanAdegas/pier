name: Ghost
description: Plataforma de publicação para blogs e newsletters, com MySQL dedicado.
description_en: Publishing platform for blogs and newsletters, with a dedicated MySQL.
category: CMS
website: https://ghost.org
verified: true
services:
  ghost:
    image: ghost:5-alpine
    port: 2368
    data: /var/lib/ghost/content
    env:
      url: ${PIER_URL_GHOST:-http://localhost:2368}
      database__client: mysql
      database__connection__host: '{{db.host}}'
      database__connection__user: '{{db.user}}'
      database__connection__password: '{{db.password}}'
      database__connection__database: '{{db.database}}'
with:
  db:
    kind: mysql
    user: ghost
    database: ghost
