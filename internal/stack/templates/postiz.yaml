name: Postiz
description: Agendamento de redes sociais open source.
description_en: Open source social media scheduling.
category: Analytics
website: https://docs.postiz.com
services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.10.1
    port: 5000
    volumes:
    - postiz_config:/config/
    - postiz_uploads:/uploads/
    env:
      MAIN_URL: ${PIER_URL_POSTIZ}
      FRONTEND_URL: ${PIER_URL_POSTIZ}
      NEXT_PUBLIC_BACKEND_URL: ${PIER_URL_POSTIZ}/api
      JWT_SECRET: ${PIER_PASSWORD_JWTSECRET}
      DATABASE_URL: postgresql://postgres:{{postgres.password}}@postgres:5432/{{postgres.database}}
      REDIS_URL: redis://default:{{redis.password}}@redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_ACCESS_KEY: ${CLOUDFLARE_ACCESS_KEY}
      CLOUDFLARE_SECRET_ACCESS_KEY: ${CLOUDFLARE_SECRET_ACCESS_KEY}
      CLOUDFLARE_BUCKETNAME: ${CLOUDFLARE_BUCKETNAME}
      CLOUDFLARE_BUCKET_URL: ${CLOUDFLARE_BUCKET_URL}
      CLOUDFLARE_REGION: ${CLOUDFLARE_REGION}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-/uploads}
      NEXT_PUBLIC_UPLOAD_DIRECTORY: ${NEXT_PUBLIC_UPLOAD_DIRECTORY:-/uploads}
      NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY: ${NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      X_API_KEY: ${X_API}
      X_API_SECRET: ${X_SECRET}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_SECRET}
      REDDIT_CLIENT_ID: ${REDDIT_API}
      REDDIT_CLIENT_SECRET: ${REDDIT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_SECRET}
      THREADS_APP_ID: ${THREADS_ID}
      THREADS_APP_SECRET: ${THREADS_SECRET}
      FACEBOOK_APP_ID: ${FACEBOOK_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_SECRET}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_ID}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_SECRET}
      TIKTOK_CLIENT_ID: ${TIKTOK_ID}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_SECRET}
      PINTEREST_CLIENT_ID: ${PINTEREST_ID}
      PINTEREST_CLIENT_SECRET: ${PINTEREST_SECRET}
      DRIBBBLE_CLIENT_ID: ${DRIBBLE_ID}
      DRIBBBLE_CLIENT_SECRET: ${DRIBBLE_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_SECRET}
      DISCORD_BOT_TOKEN_ID: ${DISCORD_TOKEN}
      SLACK_ID: ${SLACK_ID}
      SLACK_SECRET: ${SLACK_SECRET}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      MASTODON_CLIENT_ID: ${MASTODON_ID}
      MASTODON_CLIENT_SECRET: ${MASTODON_SECRET}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
      BEEHIIVE_API_KEY: ${BEEHIIVE_KEY}
      BEEHIIVE_PUBLICATION_ID: ${BEEHIIVE_PUBID}
      OPENAI_API_KEY: ${OPENAI_KEY}
      NEXT_PUBLIC_DISCORD_SUPPORT: ${NEXT_PUBLIC_DISCORD_SUPPORT}
      NEXT_PUBLIC_POLOTNO: ${NEXT_PUBLIC_POLOTNO}
      IS_GENERAL: 'true'
      NX_ADD_PLUGINS: ${NX_ADD_PLUGINS:-false}
      NOT_SECURED: ${NOT_SECURED:-false}
      FEE_AMOUNT: ${FEE_AMOUNT:-0.05}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_SIGNING_KEY: ${STRIPE_SIGNING_KEY}
      STRIPE_SIGNING_KEY_CONNECT: ${STRIPE_SIGNING_KEY_CONNECT}
with:
  postgres:
    version: '14'
    user: postgres
    database: postiz-db
  redis:
    password: true
