name: Zero
description: Motor de sincronização orientado a consultas para apps TypeScript sobre Postgres.
category: Backend
website: https://zero.rocicorp.dev/docs/deployment
tags:
  - sync
  - realtime
  - postgres
  - typescript
  - local-first
routes:
  - service: zero
    port: 4848
compose: |
  services:
    postgres:
      image: postgres:18-alpine
      command:
        - postgres
        - -c
        - wal_level=logical
      environment:
        - POSTGRES_USER=${PIER_USER_POSTGRES}
        - POSTGRES_PASSWORD=${PIER_PASSWORD_64_POSTGRES}
        - POSTGRES_DB=${POSTGRES_DB:-zero-db}
      volumes:
        - postgres-data:/var/lib/postgresql
      healthcheck:
        interval: 10s
        retries: 10
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 20s
    zero:
      image: rocicorp/zero:1.6.2
      environment:
        - ZERO_UPSTREAM_DB=postgres://${PIER_USER_POSTGRES}:${PIER_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB}
        - ZERO_CVR_DB=postgres://${PIER_USER_POSTGRES}:${PIER_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB}
        - ZERO_CHANGE_DB=postgres://${PIER_USER_POSTGRES}:${PIER_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB}
        - ZERO_REPLICA_FILE=/data/replica.db
        - ZERO_ADMIN_PASSWORD=${PIER_PASSWORD_64_ADMIN}
        - ZERO_QUERY_URL=${ZERO_QUERY_URL:?Set the URL of your API /query endpoint}
        - ZERO_MUTATE_URL=${ZERO_MUTATE_URL:?Set the URL of your API /mutate endpoint}
        - ZERO_ENABLE_CRUD_MUTATIONS=${ZERO_ENABLE_CRUD_MUTATIONS:-false}
        - ZERO_NUM_SYNC_WORKERS=${ZERO_NUM_SYNC_WORKERS:-1}
        - ZERO_APP_ID=${ZERO_APP_ID:-zero}
        - ZERO_LOG_LEVEL=${ZERO_LOG_LEVEL:-info}
        - ZERO_ENABLE_TELEMETRY=${ZERO_ENABLE_TELEMETRY:-true}
        - ZERO_LAZY_STARTUP=${ZERO_LAZY_STARTUP:-false}
        - ZERO_QUERY_API_KEY=${ZERO_QUERY_API_KEY:-}
        - ZERO_MUTATE_API_KEY=${ZERO_MUTATE_API_KEY:-}
      volumes:
        - zero-data:/data
      depends_on:
        postgres:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 10
        start_period: 60s
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:4848/keepalive
        timeout: 20s
  volumes:
    postgres-data: null
    zero-data: null
