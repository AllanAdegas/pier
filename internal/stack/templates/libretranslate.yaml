name: LibreTranslate
description: API de tradução automática livre e auto-hospedada.
category: IA
website: https://libretranslate.com/docs/
tags:
  - translate
  - api
routes:
  - service: libretranslate
    port: 5000
compose: |
  services:
    libretranslate:
      image: libretranslate/libretranslate:latest
      environment:
        - LT_SSL=${LT_SSL:-true}
        - LT_UPDATE_MODELS=${LT_UPDATE_MODELS:-true}
        - LT_LOAD_ONLY=${LT_LOAD_ONLY:-en,es,fr,de,ja}
      volumes:
        - libretranslate-api-keys:/app/db
        - libretranslate-models:/home/libretranslate/.local
      healthcheck:
        test:
          - CMD-SHELL
          - ./venv/bin/python scripts/healthcheck.py
  volumes:
    libretranslate-api-keys: null
    libretranslate-models: null
