name: Typesense
description: Motor de busca em memória, moderno e simples de operar.
category: Busca
website: https://typesense.org/docs
tags:
  - search
  - search-engine
  - search-api
  - elasticsearch-alternative
routes:
  - service: typesense
    port: 8108
compose: |
  services:
    typesense:
      image: typesense/typesense:28.0
      environment:
        - TYPESENSE_ENABLE_CORS=${TYPESENSE_ENABLE_CORS:-true}
        - TYPESENSE_DATA_DIR=/data
        - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:?}
      volumes:
        - typesense_data:/data
      healthcheck:
        retries: 5
        test:
          - CMD
          - bash
          - -c
          - 'exec 3<>/dev/tcp/localhost/8108 && printf ''GET /health HTTP/1.1\r\nConnection: close\r\n\r\n'' >&3 && head -n1 <&3 | grep ''200'' && exec 3>&-'
        timeout: 7s
  volumes:
    typesense_data: null
