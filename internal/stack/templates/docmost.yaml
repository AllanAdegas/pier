name: Docmost
description: Wiki e documentação colaborativa open source.
description_en: Open source collaborative wiki and documentation.
category: Produtividade
website: https://docmost.com/docs/
services:
  docmost:
    image: docmost/docmost:0.97.0
    port: 3000
    data: /app/data/storage
    env:
      APP_SECRET: $PIER_PASSWORD_APPKEY
      APP_URL: $PIER_URL_DOCMOST
      DATABASE_URL: postgresql://{{postgresql.user}}:{{postgresql.password}}@postgresql/docmost?schema=public
      REDIS_URL: redis://redis:6379
      MAIL_DRIVER: ${MAIL_DRIVER:?}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SECURE: ${SMTP_SECURE}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN}
with:
  postgresql:
    kind: postgres
    version: '16'
    database: docmost
  redis: {}
