auth: none
name: Glances
description: 'Um olho no seu sistema: monitoramento em tempo real.'
description_en: 'An eye on your system: real-time monitoring.'
category: Monitoramento
website: https://nicolargo.github.io/glances/
services:
  glances:
    image: nicolargo/glances:4.5.9
    private: true
    port: 61208
    pid: host
    privileged: true
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock:ro
    env:
      GLANCES_OPT: -w
