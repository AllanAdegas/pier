name: Metabase
description: Business intelligence simples, com perguntas e dashboards sobre seus bancos.
description_en: Simple business intelligence, with questions and dashboards over your databases.
category: Dados
website: https://www.metabase.com
verified: true
services:
  metabase:
    image: metabase/metabase:v0.65.4
    port: 3000
    env:
      MB_DB_TYPE: postgres
      MB_DB_HOST: '{{db.host}}'
      MB_DB_PORT: '{{db.port}}'
      MB_DB_DBNAME: '{{db.database}}'
      MB_DB_USER: '{{db.user}}'
      MB_DB_PASS: '{{db.password}}'
with:
  db:
    kind: postgres
    user: metabase
    database: metabase
