name: Metabase
description: Business intelligence simples, com perguntas e dashboards sobre seus bancos.
category: Dados
website: https://www.metabase.com
verified: true
routes:
  - service: metabase
    port: 3000
compose: |
  services:
    metabase:
      image: metabase/metabase:latest
      environment:
        MB_DB_TYPE: postgres
        MB_DB_HOST: db
        MB_DB_PORT: "5432"
        MB_DB_DBNAME: metabase
        MB_DB_USER: metabase
        MB_DB_PASS: ${PIER_PASSWORD_DB}
      depends_on:
        db:
          condition: service_healthy
    db:
      image: postgres:17-alpine
      environment:
        POSTGRES_USER: metabase
        POSTGRES_PASSWORD: ${PIER_PASSWORD_DB}
        POSTGRES_DB: metabase
      volumes:
        - db:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
        interval: 5s
        timeout: 5s
        retries: 20
  volumes:
    db:
