name: Mealie
description: Gerenciador de receitas e planejador de refeições.
description_en: Recipe manager and meal planner.
category: Produtividade
website: https://docs.mealie.io/
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.17.0
    port: 9000
    data: /app/data
    env:
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Berlin}
      MAX_WORKERS: ${MAX_WORKERS:-1}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
