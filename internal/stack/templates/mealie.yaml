name: Mealie
description: Gerenciador de receitas e planejador de refeições.
category: Produtividade
website: https://docs.mealie.io/
tags:
  - recipe manager
  - meal planner
  - cooking
  - food
routes:
  - service: mealie
    port: 9000
compose: |
  services:
    mealie:
      image: ghcr.io/mealie-recipes/mealie:v3.17.0
      environment:
        - ALLOW_SIGNUP=${ALLOW_SIGNUP:-true}
        - PUID=${PUID:-1000}
        - PGID=${PGID:-1000}
        - TZ=${TZ:-Europe/Berlin}
        - MAX_WORKERS=${MAX_WORKERS:-1}
        - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      volumes:
        - mealie_data:/app/data
      healthcheck:
        interval: 5s
        retries: 5
        test:
          - CMD-SHELL
          - bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
        timeout: 10s
  volumes:
    mealie_data: null
