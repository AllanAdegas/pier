name: Apprise API
description: API de notificações push para dezenas de serviços.
description_en: Push notification API for dozens of services.
category: Automação
website: https://docs.linuxserver.io/images/docker-apprise-api/
services:
  apprise-api:
    image: linuxserver/apprise-api:2.1.0
    port: 8000
    data: /config
    env:
      PUID: '1000'
      PGID: '1000'
      TZ: UTC
