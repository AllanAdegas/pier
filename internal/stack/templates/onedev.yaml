name: OneDev
description: Servidor Git com CI/CD, kanban e pacotes.
description_en: Git server with CI/CD, kanban and packages.
category: Git
website: https://docs.onedev.io/
services:
  onedev:
    image: 1dev/server:17.1.2
    port: 6610
    volumes:
    - onedev-docker-sock:/var/run/docker.sock
    - onedev-data:/opt/onedev
    env:
      hibernate_dialect: io.onedev.server.persistence.PostgreSQLDialect
      hibernate_connection_driver_class: org.postgresql.Driver
      hibernate_connection_url: jdbc:postgresql://postgres:5432/{{postgres.database}}
      hibernate_connection_username: '{{postgres.user}}'
      hibernate_connection_password: '{{postgres.password}}'
      initial_user: ${PIER_USER_ONEDEV}
      initial_password: ${PIER_PASSWORD_ONEDEV}
      initial_email: ${ONEDEV_EMAIL:-mail@example.com}
      initial_server_url: ${PIER_URL_ONEDEV}
      initial_ssh_root_url: ${SSH_ROOT_URL:-ssh://${PIER_HOST_ONEDEV}:22}
with:
  postgres:
    version: '16'
    database: onedev
