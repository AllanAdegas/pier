name: OneDev
description: Servidor Git com CI/CD, kanban e pacotes.
category: Git
website: https://docs.onedev.io/
tags:
  - git
  - scm
  - ci
  - cd
  - kanban
  - packages
  - devops
  - collaboration
routes:
  - service: onedev
    port: 6610
compose: |
  services:
    onedev:
      image: 1dev/server:latest
      environment:
        - hibernate_dialect=io.onedev.server.persistence.PostgreSQLDialect
        - hibernate_connection_driver_class=org.postgresql.Driver
        - hibernate_connection_url=jdbc:postgresql://postgres:5432/${POSTGRESQL_DATABASE:-onedev}
        - hibernate_connection_username=${PIER_USER_DATABASE}
        - hibernate_connection_password=${PIER_PASSWORD_64_DATABASE}
        - initial_user=${PIER_USER_ONEDEV}
        - initial_password=${PIER_PASSWORD_ONEDEV}
        - initial_email=${ONEDEV_EMAIL:-mail@example.com}
        - initial_server_url=${PIER_URL_ONEDEV}
        - initial_ssh_root_url=${SSH_ROOT_URL:-ssh://changeme:22}
      volumes:
        - onedev-docker-sock:/var/run/docker.sock
        - onedev-data:/opt/onedev
      depends_on:
        postgres:
          condition: service_healthy
      healthcheck:
        test:
          - CMD
          - "true"
    postgres:
      image: postgres:16-alpine
      environment:
        - POSTGRES_USER=${PIER_USER_DATABASE}
        - POSTGRES_PASSWORD=${PIER_PASSWORD_64_DATABASE}
        - POSTGRES_DB=${POSTGRESQL_DATABASE:-onedev}
      volumes:
        - onedev-postgresql-data:/var/lib/postgresql/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - pg_isready
        timeout: 20s
  volumes:
    onedev-data: null
    onedev-docker-sock: null
    onedev-postgresql-data: null
