name: Jenkins
description: Servidor de automação open source, com centenas de plugins.
description_en: Open source automation server, with hundreds of plugins.
category: Desenvolvimento
website: https://www.jenkins.io/doc/
services:
  jenkins:
    image: jenkins/jenkins:2.590
    port: 8080
    volumes:
    - jenkins-home:/var/jenkins_home
    - /var/run/docker.sock:/var/run/docker.sock
