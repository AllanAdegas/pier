name: Label Studio
description: Rotulagem e anotação de dados de vários tipos.
description_en: Labeling and annotation for many kinds of data.
category: IA
website: https://labelstud.io/guide/
services:
  labelstudio:
    image: heartexlabs/label-studio@sha256:afcc516a22775a39d0d66f4c2ddc95d01be3e3d3862b21fcf4f9de34b4ad4e12
    port: 8080
    data: /label-studio/data
    env:
      CSRF_TRUSTED_ORIGINS: ${PIER_URL_LABELSTUDIO}
      EXPERIMENTAL_FEATURES: ${EXPERIMENTAL_FEATURES:-false}
      DJANGO_DB: ${DJANGO_DB:-default}
      POSTGRE_NAME: '{{postgres.database}}'
      POSTGRE_USER: '{{postgres.user}}'
      POSTGRE_PASSWORD: '{{postgres.password}}'
      POSTGRE_PORT: '5432'
      POSTGRE_HOST: postgres
      LABEL_STUDIO_HOST: ${PIER_URL_LABELSTUDIO}
      SSRF_PROTECTION_ENABLED: ${SSRF_PROTECTION_ENABLED:-true}
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: ${LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK:-true}
      DATA_UPLOAD_MAX_NUMBER_FILES: ${DATA_UPLOAD_MAX_NUMBER_FILES:-10000}
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:-admin@example.com}
      LABEL_STUDIO_PASSWORD: ${PIER_PASSWORD_LABELSTUDIO}
with:
  postgres:
    version: '16'
    database: labelstudio
