name: Vvveb com MariaDB
description: CMS para construir sites, blogs e lojas.
description_en: CMS to build websites, blogs and shops.
category: CMS
website: https://docs.vvveb.com
services:
  vvveb:
    image: vvveb/vvvebcms:php8.5-fpm-alpine
    port: 80
    data: /var/www/html
    env:
      DB_ENGINE: mysqli
      DB_HOST: mariadb
      DB_USER: '{{mariadb.user}}'
      DB_PASSWORD: '{{mariadb.password}}'
      DB_NAME: '{{mariadb.database}}'
with:
  mariadb:
    database: vvveb
