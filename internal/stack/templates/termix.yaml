auth: first-visitor
name: Termix
description: Gestão de SSH e área de trabalho remota em uma aplicação.
description_en: SSH and remote desktop management in one application.
category: Desenvolvimento
website: https://docs.termix.site/install/server/docker
services:
  guacd:
    image: guacamole/guacd:1.6.0
  termix:
    image: ghcr.io/lukegus/termix:2.6.1
    port: 8080
    data: /app/data
    env:
      PORT: '8080'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GUACD_HOST: guacd
      GUACD_RECORDING_PATH: /termix-data/session_recordings/guacamole
    needs:
    - guacd
