name: Autobase
description: Alternativa open source a bancos PostgreSQL gerenciados em nuvem (DBaaS próprio).
description_en: Open source alternative to managed cloud PostgreSQL (your own DBaaS).
category: Dados
website: https://autobase.tech/docs/
services:
  autobase:
    image: autobase/console_ui:2.11.0
    port: 80
    env:
      PG_CONSOLE_AUTHORIZATION_TOKEN: ${PIER_PASSWORD_UI}
      PG_CONSOLE_API_HOST: autobase-api
      PG_CONSOLE_DBDESK_STUDIO_HOST: dbdesk-studio
    depends_on:
      autobase-api:
        condition: service_healthy
  autobase-api:
    image: autobase/console_api:2.11.0
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /tmp/ansible:/tmp/ansible
    env:
      PG_CONSOLE_DB_HOST: autobase-db
      PG_CONSOLE_DB_PASSWORD: ${PIER_PASSWORD_POSTGRES}
      PG_CONSOLE_AUTHORIZATION_TOKEN: ${PIER_PASSWORD_UI}
      PG_CONSOLE_ENCRYPTIONKEY: ${PIER_PASSWORD_ENCRYPTIONKEY}
      PG_CONSOLE_LOGGER_LEVEL: ${PG_CONSOLE_LOGGER_LEVEL:-info}
    health:
    - CMD
    - curl
    - -fsS
    - -H
    - 'accept: application/json'
    - -H
    - 'Authorization: Bearer ${PIER_PASSWORD_UI}'
    - http://localhost:8080/api/v1/version
    depends_on:
      autobase-db:
        condition: service_healthy
  autobase-db:
    image: autobase/console_db:2.11.0
    data: /var/lib/postgresql
    env:
      POSTGRES_PASSWORD: ${PIER_PASSWORD_POSTGRES}
    health: 'cmd: pg_isready -U postgres'
  dbdesk-studio:
    image: docker.io/bhavikagarwal2001/dbdesk-studio:0.1.5
    data: /opt/dbdesk-studio
    container_name: dbdesk-studio
    env:
      PORT: '6789'
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      NODE_ENV: production
      DEFAULT_SSL_MODE: require
      STORAGE_PATH: /opt/dbdesk-studio/data
    depends_on:
      autobase-api:
        condition: service_healthy
