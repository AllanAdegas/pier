name: Penpot com S3
description: Plataforma open source de design e prototipagem para equipes de produto.
category: Produtividade
website: https://help.penpot.app/technical-guide/getting-started/#install-with-docker
tags:
  - penpot
  - design
  - prototyping
  - figma
routes:
  - service: frontend
    port: 8080
  - service: mailpit
    port: 8025
compose: |
  services:
    frontend:
      image: penpotapp/frontend:2.11.1
      environment:
        - PENPOT_FLAGS=${PENPOT_BACKEND_FLAGS:-enable-login-with-password}
      depends_on:
        penpot-backend:
          condition: service_healthy
        penpot-exporter:
          condition: service_healthy
      healthcheck:
        interval: 2s
        retries: 15
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:8080
        timeout: 10s
    mailpit:
      image: axllent/mailpit:v1.28
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - /mailpit
          - readyz
        timeout: 20s
    minio:
      image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
      command: server /data
      environment:
        - MINIO_ROOT_USER=${PIER_USER_MINIO}
        - MINIO_ROOT_PASSWORD=${PIER_PASSWORD_MINIO}
      volumes:
        - minio-data:/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - mc
          - ready
          - local
        timeout: 20s
    minio-init:
      image: pgsty/mc:latest
      entrypoint: |
        sh -c "
          mc alias set local http://minio:9000 ${PIER_USER_MINIO} ${PIER_PASSWORD_MINIO} &&
          mc mb -p local/penpot || true &&
          mc anonymous set private local/penpot
        "
      restart: "no"
      depends_on:
        minio:
          condition: service_healthy
    penpot-backend:
      image: penpotapp/backend:2.11.1
      environment:
        - PENPOT_FLAGS=${PENPOT_BACKEND_FLAGS:-enable-login-with-password}
        - PENPOT_HTTP_SERVER_PORT=6060
        - PENPOT_SECRET_KEY=${PIER_BASE64_64_PENPOT}
        - PENPOT_PUBLIC_URI=${PIER_URL_FRONTEND}
        - PENPOT_BACKEND_URI=http://penpot-backend
        - PENPOT_EXPORTER_URI=http://penpot-exporter
        - PENPOT_DATABASE_URI=postgresql://postgres/${POSTGRES_DB:-penpot}
        - PENPOT_DATABASE_USERNAME=${PIER_USER_POSTGRES}
        - PENPOT_DATABASE_PASSWORD=${PIER_PASSWORD_POSTGRES}
        - PENPOT_REDIS_URI=redis://penpot-valkey/0
        - PENPOT_TELEMETRY_ENABLED=${PENPOT_TELEMETRY_ENABLED:-false}
        - PENPOT_OBJECTS_STORAGE_BACKEND=s3
        - PENPOT_OBJECTS_STORAGE_S3_REGION=us-east-1
        - PENPOT_OBJECTS_STORAGE_S3_BUCKET=penpot
        - PENPOT_OBJECTS_STORAGE_S3_ENDPOINT=http://minio:9000
        - AWS_ACCESS_KEY_ID=${PIER_USER_MINIO}
        - AWS_SECRET_ACCESS_KEY=${PIER_PASSWORD_MINIO}
        - PENPOT_SMTP_DEFAULT_FROM=${PENPOT_SMTP_DEFAULT_FROM:-no-reply@example.com}
        - PENPOT_SMTP_DEFAULT_REPLY_TO=${PENPOT_SMTP_DEFAULT_REPLY_TO:-no-reply@example.com}
        - PENPOT_SMTP_HOST=${PENPOT_SMTP_HOST:-mailpit}
        - PENPOT_SMTP_PORT=${PENPOT_SMTP_PORT:-1025}
        - PENPOT_SMTP_USERNAME=${PENPOT_SMTP_USERNAME:-penpot}
        - PENPOT_SMTP_PASSWORD=${PENPOT_SMTP_PASSWORD:-penpot}
        - PENPOT_SMTP_TLS=${PENPOT_SMTP_TLS:-false}
        - PENPOT_SMTP_SSL=${PENPOT_SMTP_SSL:-false}
      depends_on:
        minio-init:
          condition: service_completed_successfully
        penpot-valkey:
          condition: service_healthy
        postgres:
          condition: service_healthy
      healthcheck:
        interval: 10s
        retries: 15
        test:
          - CMD
          - node
          - -e
          - 'require(''http'').get({host:''127.0.0.1'', port:6060, path:''/readyz''}, res => process.exit(res.statusCode===200 ? 0 : 1)).on(''error'', () => process.exit(1));'
        timeout: 30s
    penpot-exporter:
      image: penpotapp/exporter:2.11.1
      environment:
        - PENPOT_PUBLIC_URI=${PIER_URL_FRONTEND}
        - PENPOT_REDIS_URI=redis://penpot-valkey/0
      healthcheck:
        interval: 2s
        retries: 15
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:6061/readyz
        timeout: 10s
    penpot-valkey:
      image: valkey/valkey:8.1
      environment:
        - VALKEY_EXTRA_FLAGS=--maxmemory 128mb --maxmemory-policy volatile-lfu
      volumes:
        - penpot-valkey-data:/data
      healthcheck:
        interval: 1s
        retries: 5
        start_period: 3s
        test:
          - CMD-SHELL
          - valkey-cli ping | grep PONG
        timeout: 3s
    postgres:
      image: postgres:15
      environment:
        - POSTGRES_INITDB_ARGS=--data-checksums
        - POSTGRES_USER=${PIER_USER_POSTGRES}
        - POSTGRES_PASSWORD=${PIER_PASSWORD_POSTGRES}
        - POSTGRES_DB=${POSTGRES_DB:-penpot}
      volumes:
        - penpot-postgresql-data:/var/lib/postgresql/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 20s
  volumes:
    minio-data: null
    penpot-postgresql-data: null
    penpot-valkey-data: null
