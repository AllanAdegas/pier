name: Penpot com S3
description: Plataforma open source de design e prototipagem para equipes de produto.
description_en: Open source design and prototyping platform for product teams.
category: Produtividade
website: https://help.penpot.app/technical-guide/getting-started/#install-with-docker
services:
  frontend:
    image: penpotapp/frontend:2.11.1
    port: 8080
    env:
      PENPOT_FLAGS: ${PENPOT_BACKEND_FLAGS:-enable-login-with-password}
    depends_on:
      penpot-backend:
        condition: service_healthy
      penpot-exporter:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.28
    private: true
    port: 8025
  minio-init:
    image: pgsty/mc:RELEASE.2026-11-09T00-00-00Z
    entrypoint: |
      sh -c "
        mc alias set local http://minio:9000 {{minio.user}} {{minio.password}} &&
        mc mb -p local/penpot || true &&
        mc anonymous set private local/penpot
      "
    restart: 'no'
    needs:
    - minio
  penpot-backend:
    image: penpotapp/backend:2.11.1
    env:
      PENPOT_FLAGS: ${PENPOT_BACKEND_FLAGS:-enable-login-with-password}
      PENPOT_HTTP_SERVER_PORT: '6060'
      PENPOT_SECRET_KEY: ${PIER_BASE64_64_PENPOT}
      PENPOT_PUBLIC_URI: ${PIER_URL_FRONTEND}
      PENPOT_BACKEND_URI: http://penpot-backend
      PENPOT_EXPORTER_URI: http://penpot-exporter
      PENPOT_DATABASE_URI: postgresql://postgres/{{postgres.database}}
      PENPOT_DATABASE_USERNAME: '{{postgres.user}}'
      PENPOT_DATABASE_PASSWORD: '{{postgres.password}}'
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_TELEMETRY_ENABLED: ${PENPOT_TELEMETRY_ENABLED:-false}
      PENPOT_OBJECTS_STORAGE_BACKEND: s3
      PENPOT_OBJECTS_STORAGE_S3_REGION: us-east-1
      PENPOT_OBJECTS_STORAGE_S3_BUCKET: penpot
      PENPOT_OBJECTS_STORAGE_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: '{{minio.user}}'
      AWS_SECRET_ACCESS_KEY: '{{minio.password}}'
      PENPOT_SMTP_DEFAULT_FROM: ${PENPOT_SMTP_DEFAULT_FROM:-no-reply@example.com}
      PENPOT_SMTP_DEFAULT_REPLY_TO: ${PENPOT_SMTP_DEFAULT_REPLY_TO:-no-reply@example.com}
      PENPOT_SMTP_HOST: ${PENPOT_SMTP_HOST:-mailpit}
      PENPOT_SMTP_PORT: ${PENPOT_SMTP_PORT:-1025}
      PENPOT_SMTP_USERNAME: ${PENPOT_SMTP_USERNAME:-penpot}
      PENPOT_SMTP_PASSWORD: ${PENPOT_SMTP_PASSWORD:-penpot}
      PENPOT_SMTP_TLS: ${PENPOT_SMTP_TLS:-false}
      PENPOT_SMTP_SSL: ${PENPOT_SMTP_SSL:-false}
    health:
    - CMD
    - node
    - -e
    - 'require(''http'').get({host:''127.0.0.1'', port:6060, path:''/readyz''}, res => process.exit(res.statusCode===200 ? 0 : 1)).on(''error'', () => process.exit(1));'
    depends_on:
      minio-init:
        condition: service_completed_successfully
      penpot-valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
  penpot-exporter:
    image: penpotapp/exporter:2.11.1
    env:
      PENPOT_PUBLIC_URI: ${PIER_URL_FRONTEND}
      PENPOT_REDIS_URI: redis://penpot-valkey/0
    health:
    - CMD
    - curl
    - -f
    - http://127.0.0.1:6061/readyz
  penpot-valkey:
    image: valkey/valkey:8.1
    data: /data
    env:
      VALKEY_EXTRA_FLAGS: --maxmemory 128mb --maxmemory-policy volatile-lfu
    health: 'cmd: valkey-cli ping | grep PONG'
with:
  minio: {}
  postgres:
    version: '15'
    env:
      POSTGRES_INITDB_ARGS: --data-checksums
    database: penpot
