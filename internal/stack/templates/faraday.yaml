name: Faraday
description: Gestão de vulnerabilidades open source, via web.
description_en: Open source vulnerability management, on the web.
category: Segurança
website: https://faradaysec.com/
services:
  faraday:
    image: faradaysec/faraday:5.25.4
    port: 5985
    entrypoint: /entrypoint.sh
    volumes:
    - faraday:/home/faraday/.faraday:rw
    env:
      AUTHENTIK_POSTGRESQL__PASSWORD: '{{postgresql.password}}'
      PGSQL_USER: '{{postgresql.user}}'
      PGSQL_PASSWD: '{{postgresql.password}}'
      PGSQL_DBNAME: '{{postgresql.database}}'
      PGSQL_HOST: postgresql
      REDIS_SERVER: redis
with:
  postgresql:
    kind: postgres
    version: '18'
    database: faraday
  redis:
    args:
    - --save
    - '60'
    - '1'
    - --loglevel
    - warning
