name: NetBird Client
description: Conecta seus dispositivos em uma rede overlay WireGuard com SSO e MFA.
description_en: Connects your devices in a WireGuard overlay network with SSO and MFA.
category: Rede
website: https://docs.netbird.io/how-to/examples#net-bird-client-in-docker
services:
  netbird-client:
    image: netbirdio/netbird:0.82.1
    data: /var/lib/netbird
    network_mode: host
    cap_add:
    - NET_ADMIN
    - SYS_ADMIN
    - SYS_RESOURCE
    env:
      NB_SETUP_KEY: ${NB_SETUP_KEY}
      NB_ENABLE_ROSENPASS: ${NB_ENABLE_ROSENPASS:-false}
      NB_ENABLE_EXPERIMENTAL_LAZY_CONN: ${NB_ENABLE_EXPERIMENTAL_LAZY_CONN:-false}
