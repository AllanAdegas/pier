name: Nexus Repository (ARM)
description: Gerenciador universal de repositórios (versão ARM, comunidade). A senha inicial do admin fica em /nexus-data/admin.password (docker exec <container> cat /nexus-data/admin.password).
description_en: Universal repository manager (ARM build, community). The initial admin password is in /nexus-data/admin.password (docker exec <container> cat /nexus-data/admin.password).
category: Desenvolvimento
website: https://help.sonatype.com/en/sonatype-nexus-repository.html
services:
  nexus:
    image: sonatypecommunity/nexus3:3.77.2
    port: 8081
    data: /nexus-data
    env:
      INSTALL4J_ADD_VM_PARAMS: -Xms2703m -Xmx2703m -XX:MaxDirectMemorySize=2703m -Djava.util.prefs.userRoot=/nexus-data/javaprefs
