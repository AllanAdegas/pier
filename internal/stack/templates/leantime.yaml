name: Leantime
description: Gestão de projetos orientada a objetivos, para quem não é gerente de projetos.
description_en: Goal-oriented project management, for people who are not project managers.
category: Produtividade
website: https://leantime.io
services:
  leantime:
    image: leantime/leantime:3.13.2
    port: 8080
    volumes:
    - public-userfiles:/var/www/html/public/userfiles
    - userfiles:/var/www/html/userfiles
    - plugins:/var/www/html/app/Plugins
    env:
      LEAN_APP_URL: ${PIER_URL_LEANTIME}
      LEAN_DB_HOST: mysql
      LEAN_DB_USER: '{{mysql.user}}'
      LEAN_DB_PASSWORD: '{{mysql.password}}'
      LEAN_DB_DATABASE: '{{mysql.database}}'
      LEAN_SESSION_PASSWORD: ${PIER_PASSWORD_64_SALT}
      LEAN_SESSION_EXPIRATION: ${SESSION_EXPIRATION:-28800}
      LEAN_USE_REDIS: ${USE_REDIS:-true}
      LEAN_REDIS_HOST: redis
      LEAN_REDIS_PORT: ${REDIS_PORT:-6379}
      LEAN_REDIS_SCHEME: ${REDIS_SCHEME:-tcp}
with:
  mysql:
    args:
    - --character-set-server=UTF8MB4
    - --collation-server=UTF8MB4_unicode_ci
    database: leantime-db
  redis: {}
