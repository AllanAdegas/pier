name: Cloudreve
description: Sistema de gestão e compartilhamento de arquivos.
description_en: File management and sharing system.
category: Armazenamento
website: https://docs.cloudreve.org/
services:
  cloudreve:
    image: cloudreve/cloudreve:4.10.1
    port: 5212
    data: /cloudreve/data
    env:
      CR_CONF_Database.Type: postgres
      CR_CONF_Database.Host: postgres
      CR_CONF_Database.User: '{{postgres.user}}'
      CR_CONF_Database.Password: '{{postgres.password}}'
      CR_CONF_Database.Name: '{{postgres.database}}'
      CR_CONF_Database.Port: '5432'
      CR_CONF_Redis.Server: redis:6379
      CR_CONF_Redis.Password: '{{redis.password}}'
with:
  postgres:
    version: '18'
    database: cloudreve-db
  redis:
    password: true
