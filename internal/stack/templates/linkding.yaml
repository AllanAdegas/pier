name: linkding
description: Gerenciador de favoritos minimalista, rápido e fácil de instalar.
description_en: Minimal bookmark manager, fast and easy to set up.
category: RSS
website: https://linkding.link/
services:
  linkding:
    image: sissbruecker/linkding:1.47.0
    port: 9090
    data: /etc/linkding/data
    env:
      LD_SUPERUSER_NAME: ${PIER_USER_LINKDING}
      LD_SUPERUSER_PASSWORD: ${PIER_PASSWORD_LINKDING}
