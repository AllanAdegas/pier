name: DocuSeal com PostgreSQL
description: Assinatura de documentos; alternativa open source ao DocuSign.
description_en: Document signing; an open source alternative to DocuSign.
category: Produtividade
website: https://www.docuseal.co/
services:
  docuseal:
    image: docuseal/docuseal:3.3.6
    port: 3000
    data: /data
    env:
      HOST: ${PIER_URL_DOCUSEAL}
      DATABASE_URL: postgresql://{{postgresql.user}}:{{postgresql.password}}@postgresql:5432/{{postgresql.database}}
with:
  postgresql:
    kind: postgres
    version: '16'
    database: docuseal
