name: Soketi App Manager
description: Gerencie o servidor Soketi e suas aplicações.
description_en: Manage the Soketi server and its applications.
category: Desenvolvimento
website: https://github.com/rahulhaque/soketi-app-manager-filament
services:
  soketi-app-manager:
    image: ghcr.io/rahulhaque/soketi-app-manager-filament-alpine:1.1.8
    port: 8080
    env:
      AUTORUN_ENABLED: 'true'
      AUTORUN_LARAVEL_MIGRATION: ${AUTORUN_LARAVEL_MIGRATION:-true}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: $PIER_HOST_SOKETI_APP_MANAGER
      APP_KEY: $APP_KEY
      DB_CONNECTION: $DB_CONNECTION
      DB_HOST: $DB_HOST
      DB_PORT: $DB_PORT
      DB_DATABASE: $DB_DATABASE
      DB_USERNAME: $DB_USERNAME
      DB_PASSWORD: $DB_PASSWORD
      PUSHER_HOST: $PUSHER_HOST
      PUSHER_PORT: $PUSHER_PORT
      PUSHER_SCHEME: $PUSHER_SCHEME
      PUSHER_APP_CLUSTER: $PUSHER_APP_CLUSTER
      SOKETI_DB_REDIS_USERNAME: $SOKETI_DB_REDIS_USERNAME
      SOKETI_DB_REDIS_PASSWORD: $SOKETI_DB_REDIS_PASSWORD
      METRICS_HOST: $METRICS_HOST
