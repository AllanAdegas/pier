name: Cloudflare DDNS
description: Atualizador de DNS dinâmico para a Cloudflare, pequeno e robusto.
description_en: Small, robust dynamic DNS updater for Cloudflare.
category: Automação
website: https://github.com/favonia/cloudflare-ddns
services:
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1.16.2
    user: 1000:1000
    network_mode: host
    cap_drop:
    - all
    read_only: true
    security_opt:
    - no-new-privileges:true
    env:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?}
      DOMAINS: ${DOMAINS:?}
      PROXIED: ${PROXIED:-false}
      IP6_PROVIDER: ${IP6_PROVIDER:-none}
