name: linkding Plus
description: Gerenciador de favoritos minimalista, com arquivamento de páginas em HTML.
category: RSS
website: https://linkding.link/
tags:
  - rss
  - feed
routes:
  - service: linkding-plus
    port: 9090
compose: |
  services:
    linkding-plus:
      image: sissbruecker/linkding:latest-plus
      environment:
        - LD_SUPERUSER_NAME=${PIER_USER_LINKDING}
        - LD_SUPERUSER_PASSWORD=${PIER_PASSWORD_LINKDING}
      volumes:
        - linkding_data:/etc/linkding/data
      healthcheck:
        interval: 5s
        test:
          - CMD-SHELL
          - bash -c ':> /dev/tcp/127.0.0.1/9090' || exit 1
        timeout: 5s
  volumes:
    linkding_data: null
