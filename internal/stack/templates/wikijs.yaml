name: Wiki.js
description: Software de wiki open source, poderoso e extensível.
description_en: Powerful, extensible open source wiki software.
category: CMS
website: https://docs.requarks.io
services:
  wikijs:
    image: ghcr.io/requarks/wiki:2
    port: 3000
    env:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: '{{postgres.user}}'
      DB_PASS: '{{postgres.password}}'
      DB_NAME: '{{postgres.database}}'
with:
  postgres:
    version: '16'
    database: wiki-db
