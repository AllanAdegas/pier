name: NocoDB
description: Planilhas inteligentes sobre banco de dados, alternativa ao Airtable.
category: Dados
website: https://nocodb.com
verified: true
routes:
  - service: nocodb
    port: 8080
compose: |
  services:
    nocodb:
      image: nocodb/nocodb:latest
      environment:
        NC_AUTH_JWT_SECRET: ${PIER_SECRET_JWT}
      volumes:
        - data:/usr/app/data
  volumes:
    data:
