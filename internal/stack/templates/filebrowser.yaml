name: File Browser
description: Gerenciador de arquivos via web.
description_en: Web file manager.
category: Armazenamento
website: https://filebrowser.org
services:
  filebrowser:
    image: filebrowser/filebrowser:v2.63.23
    port: 80
    volumes:
    - isDirectory: true
      source: ./srv
      target: /srv
      type: bind
    - content: ""
      isDirectory: false
      source: ./database.db
      target: /database.db
      type: bind
    - content: |
        {
          "address": "0.0.0.0",
          "port": 80
        }
      read_only: true
      source: ./filebrowser.json
      target: /.filebrowser.json
      type: bind
