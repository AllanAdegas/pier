name: Chatwoot
description: Atendimento ao cliente omnichannel.
category: Atendimento
website: https://www.chatwoot.com/docs/self-hosted/
tags:
  - chatwoot
  - chat
  - api
  - rails
  - redis
  - postgresql
  - sidekiq
routes:
  - service: chatwoot
    port: 3000
compose: |
  services:
    chatwoot:
      image: chatwoot/chatwoot:latest
      command: sh -c "bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"
      entrypoint: docker/entrypoints/rails.sh
      environment:
        - SECRET_KEY_BASE=$PIER_PASSWORD_CHATWOOT
        - FRONTEND_URL=${PIER_URL_CHATWOOT}
        - DEFAULT_LOCALE=${CHATWOOT_DEFAULT_LOCALE}
        - FORCE_SSL=${FORCE_SSL:-false}
        - ENABLE_ACCOUNT_SIGNUP=${ENABLE_ACCOUNT_SIGNUP:-false}
        - REDIS_URL=redis://default@redis:6379
        - REDIS_PASSWORD=$PIER_PASSWORD_REDIS
        - REDIS_OPENSSL_VERIFY_MODE=${REDIS_OPENSSL_VERIFY_MODE:-none}
        - POSTGRES_DATABASE=${POSTGRES_DB:-chatwoot}
        - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
        - POSTGRES_USERNAME=$PIER_USER_POSTGRES
        - POSTGRES_PASSWORD=$PIER_PASSWORD_POSTGRES
        - RAILS_MAX_THREADS=${RAILS_MAX_THREADS:-5}
        - NODE_ENV=${NODE_ENV:-production}
        - RAILS_ENV=${RAILS_ENV:-production}
        - INSTALLATION_ENV=${INSTALLATION_ENV:-docker}
        - MAILER_SENDER_EMAIL=${CHATWOOT_MAILER_SENDER_EMAIL}
        - SMTP_ADDRESS=${CHATWOOT_SMTP_ADDRESS}
        - SMTP_AUTHENTICATION=${CHATWOOT_SMTP_AUTHENTICATION}
        - SMTP_DOMAIN=${CHATWOOT_SMTP_DOMAIN}
        - SMTP_ENABLE_STARTTLS_AUTO=${CHATWOOT_SMTP_ENABLE_STARTTLS_AUTO}
        - SMTP_PORT=${CHATWOOT_SMTP_PORT}
        - SMTP_USERNAME=${CHATWOOT_SMTP_USERNAME}
        - SMTP_PASSWORD=${CHATWOOT_SMTP_PASSWORD}
        - ACTIVE_STORAGE_SERVICE=${ACTIVE_STORAGE_SERVICE:-local}
        - SAFE_FETCH_ALLOW_PRIVATE_NETWORK=${SAFE_FETCH_ALLOW_PRIVATE_NETWORK:-false}
      volumes:
        - rails-data:/app/storage
      depends_on:
        - postgres
        - redis
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - wget
          - --spider
          - -q
          - http://127.0.0.1:3000
        timeout: 20s
    postgres:
      image: pgvector/pgvector:pg12
      restart: always
      environment:
        - POSTGRES_DB=${POSTGRES_DB:-chatwoot}
        - POSTGRES_USER=$PIER_USER_POSTGRES
        - POSTGRES_PASSWORD=$PIER_PASSWORD_POSTGRES
      volumes:
        - postgres-data:/var/lib/postgresql/data
      healthcheck:
        interval: 30s
        retries: 5
        test:
          - CMD-SHELL
          - pg_isready -U $PIER_USER_POSTGRES -d chatwoot -h 127.0.0.1
        timeout: 10s
    redis:
      image: redis:alpine
      command:
        - sh
        - -c
        - redis-server --requirepass "$PIER_PASSWORD_REDIS"
      restart: always
      volumes:
        - redis-data:/data
      healthcheck:
        interval: 30s
        retries: 5
        test:
          - CMD
          - redis-cli
          - -a
          - $PIER_PASSWORD_REDIS
          - PING
        timeout: 10s
    sidekiq:
      image: chatwoot/chatwoot:latest
      command:
        - bundle
        - exec
        - sidekiq
        - -C
        - config/sidekiq.yml
      environment:
        - SECRET_KEY_BASE=$PIER_PASSWORD_CHATWOOT
        - FRONTEND_URL=${PIER_URL_CHATWOOT}
        - DEFAULT_LOCALE=${CHATWOOT_DEFAULT_LOCALE}
        - FORCE_SSL=${FORCE_SSL:-false}
        - ENABLE_ACCOUNT_SIGNUP=${ENABLE_ACCOUNT_SIGNUP:-false}
        - REDIS_URL=redis://default@redis:6379
        - REDIS_PASSWORD=$PIER_PASSWORD_REDIS
        - REDIS_OPENSSL_VERIFY_MODE=${REDIS_OPENSSL_VERIFY_MODE:-none}
        - POSTGRES_DATABASE=${POSTGRES_DB:-chatwoot}
        - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
        - POSTGRES_USERNAME=$PIER_USER_POSTGRES
        - POSTGRES_PASSWORD=$PIER_PASSWORD_POSTGRES
        - RAILS_MAX_THREADS=${RAILS_MAX_THREADS:-5}
        - NODE_ENV=${NODE_ENV:-production}
        - RAILS_ENV=${RAILS_ENV:-production}
        - INSTALLATION_ENV=${INSTALLATION_ENV:-docker}
        - MAILER_SENDER_EMAIL=${CHATWOOT_MAILER_SENDER_EMAIL}
        - SMTP_ADDRESS=${CHATWOOT_SMTP_ADDRESS}
        - SMTP_AUTHENTICATION=${CHATWOOT_SMTP_AUTHENTICATION}
        - SMTP_DOMAIN=${CHATWOOT_SMTP_DOMAIN}
        - SMTP_ENABLE_STARTTLS_AUTO=${CHATWOOT_SMTP_ENABLE_STARTTLS_AUTO}
        - SMTP_PORT=${CHATWOOT_SMTP_PORT}
        - SMTP_USERNAME=${CHATWOOT_SMTP_USERNAME}
        - SMTP_PASSWORD=${CHATWOOT_SMTP_PASSWORD}
        - ACTIVE_STORAGE_SERVICE=${ACTIVE_STORAGE_SERVICE:-local}
      volumes:
        - rails-data:/app/storage
      depends_on:
        - postgres
        - redis
      healthcheck:
        interval: 30s
        retries: 3
        test:
          - CMD-SHELL
          - bundle exec sidekiqmon processes | grep -q 'sidekiq'
        timeout: 10s
  volumes:
    postgres-data: null
    rails-data: null
    redis-data: null
