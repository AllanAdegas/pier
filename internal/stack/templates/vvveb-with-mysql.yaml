name: Vvveb com MySQL
description: CMS para construir sites, blogs e lojas.
description_en: CMS to build websites, blogs and shops.
category: CMS
website: https://docs.vvveb.com
services:
  vvveb:
    image: vvveb/vvvebcms:php8.5-fpm-alpine
    port: 80
    data: /var/www/html
    env:
      DB_ENGINE: mysqli
      DB_HOST: mysql
      DB_USER: '{{mysql.user}}'
      DB_PASSWORD: '{{mysql.password}}'
      DB_NAME: '{{mysql.database}}'
with:
  mysql:
    database: vvveb
