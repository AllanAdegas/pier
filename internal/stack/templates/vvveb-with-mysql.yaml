name: Vvveb com MySQL
description: CMS para construir sites, blogs e lojas.
category: CMS
website: https://docs.vvveb.com
tags:
  - cms
  - blog
  - content
  - management
  - ecommerce
  - page-builder
  - nocode
  - mysql
routes:
  - service: vvveb
    port: 80
compose: |
  services:
    mysql:
      image: mysql:8.4.2
      environment:
        - MYSQL_ROOT_PASSWORD=${PIER_PASSWORD_ROOT}
        - MYSQL_DATABASE=${MYSQL_DATABASE:-vvveb}
        - MYSQL_USER=${PIER_USER_VVVEB}
        - MYSQL_PASSWORD=${PIER_PASSWORD_VVVEB}
      volumes:
        - vvveb-mysql-data:/var/lib/mysql
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - mysqladmin
          - ping
          - -h
          - 127.0.0.1
        timeout: 20s
    vvveb:
      image: vvveb/vvvebcms:latest
      environment:
        - DB_ENGINE=mysqli
        - DB_HOST=mysql
        - DB_USER=${PIER_USER_VVVEB}
        - DB_PASSWORD=${PIER_PASSWORD_VVVEB}
        - DB_NAME=${MYSQL_DATABASE:-vvveb}
      volumes:
        - vvveb-data:/var/www/html
      depends_on:
        mysql:
          condition: service_healthy
      healthcheck:
        interval: 2s
        retries: 10
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1
        timeout: 10s
  volumes:
    vvveb-data: null
    vvveb-mysql-data: null
