name: ClassicPress com MySQL
description: CMS leve e estável baseado no WordPress, sem o editor de blocos.
description_en: Lightweight, stable CMS based on WordPress, without the block editor.
category: CMS
website: https://www.classicpress.net/
services:
  classicpress:
    image: classicpress/classicpress@sha256:4f171f959f80420fd6ef1c46ef4031dcc4f87ed1bf1c97c60d13c17bacbaaaec
    port: 80
    data: /var/www/html
    env:
      CLASSICPRESS_DB_HOST: mysql
      CLASSICPRESS_DB_USER: '{{mysql.user}}'
      CLASSICPRESS_DB_PASSWORD: '{{mysql.password}}'
      CLASSICPRESS_DB_NAME: classicpress
with:
  mysql:
    version: '8.0'
    database: classicpress
