name: Nitropage com PostgreSQL
description: Construtor visual de sites, extensível.
description_en: Extensible visual website builder.
category: CMS
website: https://nitropage.org
services:
  nitropage:
    image: nitropage/nitropage:0.70.3
    port: 3000
    data: /app/.data
    env:
      NP_AUTH_SALT: ${PIER_PASSWORD_SALT}
      NP_AUTH_PASSWORD: ${PIER_PASSWORD_64_SESSION}
      DATABASE_URL: postgresql://{{postgresql.user}}:{{postgresql.password}}@postgresql:5432/{{postgresql.database}}
with:
  postgresql:
    kind: postgres
    version: '16'
    database: nitropage
