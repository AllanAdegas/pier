name: Keycloak com PostgreSQL
description: Gestão de identidade e acesso open source.
description_en: Open source identity and access management.
category: Autenticação
website: https://www.keycloak.org
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    port: 8080
    data: /opt/keycloak/data
    command:
    - start
    env:
      TZ: ${TIMEZONE:-UTC}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${PIER_USER_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PIER_PASSWORD_ADMIN}
      KC_DB: postgres
      KC_DB_USERNAME: '{{postgres.user}}'
      KC_DB_PASSWORD: '{{postgres.password}}'
      KC_DB_URL_PORT: '5432'
      KC_DB_URL: jdbc:postgresql://postgres/{{postgres.database}}
      KC_HOSTNAME: ${PIER_URL_KEYCLOAK}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED:-true}
      KC_HEALTH_ENABLED: ${KC_HEALTH_ENABLED:-true}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
with:
  postgres:
    version: '16'
    database: keycloak
