name: Keycloak com PostgreSQL
description: Gestão de identidade e acesso open source.
category: Autenticação
website: https://www.keycloak.org
tags:
  - keycloak
  - identity
  - access
  - management
  - iam
  - authentication
  - authorization
  - security
routes:
  - service: keycloak
    port: 8080
compose: |
  services:
    keycloak:
      image: quay.io/keycloak/keycloak:26.1
      command:
        - start
      environment:
        - TZ=${TIMEZONE:-UTC}
        - KC_BOOTSTRAP_ADMIN_USERNAME=${PIER_USER_ADMIN}
        - KC_BOOTSTRAP_ADMIN_PASSWORD=${PIER_PASSWORD_ADMIN}
        - KC_DB=postgres
        - KC_DB_USERNAME=${PIER_USER_DATABASE}
        - KC_DB_PASSWORD=${PIER_PASSWORD_64_DATABASE}
        - KC_DB_URL_PORT=5432
        - KC_DB_URL=jdbc:postgresql://postgres/${POSTGRESQL_DATABASE:-keycloak}
        - KC_HOSTNAME=${PIER_URL_KEYCLOAK}
        - KC_HTTP_ENABLED=${KC_HTTP_ENABLED:-true}
        - KC_HEALTH_ENABLED=${KC_HEALTH_ENABLED:-true}
        - KC_PROXY_HEADERS=${KC_PROXY_HEADERS:-xforwarded}
      volumes:
        - keycloak-data:/opt/keycloak/data
      depends_on:
        postgres:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost:9000\r\nConnection: close\r\n\r\n' >&3;cat <&3 | grep -q '\"status\": \"UP\"' && exit 0 || exit 1"
        timeout: 20s
    postgres:
      image: postgres:16-alpine
      environment:
        - POSTGRES_USER=${PIER_USER_DATABASE}
        - POSTGRES_PASSWORD=${PIER_PASSWORD_64_DATABASE}
        - POSTGRES_DB=${POSTGRESQL_DATABASE:-keycloak}
      volumes:
        - keycloak-postgresql-data:/var/lib/postgresql/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 20s
  volumes:
    keycloak-data: null
    keycloak-postgresql-data: null
