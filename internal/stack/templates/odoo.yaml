auth: generated
name: Odoo
description: Suíte de aplicações de negócio open source.
description_en: Open source suite of business applications.
category: Produtividade
website: https://www.odoo.com/
services:
  odoo-init:
    image: busybox:1.37.0
    restart: 'no'
    volumes:
    - odoo-config:/config
    env:
      ADMIN_PASSWORD: ${PIER_PASSWORD_ODOOADMIN}
    entrypoint:
    - sh
    - -ec
    - |
      umask 022
      printf '[options]\naddons_path = /mnt/extra-addons\ndata_dir = /var/lib/odoo\nadmin_passwd = %s\n' "$$ADMIN_PASSWORD" > /config/odoo.conf
  odoo:
    image: odoo:18
    port: 8069
    depends_on:
      odoo-init:
        condition: service_completed_successfully
    volumes:
    - odoo-config:/etc/odoo:ro
    - odoo-web-data:/var/lib/odoo
    - odoo-extra-addons:/mnt/extra-addons
    env:
      HOST: postgresql
      USER: '{{postgresql.user}}'
      PASSWORD: '{{postgresql.password}}'
with:
  postgresql:
    kind: postgres
    version: '16'
    database: postgres
