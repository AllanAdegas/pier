name: EmbyStat
description: Estatísticas do seu servidor Emby ou Jellyfin.
description_en: Statistics for your Emby or Jellyfin server.
category: Analytics
website: https://github.com/mregni/EmbyStat
services:
  embystat:
    image: lscr.io/linuxserver/embystat:0.2.0
    port: 6555
    data: /config
    env:
      PUID: '1000'
      PGID: '1000'
      TZ: Europe/Madrid
