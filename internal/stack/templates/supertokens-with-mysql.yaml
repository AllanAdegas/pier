name: SuperTokens com MySQL
description: 'Autenticação open source: login seguro e gestão de sessões.'
category: Autenticação
website: https://supertokens.com/docs/guides
tags:
  - supertokens
  - login
  - authentication
  - authorization
  - oauth
  - user-management
  - session-management
  - access-control
routes:
  - service: supertokens
    port: 3567
compose: |
  services:
    mysql:
      image: mysql:latest
      environment:
        - MYSQL_ROOT_PASSWORD=$PIER_PASSWORD_MYSQL
        - MYSQL_USER=$PIER_USER_MYSQL
        - MYSQL_PASSWORD=$PIER_PASSWORD_MYSQL
        - MYSQL_DATABASE=${MYSQL_DATABASE:-supertokens}
      volumes:
        - supertokens-mysql-data:/var/lib/mysql
      healthcheck:
        retries: 10
        test:
          - CMD
          - mysqladmin
          - ping
          - -h
          - localhost
        timeout: 20s
    supertokens:
      image: registry.supertokens.io/supertokens/supertokens-mysql:latest
      environment:
        - API_KEYS=${API_KEYS:-}
        - MYSQL_CONNECTION_URI=mysql://$PIER_USER_MYSQL:$PIER_PASSWORD_MYSQL@mysql:3306/${MYSQL_DATABASE:-supertokens}
      depends_on:
        mysql:
          condition: service_healthy
      healthcheck:
        interval: 10s
        retries: 5
        test: |
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
        timeout: 5s
  volumes:
    supertokens-mysql-data: null
