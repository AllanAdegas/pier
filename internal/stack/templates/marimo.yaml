name: marimo
description: 'Notebook reativo para Python: reproduzível, amigo do Git e com SQL embutido.'
description_en: 'Reactive Python notebook: reproducible, Git-friendly and with built-in SQL.'
category: Desenvolvimento
website: https://marimo.io/
services:
  marimo:
    image: ghcr.io/marimo-team/marimo:0.25.2-sql
    port: 8080
    data: /app
    command:
    - marimo
    - edit
    - --token-password
    - ${PIER_PASSWORD_MARIMO}
    - --port
    - '8080'
    - --host
    - 0.0.0.0
    env:
      TOKEN_PASSWORD: $PIER_PASSWORD_MARIMO
