name: marimo
description: 'Notebook reativo para Python: reproduzível, amigo do Git e com SQL embutido.'
category: Desenvolvimento
website: https://marimo.io/
tags:
  - notebook
  - python
  - data
  - analysis
routes:
  - service: marimo
    port: 8080
compose: |
  services:
    marimo:
      image: ghcr.io/marimo-team/marimo:latest-sql
      command:
        - marimo
        - edit
        - --token-password
        - ${PIER_PASSWORD_MARIMO}
        - --port
        - "8080"
        - --host
        - 0.0.0.0
      environment:
        - TOKEN_PASSWORD=$PIER_PASSWORD_MARIMO
      volumes:
        - marimo:/app
      healthcheck:
        interval: 5s
        retries: 3
        test:
          - CMD
          - uvx
          - --with
          - httpx[cli]
          - httpx
          - http://localhost:8080/health
        timeout: 5s
  volumes:
    marimo: null
