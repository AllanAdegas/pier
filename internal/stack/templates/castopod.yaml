name: Castopod
description: Hospedagem de podcasts open source, com interação com a audiência.
description_en: Open source podcast hosting, with audience interaction.
category: Mídia
website: https://docs.castopod.org/main/en/
services:
  castopod:
    image: castopod/castopod:1.15.4
    port: 8080
    data: /var/www/castopod/public/media
    env:
      MYSQL_DATABASE: castopod
      MYSQL_USER: '{{mariadb.user}}'
      MYSQL_PASSWORD: '{{mariadb.root_password}}'
      CP_DISABLE_HTTPS: ${CP_DISABLE_HTTPS:-1}
      CP_BASEURL: $PIER_URL_CASTOPOD
      CP_ANALYTICS_SALT: $PIER_BASE64_64_SALT
      CP_CACHE_HANDLER: redis
      CP_REDIS_HOST: redis
      CP_REDIS_PASSWORD: '{{redis.password}}'
with:
  mariadb:
    database: castopod
  redis:
    password: true
