name: Rivet Engine
description: Construa e escale cargas com estado e processos de longa duração.
category: Desenvolvimento
website: https://www.rivet.dev/docs
tags:
  - stateful
  - actors
  - realtime
  - backend
  - serverless
  - postgresql
routes:
  - service: rivet-engine
    port: 6420
compose: |
  services:
    rivet-engine:
      image: rivetdev/engine:2.2.0
      environment:
        - RIVET__FILE_SYSTEM__PATH=/data
        - RIVET__AUTH__ADMIN_TOKEN=${PIER_PASSWORD_TOKEN}
      volumes:
        - rivet-data:/data
      healthcheck:
        interval: 2s
        retries: 10
        start_period: 30s
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:6420/health
        timeout: 10s
  volumes:
    rivet-data: null
