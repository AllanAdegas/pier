name: GitHub Runner
description: Runner do GitHub Actions em Docker.
description_en: GitHub Actions runner in Docker.
category: Desenvolvimento
website: https://github.com/myoung34/docker-github-actions-runner/wiki/Usage
services:
  runner:
    image: myoung34/github-runner:2.338.2
    security_opt:
    - label:disable
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - runner-data:/runner
    env:
      REPO_URL: ${REPO_URL}
      RUNNER_NAME_PREFIX: ${RUNNER_NAME_PREFIX:-pier-runner}
      RUNNER_NAME_SUFFIX: ${RUNNER_NAME_SUFFIX:-false}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      RUNNER_WORKDIR: /runner/work
      RUNNER_SCOPE: ${RUNNER_SCOPE:-repo}
      LABELS: ${LABELS:-default}
      ORG_NAME: ${ORG_NAME}
