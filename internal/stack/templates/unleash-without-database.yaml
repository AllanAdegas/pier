name: Unleash (sem banco)
description: Gestão de feature flags open source.
description_en: Open source feature flag management.
category: Desenvolvimento
website: https://docs.getunleash.io
services:
  unleash:
    image: unleashorg/unleash-server:8.3.1
    port: 4242
    command:
    - node
    - index.js
    env:
      UNLEASH_URL: ${PIER_URL_UNLEASH}
      UNLEASH_DEFAULT_ADMIN_PASSWORD: ${PIER_PASSWORD_UNLEASH}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      LOG_LEVEL: warn
      INIT_FRONTEND_API_TOKENS: default:default:development.${PIER_HEX_FRONTENDTOKEN}
      INIT_CLIENT_API_TOKENS: default:development.${PIER_HEX_CLIENTTOKEN}
