name: Unleash (sem banco)
description: Gestão de feature flags open source.
category: Desenvolvimento
website: https://docs.getunleash.io
tags:
  - unleash
  - feature flags
  - feature toggles
  - ab testing
  - open source
routes:
  - service: unleash
    port: 4242
compose: |
  services:
    unleash:
      image: unleashorg/unleash-server:latest
      command:
        - node
        - index.js
      environment:
        - UNLEASH_URL=${PIER_URL_UNLEASH}
        - UNLEASH_DEFAULT_ADMIN_PASSWORD=${PIER_PASSWORD_UNLEASH}
        - DATABASE_URL=${DATABASE_URL}
        - DATABASE_SSL=${DATABASE_SSL:-false}
        - LOG_LEVEL=warn
        - INIT_FRONTEND_API_TOKENS=default:default:development.unleash-insecure-frontend-api-token
        - INIT_CLIENT_API_TOKENS=default:development.unleash-insecure-api-token
      healthcheck:
        interval: 1s
        retries: 5
        start_period: 15s
        test: wget --no-verbose --tries=1 --spider http://127.0.0.1:4242/health || exit 1
        timeout: 1m
