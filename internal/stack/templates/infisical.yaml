auth: first-visitor
name: Infisical
description: Plataforma open source de gestão de segredos e configuração.
description_en: Open source secrets and configuration management platform.
category: Segurança
website: https://infisical.com/docs/documentation/getting-started/introduction
services:
  backend:
    image: infisical/infisical:v0.154.6
    port: 8080
    env:
      SITE_URL: ${PIER_URL_BACKEND}
      NODE_ENV: ${NODE_ENV:-production}
      ENCRYPTION_KEY: ${PIER_PASSWORD_ENCRYPTIONKEY}
      AUTH_SECRET: ${PIER_BASE64_64_AUTHSECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      INF_APP_CONNECTION_GITHUB_APP_CLIENT_ID: ${INF_APP_CONNECTION_GITHUB_APP_CLIENT_ID}
      INF_APP_CONNECTION_GITHUB_APP_CLIENT_SECRET: ${INF_APP_CONNECTION_GITHUB_APP_CLIENT_SECRET}
      INF_APP_CONNECTION_GITHUB_APP_SLUG: ${INF_APP_CONNECTION_GITHUB_APP_SLUG}
      INF_APP_CONNECTION_GITHUB_APP_ID: ${INF_APP_CONNECTION_GITHUB_APP_ID}
      INF_APP_CONNECTION_GITHUB_APP_PRIVATE_KEY: ${INF_APP_CONNECTION_GITHUB_APP_PRIVATE_KEY}
      DB_CONNECTION_URI: postgres://{{db.user}}:{{db.password}}@db:5432/{{db.database}}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  redis:
    image: redis:7
    data: /data
    env:
      ALLOW_EMPTY_PASSWORD: ${ALLOW_EMPTY_PASSWORD:-yes}
    health: 'cmd: redis-cli -h localhost -p 6379 ping'
with:
  db:
    kind: postgres
    version: '14'
    database: infisical
