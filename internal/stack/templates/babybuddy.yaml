name: Baby Buddy
description: Ajuda pais a acompanhar atividades, crescimento e saúde do bebê.
description_en: Helps parents track a baby's activities, growth and health.
category: Produtividade
website: https://docs.baby-buddy.net
services:
  babybuddy:
    image: lscr.io/linuxserver/babybuddy:2.11.0
    port: 8000
    data: /config
    env:
      PUID: '1000'
      PGID: '1000'
      TZ: Europe/Madrid
      CSRF_TRUSTED_ORIGINS: $PIER_URL_BABYBUDDY
