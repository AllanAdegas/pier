name: PeerTube
description: Plataforma de vídeo livre e descentralizada.
category: Mídia
website: https://docs.joinpeertube.org/install/docker
tags:
  - video
  - fediverse
  - activitypub
  - youtube
  - streaming
  - self-hosted
routes:
  - service: peertube
    port: 9000
compose: |
  services:
    peertube:
      image: chocobozzz/peertube:v8.2.4
      restart: always
      environment:
        - PEERTUBE_WEBSERVER_HOSTNAME=${PIER_HOST_PEERTUBE}
        - PEERTUBE_WEBSERVER_PORT=${PEERTUBE_WEBSERVER_PORT:-443}
        - PEERTUBE_WEBSERVER_HTTPS=${PEERTUBE_WEBSERVER_HTTPS:-true}
        - PEERTUBE_TRUST_PROXY=["127.0.0.1", "loopback", "172.16.0.0/12"]
        - PEERTUBE_SECRET=${PIER_HEX_32_PEERTUBESECRET}
        - PEERTUBE_DB_HOSTNAME=postgres
        - PEERTUBE_DB_USERNAME=${PIER_USER_POSTGRESQL}
        - PEERTUBE_DB_PASSWORD=${PIER_PASSWORD_POSTGRESQL}
        - PEERTUBE_DB_NAME=${POSTGRES_DB:-peertube}
        - PEERTUBE_DB_SSL=false
        - PEERTUBE_REDIS_HOSTNAME=redis
        - PEERTUBE_SMTP_HOSTNAME=postfix
        - PEERTUBE_SMTP_PORT=25
        - PEERTUBE_SMTP_FROM=noreply@${PIER_HOST_PEERTUBE}
        - PEERTUBE_SMTP_TLS=false
        - PEERTUBE_SMTP_DISABLE_STARTTLS=false
        - PEERTUBE_ADMIN_EMAIL=${PEERTUBE_ADMIN_EMAIL:?}
      volumes:
        - peertube-data:/data
        - peertube-config:/config
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        interval: 10s
        retries: 5
        test:
          - CMD
          - curl
          - -f
          - http://localhost:9000/api/v1/ping
        timeout: 5s
    postfix:
      image: mwader/postfix-relay:1.2.17
      restart: always
      environment:
        - POSTFIX_myhostname=${PIER_HOST_PEERTUBE}
    postgres:
      image: postgres:17-alpine
      restart: always
      environment:
        - POSTGRES_USER=${PIER_USER_POSTGRESQL}
        - POSTGRES_PASSWORD=${PIER_PASSWORD_POSTGRESQL}
        - POSTGRES_DB=${POSTGRES_DB:-peertube}
      volumes:
        - db-data:/var/lib/postgresql/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-peertube}
        timeout: 5s
    redis:
      image: redis:8-alpine
      restart: always
      volumes:
        - redis-data:/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - redis-cli
          - ping
        timeout: 5s
  volumes:
    db-data: null
    peertube-config: null
    peertube-data: null
    redis-data: null
