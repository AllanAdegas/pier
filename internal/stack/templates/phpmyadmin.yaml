name: phpMyAdmin
description: Administração de bancos MySQL e MariaDB via web.
description_en: Web administration for MySQL and MariaDB databases.
category: Dados
website: https://phpmyadmin.net
services:
  phpmyadmin:
    image: lscr.io/linuxserver/phpmyadmin:5.2.3
    port: 80
    data: /config
    env:
      PUID: '1000'
      PGID: '1000'
      TZ: Europe/Madrid
      PMA_ARBITRARY: '1'
      PMA_ABSOLUTE_URI: $PIER_URL_PHPMYADMIN
