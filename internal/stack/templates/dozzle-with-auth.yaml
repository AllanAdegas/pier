name: Dozzle com autenticação
description: Interface web simples e leve para logs do Docker.
category: Desenvolvimento
website: https://dozzle.dev/
tags:
  - dozzle
  - docker
  - logs
  - web-ui
routes:
  - service: dozzle
    port: 8080
compose: |
  services:
    dozzle:
      image: amir20/dozzle:latest
      environment:
        - DOZZLE_AUTH_PROVIDER=simple
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - content: |
            users:
              # "admin" is the username
              admin:
                email: test@email.com
                name: Admin
                # A bcrypt hash of the password you want to use. Can be computed with "python3 -c 'import bcrypt;print(bcrypt.hashpw(b"your-password",bcrypt.gensalt(11)).decode())' ". Default password is "test".
                password: $2a$11$viucCvFLlHWvBNOOI6uypuVU.D09UWb.zswRxEg0MkDPi1q/bKbdG
          source: ./data/users.yml
          target: /data/users.yml:ro
          type: bind
      healthcheck:
        interval: 3s
        retries: 5
        test:
          - CMD
          - /dozzle
          - healthcheck
        timeout: 30s
