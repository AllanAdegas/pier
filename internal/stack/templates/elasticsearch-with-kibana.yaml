name: Elasticsearch com Kibana
description: Stack de busca, monitoramento e visualização.
category: Monitoramento
website: https://www.elastic.co/docs/deploy-manage/deploy/self-managed/install-kibana-with-docker
tags:
  - elastic
  - kibana
  - elasticsearch
  - search
  - visualization
  - logging
  - monitoring
  - observability
routes:
  - service: kibana
    port: 5601
compose: |
  services:
    elasticsearch:
      image: elastic/elasticsearch:9.1.2
      environment:
        - ELASTIC_USER=elastic
        - ELASTIC_PASSWORD=${PIER_PASSWORD_ELASTICSEARCH}
        - ES_JAVA_OPTS=-Xms512m -Xmx512m
        - discovery.type=single-node
        - bootstrap.memory_lock=true
        - xpack.security.http.ssl.enabled=false
      volumes:
        - /etc/localtime:/etc/localtime:ro
        - elasticsearch-data:/usr/share/elasticsearch/data
      healthcheck:
        interval: 10s
        retries: 24
        test:
          - CMD-SHELL
          - curl --user elastic:${PIER_PASSWORD_ELASTICSEARCH} --silent --fail http://localhost:9200/_cluster/health
        timeout: 10s
    kibana:
      image: kibana:9.1.2
      environment:
        - KIBANA_PASSWORD=${PIER_PASSWORD_KIBANA}
        - ELASTICSEARCH_SERVICEACCOUNTTOKEN=${ELASTICSEARCH_SERVICEACCOUNTTOKEN}
        - SERVER_NAME=${PIER_HOST_KIBANA}
        - SERVER_PUBLICBASEURL=${PIER_URL_KIBANA}
        - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
        - XPACK.SECURITY.ENABLED=true
        - XPACK_SECURITY_ENCRYPTIONKEY=${PIER_PASSWORD_XPACKSECURITY}
        - XPACK_REPORTING_ENCRYPTIONKEY=${PIER_PASSWORD_XPACKREPORTING}
        - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${PIER_PASSWORD_XPACKENCRYPTEDSAVEDOBJECTS}
        - TELEMETRY_OPTIN=${TELEMETRY_OPTIN:-false}
      volumes:
        - /etc/localtime:/etc/localtime:ro
        - kibana-data:/usr/share/kibana/data
      depends_on:
        elasticsearch:
          condition: service_healthy
      healthcheck:
        interval: 10s
        retries: 120
        test:
          - CMD-SHELL
          - curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'
        timeout: 10s
    kibana-token-generator:
      image: alpine:latest
      entrypoint:
        - sh
        - -c
        - |-
          apk add --no-cache curl jq >/dev/null 2>&1
          echo "Generating Kibana service token..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -u elastic:"$${ELASTIC_PASSWORD}" -X POST "http://elasticsearch:9200/_security/service/elastic/kibana/credential/token/kibana-service-token")
          HTTP_CODE=$$(echo "$${RESPONSE}" | tail -n1)
          BODY=$$(echo "$${RESPONSE}" | head -n -1)
          if [ "$${HTTP_CODE}" = "200" ]; then
            CREATED=$$(echo "$${BODY}" | jq -r '.created')
            if [ "$${CREATED}" = "true" ]; then
              TOKEN_VALUE=$$(echo "$${BODY}" | jq -r '.token.value')
              echo "Token created successfully:"
              echo "$${TOKEN_VALUE}"
            else
              echo "Unexpected response, token not created:"
              echo "$${BODY}"
            fi
          elif [ "$${HTTP_CODE}" = "409" ]; then
            echo "Token already exists. Skipping token creation."
          else
            echo "Failed to create token. HTTP code: $${HTTP_CODE}"
            echo "$${BODY}"
            exit 1
          fi
      restart: "no"
      environment:
        - ELASTIC_PASSWORD=${PIER_PASSWORD_ELASTICSEARCH}
      depends_on:
        elasticsearch:
          condition: service_healthy
  volumes:
    elasticsearch-data: null
    kibana-data: null
