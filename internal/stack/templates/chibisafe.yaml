name: Chibisafe
description: Cofre bonito e rápido para guardar seus arquivos.
category: Armazenamento
website: https://chibisafe.app/docs/intro
tags:
  - storage
  - file-sharing
  - upload
  - sharing
routes:
  - service: caddy
    port: 80
compose: |
  services:
    caddy:
      image: caddy:2-alpine
      volumes:
        - chibisafe-uploads:/app/uploads:ro
        - content: |
            # chibisafe/Caddyfile
            # https://chibisafe.moe/guides/running-with-docker
            :80 {
              route {
                file_server * {
                    root /app/uploads
                    pass_thru
                }
                @api path /api/*
                reverse_proxy @api http://chibisafe-server:8000 {
                    header_up Host {http.reverse_proxy.upstream.hostport}
                    header_up X-Real-IP {http.request.header.X-Real-IP}
                }
                @docs path /docs*
                reverse_proxy @docs http://chibisafe-server:8000 {
                    header_up Host {http.reverse_proxy.upstream.hostport}
                    header_up X-Real-IP {http.request.header.X-Real-IP}
                }
                reverse_proxy http://chibisafe:8001 {
                    header_up Host {http.reverse_proxy.upstream.hostport}
                    header_up X-Real-IP {http.request.header.X-Real-IP}
                }
              }
            }
          source: ./Caddyfile
          target: /etc/caddy/Caddyfile
          type: bind
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 10s
        test:
          - CMD
          - wget
          - --spider
          - --quiet
          - http://127.0.0.1:80
        timeout: 10s
    chibisafe:
      image: chibisafe/chibisafe:v6.5.5
      environment:
        - BASE_API_URL=http://chibisafe-server:8000
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 10s
        test:
          - CMD
          - wget
          - --spider
          - --quiet
          - http://127.0.0.1:8001
        timeout: 10s
    chibisafe-server:
      image: chibisafe/chibisafe-server:v6.5.5
      volumes:
        - chibisafe-database:/app/database:rw
        - chibisafe-uploads:/app/uploads:rw
        - chibisafe-logs:/app/logs:rw
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 10s
        test:
          - CMD
          - wget
          - --spider
          - --quiet
          - http://127.0.0.1:8000/api/health
        timeout: 10s
  volumes:
    chibisafe-database: null
    chibisafe-logs: null
    chibisafe-uploads: null
