name: Docker Registry
description: Registry para distribuir imagens Docker.
description_en: Registry to distribute Docker images.
category: Desenvolvimento
website: https://distribution.github.io/distribution/
services:
  registry:
    image: registry:3
    port: 5000
    command:
    - /entrypoint.sh
    volumes:
    - registry-data:/var/lib/registry
    - content: "#!/usr/bin/env sh\nset -e \n\nif [ -z \"$USERNAME\" ] || [ -z \"$PASSWORD\" ]; then\n    echo \"Error: USERNAME and PASSWORD environment variables must be set\"\n    exit 1\nfi\n\napk add --no-cache apache2-utils\nmkdir -p \"$(dirname \"$REGISTRY_AUTH_HTPASSWD_PATH\")\"\nchmod 755 \"$(dirname \"$REGISTRY_AUTH_HTPASSWD_PATH\")\"\nhtpasswd -Bbc \"$REGISTRY_AUTH_HTPASSWD_PATH\" \"$USERNAME\" \"$PASSWORD\"\nregistry serve /etc/docker/registry/config.yml\n"
      mode: '0755'
      source: ./etc/entrypoint.sh
      target: /entrypoint.sh
      type: bind
    - content: |-
        version: 0.1
        log:
          fields:
            service: registry
        storage:
          cache:
            blobdescriptor: inmemory
          filesystem:
            rootdirectory: /var/lib/registry
        http:
          addr: :5000
          headers:
            X-Content-Type-Options: [nosniff]
        health:
          storagedriver:
            enabled: true
            interval: 10s
            threshold: 3
      isDirectory: false
      source: ./config/config.yml
      target: /etc/docker/registry/config.yml
      type: bind
    env:
      USERNAME: ${PIER_USER_REGISTRY}
      PASSWORD: ${PIER_PASSWORD_REGISTRY}
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/registry.password
