name: Sure
description: Plataforma completa de finanças pessoais.
description_en: Complete personal finance platform.
category: Finanças
website: https://github.com/we-promise/sure
services:
  web:
    image: ghcr.io/we-promise/sure:0.6.7
    port: 3000
    data: /rails/storage
    env:
      APP_DOMAIN: $PIER_HOST_WEB
      SECRET_KEY_BASE: $PIER_PASSWORD_BASE
      POSTGRES_USER: '{{postgresql.user}}'
      POSTGRES_PASSWORD: '{{postgresql.password}}'
      POSTGRES_DB: '{{postgresql.database}}'
      REDIS_URL: redis://valkey:6379
      DB_HOST: postgresql
      DB_PORT: '5432'
      SELF_HOSTED: 'true'
      RAILS_FORCE_SSL: 'false'
      RAILS_ASSUME_SSL: 'false'
      ONBOARDING_STATE: ${ONBOARDING_STATE:-open}
  worker:
    image: ghcr.io/we-promise/sure:0.6.7
    data: /rails/storage
    command: bundle exec sidekiq
    env:
      APP_DOMAIN: $PIER_HOST_WEB
      SECRET_KEY_BASE: $PIER_PASSWORD_BASE
      POSTGRES_USER: '{{postgresql.user}}'
      POSTGRES_PASSWORD: '{{postgresql.password}}'
      POSTGRES_DB: '{{postgresql.database}}'
      REDIS_URL: redis://valkey:6379
      DB_HOST: postgresql
      DB_PORT: '5432'
      SELF_HOSTED: 'true'
      RAILS_FORCE_SSL: 'false'
      RAILS_ASSUME_SSL: 'false'
      ONBOARDING_STATE: ${ONBOARDING_STATE:-open}
with:
  postgresql:
    kind: postgres
    version: '16'
    database: sure
  valkey: {}
