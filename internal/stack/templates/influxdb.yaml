name: InfluxDB
description: Banco de séries temporais para métricas, eventos e análises.
category: Dados
website: https://docs.influxdata.com/influxdb/
tags:
  - influxdb
  - time series
  - metrics
  - iot
  - monitoring
  - telegraf
routes:
  - service: influxdb
    port: 8086
compose: |
  services:
    influxdb:
      image: influxdb:2.7-alpine
      environment:
        - INFLUXDB_HTTP_BIND_ADDRESS=:8086
        - INFLUXDB_INIT_MODE=setup
        - INFLUXDB_INIT_USERNAME=$PIER_USER_INFLUXDB
        - INFLUXDB_INIT_PASSWORD=$PIER_PASSWORD_INFLUXDB
        - INFLUXDB_INIT_ORG=$ORG_INFLUXDB
        - INFLUXDB_INIT_BUCKET=$BUCKET_INFLUXDB
        - INFLUXDB_INIT_RETENTION=0
        - INFLUXDB_INIT_ADMIN_TOKEN=$PIER_PASSWORD_INFLUXDB_TOKEN
      volumes:
        - influxdb-data:/var/lib/influxdb2
        - influxdb-config:/etc/influxdb2
      healthcheck:
        interval: 10s
        retries: 5
        start_period: 20s
        test:
          - CMD
          - influx
          - ping
          - --host
          - http://127.0.0.1:8086
        timeout: 5s
  volumes:
    influxdb-config: null
    influxdb-data: null
