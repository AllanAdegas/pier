name: Lobe Chat
description: Framework de chat de IA open source, de design moderno.
category: IA
website: https://github.com/lobehub/lobe-chat?tab=readme-ov-file#b-deploying-with-docker
tags:
  - ai
  - chat
  - openai
  - llm
  - chatbot
routes:
  - service: lobe-chat
    port: 3210
compose: |
  services:
    lobe-chat:
      image: lobehub/lobe-chat:1.135.5
      environment:
        - OPENAI_API_KEY=${OPENAI_API_KEY}
        - OPENAI_PROXY_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
        - ACCESS_CODE=${PIER_PASSWORD_ACCESSCODE}
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - wget -qO- http://localhost:3210/ || exit 1
        timeout: 20s
