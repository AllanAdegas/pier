name: EMQX Enterprise
description: Broker MQTT para IoT, IIoT e veículos conectados.
description_en: MQTT broker for IoT, IIoT and connected vehicles.
category: Rede
website: https://www.emqx.io/docs/en/latest/deploy/install-docker.html
services:
  emqx:
    image: emqx/emqx-enterprise:6.2.2
    port: 18083
    ports:
    - ${MQTT_BIND_IP:-127.0.0.1}:1883:1883
    - ${MQTT_BIND_IP:-127.0.0.1}:8083:8083
    - ${MQTT_BIND_IP:-127.0.0.1}:8084:8084
    - ${MQTT_BIND_IP:-127.0.0.1}:8883:8883
    volumes:
    - emqx_data:/opt/emqx/data
    - emqx_log:/opt/emqx/log
    env:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${PIER_PASSWORD_EMQX}
