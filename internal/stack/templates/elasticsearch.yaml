name: Elasticsearch
description: Motor de busca distribuído e RESTful.
description_en: Distributed, RESTful search engine.
category: Busca
website: https://www.elastic.co/products/elasticsearch
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:8.19.0
    port: 9200
    data: /usr/share/elasticsearch/data
    env:
      ELASTIC_PASSWORD: ${PIER_PASSWORD_ELASTICSEARCH}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      discovery.type: single-node
      bootstrap.memory_lock: 'true'
      xpack.security.http.ssl.enabled: 'false'
