name: Elasticsearch
description: Motor de busca distribuído e RESTful.
category: Busca
website: https://www.elastic.co/products/elasticsearch
tags:
  - search
  - engine
  - fulltext
  - full
  - text
  - elasticsearch
routes:
  - service: elasticsearch
    port: 9200
compose: |
  services:
    elasticsearch:
      image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:8.19.0
      environment:
        - ELASTIC_PASSWORD=${PIER_PASSWORD_ELASTICSEARCH}
        - ES_JAVA_OPTS=-Xms512m -Xmx512m
        - discovery.type=single-node
        - bootstrap.memory_lock=true
        - xpack.security.http.ssl.enabled=false
      volumes:
        - elasticsearch-data:/usr/share/elasticsearch/data
      healthcheck:
        interval: 10s
        retries: 24
        test:
          - CMD-SHELL
          - curl --user elastic:${PIER_PASSWORD_ELASTICSEARCH} --silent --fail http://localhost:9200/_cluster/health
        timeout: 10s
  volumes:
    elasticsearch-data: null
