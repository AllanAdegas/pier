name: Dolibarr
description: 'ERP e CRM: contatos, orçamentos, faturas, pedidos, estoque, agenda e mais.'
category: Produtividade
website: https://www.dolibarr.org/documentation-home.php
tags:
  - crm
  - erp
routes:
  - service: dolibarr
    port: 80
compose: |
  services:
    dolibarr:
      image: dolibarr/dolibarr:latest
      environment:
        - WWW_USER_ID=${WWW_USER_ID:-1000}
        - WWW_GROUP_ID=${WWW_GROUP_ID:-1000}
        - DOLI_DB_HOST=mariadb
        - DOLI_DB_NAME=${MYSQL_DATABASE:-dolibarr-db}
        - DOLI_DB_USER=${PIER_USER_MYSQL}
        - DOLI_DB_PASSWORD=${PIER_PASSWORD_MYSQL}
        - DOLI_URL_ROOT=${PIER_URL_DOLIBARR}
        - DOLI_ADMIN_LOGIN=${PIER_USER_DOLIBARR}
        - DOLI_ADMIN_PASSWORD=${PIER_PASSWORD_DOLIBARR}
        - DOLI_CRON=${DOLI_CRON:-0}
        - DOLI_INIT_DEMO=${DOLI_INIT_DEMO:-0}
        - DOLI_COMPANY_NAME=${DOLI_COMPANY_NAME:-MyBigCompany}
      volumes:
        - dolibarr_docs:/var/www/documents
        - dolibarr_custom:/var/www/html/custom
      healthcheck:
        interval: 2s
        retries: 15
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:80
        timeout: 10s
    mariadb:
      image: mariadb:latest
      environment:
        - MYSQL_DATABASE=${MYSQL_DATABASE:-dolibarr-db}
        - MYSQL_USER=${PIER_USER_MYSQL}
        - MYSQL_PASSWORD=${PIER_PASSWORD_MYSQL}
        - MYSQL_ROOT_PASSWORD=${PIER_PASSWORD_ROOT}
      volumes:
        - dolibarr_mariadb_data:/var/lib/mysql
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - healthcheck.sh
          - --connect
          - --innodb_initialized
        timeout: 20s
  volumes:
    dolibarr_custom: null
    dolibarr_docs: null
    dolibarr_mariadb_data: null
