name: Joplin Server
description: Servidor de sincronização do Joplin.
description_en: Joplin sync server.
category: Produtividade
website: https://github.com/laurent22/joplin/blob/dev/packages/server/README.md
services:
  joplin:
    image: joplin/server:3.7.4
    port: 22300
    env:
      APP_BASE_URL: ${PIER_URL_JOPLIN}
      DB_CLIENT: pg
      POSTGRES_PASSWORD: '{{postgres.password}}'
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: '{{postgres.user}}'
      POSTGRES_PORT: '5432'
      POSTGRES_HOST: postgres
with:
  postgres:
    version: '16'
    database: joplin
