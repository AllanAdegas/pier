name: Umami
description: Analytics de sites simples e respeitoso com a privacidade, com PostgreSQL dedicado.
description_en: Simple, privacy-respecting website analytics, with a dedicated PostgreSQL.
category: Analytics
website: https://umami.is
verified: true
services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.20.2
    port: 3000
    env:
      DATABASE_URL: '{{db.url}}'
      DATABASE_TYPE: postgresql
      APP_SECRET: ${PIER_SECRET_APP}
with:
  db:
    kind: postgres
    user: umami
    database: umami
