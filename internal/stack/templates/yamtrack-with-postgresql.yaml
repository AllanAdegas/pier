name: Yamtrack com PostgreSQL
description: Acompanhe filmes, séries, animes, mangás, jogos e livros.
description_en: Track movies, series, anime, manga, games and books.
category: Produtividade
website: https://github.com/FuzzyGrim/Yamtrack/wiki
services:
  yamtrack:
    image: ghcr.io/fuzzygrim/yamtrack:0.26.3
    port: 8000
    env:
      URLS: ${PIER_URL_YAMTRACK}
      TZ: ${TZ:-Europe/Berlin}
      SECRET: ${PIER_PASSWORD_SECRET}
      REGISTRATION: ${REGISTRATION_ENABLED:-true}
      REDIS_URL: redis://redis:6379
      DB_HOST: postgres
      DB_NAME: '{{postgres.database}}'
      DB_USER: '{{postgres.user}}'
      DB_PASSWORD: '{{postgres.password}}'
      DB_PORT: '5432'
with:
  postgres:
    version: '16'
    database: yamtrack-db
  redis: {}
