name: BookStack
description: Plataforma simples para organizar e guardar informação.
category: CMS
website: https://www.bookstackapp.com/docs/
tags:
  - free-and-open-source
  - mfa
  - dark-light-themes
  - searchable
  - connected
  - simple-interface
  - diagramms
  - notes
routes:
  - service: bookstack
    port: 80
compose: |
  services:
    bookstack:
      image: lscr.io/linuxserver/bookstack:latest
      environment:
        - APP_URL=${PIER_URL_BOOKSTACK}
        - APP_KEY=${PIER_PASSWORD_APPKEY}
        - PUID=1000
        - PGID=1000
        - TZ=${TZ:-Europe/Berlin}
        - DB_HOST=mariadb
        - DB_PORT=3306
        - DB_USERNAME=${PIER_USER_MYSQL}
        - DB_PASSWORD=${PIER_PASSWORD_MYSQL}
        - DB_DATABASE=${MYSQL_DATABASE:-bookstackapp}
        - QUEUE_CONNECTION=${QUEUE_CONNECTION}
        - GITHUB_APP_ID=${GITHUB_APP_ID}
        - GITHUB_APP_SECRET=${GITHUB_APP_SECRET}
        - MAIL_DRIVER=${MAIL_DRIVER:-smtp}
        - MAIL_HOST=${MAIL_HOST}
        - MAIL_PORT=${MAIL_PORT:-587}
        - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
        - MAIL_USERNAME=${MAIL_USERNAME}
        - MAIL_PASSWORD=${MAIL_PASSWORD}
        - MAIL_FROM=${MAIL_FROM}
        - MAIL_FROM_NAME=${MAIL_FROM_NAME:-BookStack}
      volumes:
        - bookstack-data:/config
      depends_on:
        mariadb:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - curl -f http://127.0.0.1:80/
        timeout: 20s
    mariadb:
      image: lscr.io/linuxserver/mariadb:latest
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=${TZ:-Europe/Berlin}
        - MYSQL_ROOT_PASSWORD=${PIER_PASSWORD_MYSQLROOT}
        - MYSQL_DATABASE=${MYSQL_DATABASE:-bookstack}
        - MYSQL_USER=${PIER_USER_MYSQL}
        - MYSQL_PASSWORD=${PIER_PASSWORD_MYSQL}
      volumes:
        - bookstack-mariadb-data:/config
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - mysqladmin
          - ping
          - -h
          - 127.0.0.1
        timeout: 20s
  volumes:
    bookstack-data: null
    bookstack-mariadb-data: null
