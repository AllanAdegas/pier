name: Plane
description: Gestão de projetos open source.
description_en: Open source project management.
category: Produtividade
website: https://docs.plane.so/self-hosting/methods/docker-compose
services:
  admin:
    image: makeplane/plane-admin:${APP_RELEASE:-v1.3.0}
    needs:
    - api
    - web
  api:
    image: makeplane/plane-backend:${APP_RELEASE:-v1.3.0}
    data: /code/plane/logs
    command: ./bin/docker-entrypoint-api.sh
    env:
      AMQP_URL: amqp://${PIER_USER_RABBITMQ}:${PIER_PASSWORD_RABBITMQ}@plane-mq:${RABBITMQ_PORT:-5672}/plane
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
      APP_DOMAIN: ${PIER_URL_PROXY}
      APP_RELEASE: ${APP_RELEASE:-v1.3.0}
      AWS_ACCESS_KEY_ID: $PIER_USER_MINIO
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
      AWS_SECRET_ACCESS_KEY: $PIER_PASSWORD_MINIO
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      DATABASE_URL: postgresql://{{plane-db.user}}:{{plane-db.password}}@plane-db/plane
      DEBUG: ${DEBUG:-0}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      LIVE_SERVER_SECRET_KEY: $PIER_PASSWORD_64_LIVESECRET
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
      MINIO_ROOT_PASSWORD: $PIER_PASSWORD_MINIO
      MINIO_ROOT_USER: $PIER_USER_MINIO
      PGDATA: /var/lib/postgresql/data
      PGDATABASE: plane
      PGHOST: plane-db
      POSTGRES_DB: plane
      POSTGRES_PASSWORD: '{{plane-db.password}}'
      POSTGRES_PORT: '5432'
      POSTGRES_USER: '{{plane-db.user}}'
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      SECRET_KEY: $PIER_PASSWORD_64_SECRETKEY
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      USE_MINIO: ${USE_MINIO:-1}
      WEB_URL: ${PIER_URL_PROXY}
    needs:
    - plane-mq
    - plane-db
    - plane-redis
  beat-worker:
    image: makeplane/plane-backend:${APP_RELEASE:-v1.3.0}
    data: /code/plane/logs
    command: ./bin/docker-entrypoint-beat.sh
    env:
      AMQP_URL: amqp://${PIER_USER_RABBITMQ}:${PIER_PASSWORD_RABBITMQ}@plane-mq:${RABBITMQ_PORT:-5672}/plane
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
      APP_DOMAIN: ${PIER_URL_PROXY}
      APP_RELEASE: ${APP_RELEASE:-v1.3.0}
      AWS_ACCESS_KEY_ID: $PIER_USER_MINIO
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
      AWS_SECRET_ACCESS_KEY: $PIER_PASSWORD_MINIO
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      DATABASE_URL: postgresql://{{plane-db.user}}:{{plane-db.password}}@plane-db/plane
      DEBUG: ${DEBUG:-0}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      LIVE_SERVER_SECRET_KEY: $PIER_PASSWORD_64_LIVESECRET
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
      MINIO_ROOT_PASSWORD: $PIER_PASSWORD_MINIO
      MINIO_ROOT_USER: $PIER_USER_MINIO
      PGDATA: /var/lib/postgresql/data
      PGDATABASE: plane
      PGHOST: plane-db
      POSTGRES_DB: plane
      POSTGRES_PASSWORD: '{{plane-db.password}}'
      POSTGRES_PORT: '5432'
      POSTGRES_USER: '{{plane-db.user}}'
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      SECRET_KEY: $PIER_PASSWORD_64_SECRETKEY
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      USE_MINIO: ${USE_MINIO:-1}
      WEB_URL: ${PIER_URL_PROXY}
    needs:
    - api
    - plane-mq
    - plane-db
    - plane-redis
  live:
    image: makeplane/plane-live:${APP_RELEASE:-v1.3.0}
    env:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      LIVE_SERVER_SECRET_KEY: $PIER_PASSWORD_64_LIVESECRET
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
    needs:
    - api
    - web
  migrator:
    image: makeplane/plane-backend:${APP_RELEASE:-v1.3.0}
    data: /code/plane/logs
    command: ./bin/docker-entrypoint-migrator.sh
    restart: 'no'
    env:
      AMQP_URL: amqp://${PIER_USER_RABBITMQ}:${PIER_PASSWORD_RABBITMQ}@plane-mq:${RABBITMQ_PORT:-5672}/plane
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
      APP_DOMAIN: ${PIER_URL_PROXY}
      APP_RELEASE: ${APP_RELEASE:-v1.3.0}
      AWS_ACCESS_KEY_ID: $PIER_USER_MINIO
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
      AWS_SECRET_ACCESS_KEY: $PIER_PASSWORD_MINIO
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      DATABASE_URL: postgresql://{{plane-db.user}}:{{plane-db.password}}@plane-db/plane
      DEBUG: ${DEBUG:-0}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      LIVE_SERVER_SECRET_KEY: $PIER_PASSWORD_64_LIVESECRET
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
      MINIO_ROOT_PASSWORD: $PIER_PASSWORD_MINIO
      MINIO_ROOT_USER: $PIER_USER_MINIO
      PGDATA: /var/lib/postgresql/data
      PGDATABASE: plane
      PGHOST: plane-db
      POSTGRES_DB: plane
      POSTGRES_PASSWORD: '{{plane-db.password}}'
      POSTGRES_PORT: '5432'
      POSTGRES_USER: '{{plane-db.user}}'
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      SECRET_KEY: $PIER_PASSWORD_64_SECRETKEY
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      USE_MINIO: ${USE_MINIO:-1}
      WEB_URL: ${PIER_URL_PROXY}
  plane-minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    data: /export
    command: server /export --console-address ":9090"
    env:
      MINIO_ROOT_PASSWORD: $PIER_PASSWORD_MINIO
      MINIO_ROOT_USER: $PIER_USER_MINIO
  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    data: /var/lib/rabbitmq
    env:
      RABBITMQ_DEFAULT_PASS: ${PIER_PASSWORD_RABBITMQ}
      RABBITMQ_DEFAULT_USER: ${PIER_USER_RABBITMQ:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}
  proxy:
    image: makeplane/plane-proxy:${APP_RELEASE:-v1.3.0}
    port: 80
    volumes:
    - proxy_config:/config
    - proxy_data:/data
    env:
      APP_DOMAIN: ${PIER_URL_PROXY}
      SITE_ADDRESS: :80
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    needs:
    - web
    - api
    - space
    - admin
    - live
  space:
    image: makeplane/plane-space:${APP_RELEASE:-v1.3.0}
    needs:
    - api
    - worker
    - web
  web:
    image: makeplane/plane-frontend:${APP_RELEASE:-v1.3.0}
    needs:
    - api
    - worker
  worker:
    image: makeplane/plane-backend:${APP_RELEASE:-v1.3.0}
    data: /code/plane/logs
    command: ./bin/docker-entrypoint-worker.sh
    env:
      AMQP_URL: amqp://${PIER_USER_RABBITMQ}:${PIER_PASSWORD_RABBITMQ}@plane-mq:${RABBITMQ_PORT:-5672}/plane
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
      APP_DOMAIN: ${PIER_URL_PROXY}
      APP_RELEASE: ${APP_RELEASE:-v1.3.0}
      AWS_ACCESS_KEY_ID: $PIER_USER_MINIO
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
      AWS_SECRET_ACCESS_KEY: $PIER_PASSWORD_MINIO
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      DATABASE_URL: postgresql://{{plane-db.user}}:{{plane-db.password}}@plane-db/plane
      DEBUG: ${DEBUG:-0}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      LIVE_SERVER_SECRET_KEY: $PIER_PASSWORD_64_LIVESECRET
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
      MINIO_ROOT_PASSWORD: $PIER_PASSWORD_MINIO
      MINIO_ROOT_USER: $PIER_USER_MINIO
      PGDATA: /var/lib/postgresql/data
      PGDATABASE: plane
      PGHOST: plane-db
      POSTGRES_DB: plane
      POSTGRES_PASSWORD: '{{plane-db.password}}'
      POSTGRES_PORT: '5432'
      POSTGRES_USER: '{{plane-db.user}}'
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      SECRET_KEY: $PIER_PASSWORD_64_SECRETKEY
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      USE_MINIO: ${USE_MINIO:-1}
      WEB_URL: ${PIER_URL_PROXY}
    needs:
    - api
    - plane-mq
    - plane-db
    - plane-redis
with:
  plane-db:
    kind: postgres
    version: '15'
    args:
    - -c
    - max_connections=1000
    env:
      PGHOST: plane-db
    database: plane
  plane-redis:
    kind: valkey
