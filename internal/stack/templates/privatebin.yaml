name: PrivateBin
description: Pastebin minimalista em que o servidor não conhece o conteúdo.
category: Segurança
website: https://github.com/PrivateBin/PrivateBin/blob/master/doc/README.md
tags:
  - text
  - sharing
routes:
  - service: privatebin
    port: 8080
compose: |
  services:
    privatebin:
      image: privatebin/nginx-fpm-alpine
      volumes:
        - privatebin_data:/srv/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - wget -qO- http://127.0.0.1:8080/
        timeout: 20s
  volumes:
    privatebin_data: null
