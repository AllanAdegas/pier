name: Pterodactyl com Wings
description: Painel open source de gestão de servidores de jogos, com o Wings.
description_en: Open source game server management panel, with Wings.
category: Mídia
website: https://pterodactyl.io/
services:
  wings-init:
    image: busybox:1.37.0
    restart: 'no'
    volumes:
    - wings-config:/config
    env:
      WINGS_CONFIG: ${WINGS_CONFIG:?}
    entrypoint:
    - sh
    - -ec
    - |
      case "$$WINGS_CONFIG" in *ReplaceConfig*|*'REPLACE FROM CONFIG'*) exit 1;; esac
      umask 077
      printf '%s\n' "$$WINGS_CONFIG" > /config/config.yml
  pterodactyl:
    image: ghcr.io/pterodactyl/panel:v1.12.3
    port: 80
    command:
    - /entrypoint.sh
    volumes:
    - panel-var:/app/var/
    - panel-nginx:/etc/nginx/http.d/
    - panel-certs:/etc/letsencrypt/
    - wings-config:/etc/pterodactyl:ro
    env:
      HASHIDS_SALT: $PIER_PASSWORD_HASHIDS
      HASHIDS_LENGTH: '8'
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_USERNAME: ${PIER_USER_ADMIN}
      ADMIN_FIRSTNAME: ${ADMIN_FIRSTNAME:-Admin}
      ADMIN_LASTNAME: ${ADMIN_LASTNAME:-User}
      ADMIN_PASSWORD: ${PIER_PASSWORD_ADMIN}
      PTERODACTYL_HTTPS: ${PTERODACTYL_HTTPS:-false}
      APP_ENV: production
      APP_ENVIRONMENT_ONLY: 'false'
      APP_URL: $PIER_URL_PTERODACTYL
      APP_TIMEZONE: ${TIMEZONE:-UTC}
      APP_SERVICE_AUTHOR: ${APP_SERVICE_AUTHOR:-author@example.com}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      REDIS_HOST: redis
      DB_DATABASE: pterodactyl-db
      DB_USERNAME: '{{mariadb.user}}'
      DB_HOST: mariadb
      DB_PORT: '3306'
      DB_PASSWORD: '{{mariadb.password}}'
      MAIL_FROM: $MAIL_FROM
      MAIL_DRIVER: $MAIL_DRIVER
      MAIL_HOST: $MAIL_HOST
      MAIL_PORT: $MAIL_PORT
      MAIL_USERNAME: $MAIL_USERNAME
      MAIL_PASSWORD: $MAIL_PASSWORD
      MAIL_ENCRYPTION: $MAIL_ENCRYPTION
  wings:
    depends_on:
      wings-init:
        condition: service_completed_successfully
    image: ghcr.io/pterodactyl/wings:v1.12.1
    port: 8443
    ports:
    - 2022:2022
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /var/lib/docker/containers/:/var/lib/docker/containers/
    - /var/lib/pterodactyl/:/var/lib/pterodactyl/
    - /tmp/pterodactyl/:/tmp/pterodactyl/
    - wings-logs:/var/log/pterodactyl/
    - content: |-
        debug: false
        uuid: ${WINGS_UUID:?}
        token_id: ${WINGS_TOKEN_ID:?}
        token: ${WINGS_TOKEN:?}
        api:
          host: 0.0.0.0
          port: 8443 # use port 443 IN THE PANEL during node setup
          ssl:
            enabled: false
            cert: REPLACE FROM CONFIG #example: /etc/letsencrypt/live/wings-abcabcabcabcabc.example.com/fullchain.pem
            key: REPLACE FROM CONFIG #example: /etc/letsencrypt/live/wings-abcabcabcabcabc.example.com/privkey.pem
          disable_remote_download: false
          upload_limit: 100
          trusted_proxies: []
        system:
          root_directory: /var/lib/pterodactyl
          log_directory: /var/log/pterodactyl
          data: /var/lib/pterodactyl/volumes
          archive_directory: /var/lib/pterodactyl/archives
          backup_directory: /var/lib/pterodactyl/backups
          tmp_directory: /tmp/pterodactyl
          username: pterodactyl
          timezone: UTC
          user:
            rootless:
              enabled: false
              container_uid: 0
              container_gid: 0
            uid: 988
            gid: 988
          disk_check_interval: 150
          activity_send_interval: 60
          activity_send_count: 100
          check_permissions_on_boot: true
          enable_log_rotate: true
          websocket_log_count: 150
          sftp:
            bind_address: 0.0.0.0
            bind_port: 2022
            read_only: false
          crash_detection:
            enabled: true
            detect_clean_exit_as_crash: true
            timeout: 60
          backups:
            write_limit: 0
            compression_level: best_speed
          transfers:
            download_limit: 0
          openat_mode: auto
        docker:
          network:
            interface: 172.28.0.1
            dns:
              - 1.1.1.1
              - 1.0.0.1
            name: pterodactyl_nw
            ispn: false
            driver: bridge
            network_mode: pterodactyl_nw
            is_internal: false
            enable_icc: true
            network_mtu: 1500
            interfaces:
              v4:
                subnet: 172.28.0.0/16
                gateway: 172.28.0.1
              v6:
                subnet: fdba:17c8:6c94::/64
                gateway: fdba:17c8:6c94::1011
          domainname: ""
          registries: {}
          tmpfs_size: 100
          container_pid_limit: 512
          installer_limits:
            memory: 1024
            cpu: 100
          overhead:
            override: false
            default_multiplier: 1.05
            multipliers: {}
          use_performant_inspect: true
          userns_mode: ""
          log_config:
            type: local
            config:
              compress: "false"
              max-file: "1"
              max-size: 5m
              mode: non-blocking
        throttles:
          enabled: true
          lines: 2000
          line_reset_interval: 100
        remote: http://pterodactyl:80
        remote_query:
          timeout: 30
          boot_servers_per_page: 50
        allowed_mounts: []
        allowed_origins:
          - http://pterodactyl:80
          - PANEL DOMAIN # example: https://pterodactyl-abcabcabcabcavc.example.com
        allow_cors_private_network: false
        ignore_panel_config_updates: false
      source: ./etc/config.yml
      target: /etc/pterodactyl/config.yml
      type: bind
    env:
      TZ: ${TIMEZONE:-UTC}
      WINGS_USERNAME: pterodactyl
with:
  mariadb:
    version: '11.8'
    database: pterodactyl-db
  redis: {}
