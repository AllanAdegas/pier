name: Stalwart
description: Servidor de e-mail moderno.
description_en: Modern email server.
category: E-mail
website: https://stalw.art/docs/
services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16.13
    port: 8080
    ports:
    - '25:25'
    - 465:465
    - 587:587
    - 993:993
    - 995:995
    - 143:143
    - 110:110
    - 4190:4190
    expose:
    - '8080'
    volumes:
    - stalwart-mail:/etc/stalwart
    - stalwart-data:/var/lib/stalwart
    - /etc/localtime:/etc/localtime:ro
