name: Chaskiq
description: Plataforma de mensagens para marketing, suporte e vendas.
description_en: Messaging platform for marketing, support and sales.
category: Atendimento
website: https://chaskiq.io
services:
  chaskiq:
    image: chaskiq/chaskiq:2.0.2
    port: 3000
    entrypoint:
    - /entrypoint.sh
    volumes:
    - chaskiq-storage:/data/storage
    - content: |
        #!/bin/sh
        set -e
        rm -f /usr/src/app/tmp/pids/server.pid
        exec "$@"
        echo "Running database migrations..."
        bundle exec rails db:setup || true
        bundle exec rails db:migrate
        echo "Finished running database migrations."
        echo "Running packages update..."
        bundle exec rails packages:update
        echo "Finished packages update."
        if [ ! -f /usr/src/app/admin_generated ]; then
            echo "/usr/src/app/admin_generated not found, executing admin generation.."
            bundle exec rake admin_generator
            touch /usr/src/app/admin_generated
            echo "Admin generation finished !"
        fi
        bundle exec rails s -b 0.0.0.0 -p 3000
      source: ./entrypoint.sh
      target: /entrypoint.sh
      type: bind
    env:
      REDIS_URL: redis://redis:6379/
      DATABASE_URL: postgres://{{postgresql.user}}:{{postgresql.password}}@postgresql:5432/{{postgresql.database}}
      POSTGRES_USER: '{{postgresql.user}}'
      SERVICE_URL: ${PIER_URL_CHASKIQ}
      HOST: ${PIER_URL_CHASKIQ}
      ASSET_HOST: ${PIER_URL_CHASKIQ}
      WS: wss://${PIER_HOST_CHASKIQ}/cable
      SNS_CONFIGURATION_SET: metrics
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example}
      ADMIN_PASSWORD: ${PIER_PASSWORD_ADMIN}
      DEFAULT_SENDER_EMAIL: ${DEFAULT_SENDER_EMAIL:-admin@example}
      LOCAL_STORAGE_PATH: /data/storage
      ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-local}
      SMTP_DELIVERY_METHOD: ${SMTP_DELIVERY_METHOD:-}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CHASKIQ_APPSTORE_TOKEN: ${CHASKIQ_APPSTORE_TOKEN:-}
      APP_ENV: production
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_SERVE_STATIC_FILES: 'true'
      SECRET_KEY_BASE: $PIER_PASSWORD_64_SECRET
      RAILS_LOG_TO_STDOUT: 'true'
      ENABLED_AUDITS: 'true'
      TZ: Europe/Madrid
    health: curl:/
  sidekiq:
    image: chaskiq/chaskiq:2.0.2
    data: /data/storage
    command:
    - bundle
    - exec
    - sidekiq
    - -C
    - config/sidekiq.yml
    env:
      REDIS_URL: redis://redis:6379/
      DATABASE_URL: postgres://{{postgresql.user}}:{{postgresql.password}}@postgresql:5432/{{postgresql.database}}
      POSTGRES_USER: '{{postgresql.user}}'
      HOST: ${PIER_URL_CHASKIQ}
      ASSET_HOST: ${PIER_URL_CHASKIQ}
      WS: wss://${PIER_HOST_CHASKIQ}/cable
      SNS_CONFIGURATION_SET: metrics
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example}
      ADMIN_PASSWORD: ${PIER_PASSWORD_ADMIN}
      DEFAULT_SENDER_EMAIL: ${DEFAULT_SENDER_EMAIL:-admin@example}
      LOCAL_STORAGE_PATH: /data/storage
      ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-local}
      SMTP_DELIVERY_METHOD: ${SMTP_DELIVERY_METHOD:-}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CHASKIQ_APPSTORE_TOKEN: ${CHASKIQ_APPSTORE_TOKEN:-}
      APP_ENV: production
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_SERVE_STATIC_FILES: 'true'
      SECRET_KEY_BASE: $PIER_PASSWORD_64_SECRET
      RAILS_LOG_TO_STDOUT: 'true'
      ENABLED_AUDITS: 'true'
      TZ: Europe/Madrid
    depends_on:
      chaskiq:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
with:
  postgresql:
    kind: postgres
    version: '14'
    env:
      POSTGRES_INITDB_ARGS: ' --data-checksums'
      PSQL_HISTFILE: /root/log/.psql_history
    database: chaskiq
  redis: {}
