name: Chaskiq
description: Plataforma de mensagens para marketing, suporte e vendas.
category: Atendimento
website: https://chaskiq.io
tags:
  - chaskiq
  - messaging
  - chat
  - marketing
  - support
  - sales
  - rails
  - redis
routes:
  - service: chaskiq
    port: 3000
compose: |
  services:
    chaskiq:
      image: chaskiq/chaskiq:latest
      entrypoint:
        - /entrypoint.sh
      environment:
        - REDIS_URL=redis://redis:6379/
        - DATABASE_URL=postgres://$PIER_USER_POSTGRES:$PIER_PASSWORD_POSTGRES@postgresql:5432/${POSTGRES_DB:-chaskiq}
        - POSTGRES_USER=$PIER_USER_POSTGRES
        - SERVICE_URL=${PIER_URL_CHASKIQ}
        - HOST=${PIER_URL_CHASKIQ}
        - ASSET_HOST=${PIER_URL_CHASKIQ}
        - WS=wss://${PIER_HOST_CHASKIQ}/cable
        - SNS_CONFIGURATION_SET=metrics
        - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
        - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
        - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
        - AWS_S3_REGION=${AWS_S3_REGION:-}
        - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example}
        - ADMIN_PASSWORD=${PIER_PASSWORD_ADMIN}
        - DEFAULT_SENDER_EMAIL=${DEFAULT_SENDER_EMAIL:-admin@example}
        - LOCAL_STORAGE_PATH=/data/storage
        - ACTIVE_STORAGE_SERVICE=${ACTIVE_STORAGE_SERVICE:-local}
        - SMTP_DELIVERY_METHOD=${SMTP_DELIVERY_METHOD:-}
        - SMTP_ADDRESS=${SMTP_ADDRESS:-}
        - SMTP_USERNAME=${SMTP_USERNAME:-}
        - SMTP_PASSWORD=${SMTP_PASSWORD:-}
        - CHASKIQ_APPSTORE_TOKEN=${CHASKIQ_APPSTORE_TOKEN:-}
        - APP_ENV=production
        - RAILS_ENV=production
        - RACK_ENV=production
        - RAILS_SERVE_STATIC_FILES=true
        - SECRET_KEY_BASE=$PIER_PASSWORD_64_SECRET
        - RAILS_LOG_TO_STDOUT=true
        - ENABLED_AUDITS=true
        - TZ=Europe/Madrid
      volumes:
        - chaskiq-storage:/data/storage
        - content: |
            #!/bin/sh
            set -e
            rm -f /usr/src/app/tmp/pids/server.pid
            exec "$@"
            echo "Running database migrations..."
            bundle exec rails db:setup || true
            bundle exec rails db:migrate
            echo "Finished running database migrations."
            echo "Running packages update..."
            bundle exec rails packages:update
            echo "Finished packages update."
            if [ ! -f /usr/src/app/admin_generated ]; then
                echo "/usr/src/app/admin_generated not found, executing admin generation.."
                bundle exec rake admin_generator
                touch /usr/src/app/admin_generated
                echo "Admin generation finished !"
            fi
            bundle exec rails s -b 0.0.0.0 -p 3000
          source: ./entrypoint.sh
          target: /entrypoint.sh
          type: bind
      depends_on:
        postgresql:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 15
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:3000
        timeout: 20s
    postgresql:
      image: postgres:14-alpine
      environment:
        - POSTGRES_USER=$PIER_USER_POSTGRES
        - POSTGRES_PASSWORD=$PIER_PASSWORD_POSTGRES
        - POSTGRES_DB=${POSTGRES_DB:-chaskiq}
        - POSTGRES_INITDB_ARGS= --data-checksums
        - PSQL_HISTFILE=/root/log/.psql_history
      volumes:
        - postgresql-data:/var/lib/postgresql/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 5s
    redis:
      image: redis:6-alpine
      restart: always
      volumes:
        - redis-data:/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - redis-cli
          - ping
        timeout: 5s
    sidekiq:
      image: chaskiq/chaskiq:latest
      command:
        - bundle
        - exec
        - sidekiq
        - -C
        - config/sidekiq.yml
      environment:
        - REDIS_URL=redis://redis:6379/
        - DATABASE_URL=postgres://$PIER_USER_POSTGRES:$PIER_PASSWORD_POSTGRES@postgresql:5432/${POSTGRES_DB:-chaskiq}
        - POSTGRES_USER=$PIER_USER_POSTGRES
        - HOST=${PIER_URL_CHASKIQ}
        - ASSET_HOST=${PIER_URL_CHASKIQ}
        - WS=wss://${PIER_HOST_CHASKIQ}/cable
        - SNS_CONFIGURATION_SET=metrics
        - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
        - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
        - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
        - AWS_S3_REGION=${AWS_S3_REGION:-}
        - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example}
        - ADMIN_PASSWORD=${PIER_PASSWORD_ADMIN}
        - DEFAULT_SENDER_EMAIL=${DEFAULT_SENDER_EMAIL:-admin@example}
        - LOCAL_STORAGE_PATH=/data/storage
        - ACTIVE_STORAGE_SERVICE=${ACTIVE_STORAGE_SERVICE:-local}
        - SMTP_DELIVERY_METHOD=${SMTP_DELIVERY_METHOD:-}
        - SMTP_ADDRESS=${SMTP_ADDRESS:-}
        - SMTP_USERNAME=${SMTP_USERNAME:-}
        - SMTP_PASSWORD=${SMTP_PASSWORD:-}
        - CHASKIQ_APPSTORE_TOKEN=${CHASKIQ_APPSTORE_TOKEN:-}
        - APP_ENV=production
        - RAILS_ENV=production
        - RACK_ENV=production
        - RAILS_SERVE_STATIC_FILES=true
        - SECRET_KEY_BASE=$PIER_PASSWORD_64_SECRET
        - RAILS_LOG_TO_STDOUT=true
        - ENABLED_AUDITS=true
        - TZ=Europe/Madrid
      volumes:
        - chaskiq-storage:/data/storage
      depends_on:
        chaskiq:
          condition: service_healthy
        postgresql:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 15
        test:
          - CMD-SHELL
          - bundle exec rails runner 'puts Sidekiq.redis(&:info)' > /dev/null 2>&1
        timeout: 10s
  volumes:
    chaskiq-storage: null
    postgresql-data: null
    redis-data: null
