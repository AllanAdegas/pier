name: Paymenter
description: Cobrança open source, feita para hospedagem.
description_en: Open source billing, built for hosting.
category: Finanças
website: https://paymenter.org/docs/guides/docker
services:
  paymenter:
    image: ghcr.io/paymenter/paymenter:v1.4.5
    volumes:
    - app_logs:/app/storage/logs
    - extenstions:/app/extensions
    - themes:/app/themes
    - app_storage:/app/storage/app
    - app_public_storage:/app/storage/app/public
    env:
      APP_ENV: production
      APP_KEY: ${PIER_PASSWORD_KEY}
      CACHE_STORE: redis
      DB_CONNECTION: mariadb
      DB_DATABASE: '{{mariadb.database}}'
      DB_HOST: mariadb
      DB_PASSWORD: '{{mariadb.password}}'
      DB_PORT: '3306'
      DB_USERNAME: '{{mariadb.user}}'
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${PIER_PASSWORD_64_REDIS}
      REDIS_USERNAME: default
      PIER_URL_PAYMENTER: ${PIER_URL_PAYMENTER}
      SESSION_DRIVER: redis
with:
  mariadb:
    version: '11.8'
    database: paymenter-db
  redis: {}
