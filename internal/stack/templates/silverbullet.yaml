name: SilverBullet
description: Organize e estruture o seu conhecimento pessoal, em todos os dispositivos.
description_en: Organize and structure your personal knowledge, on every device.
category: Produtividade
website: https://v2.silverbullet.md/Install/Configuration
services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:v2
    port: 3000
    data: /space
    env:
      SB_USER: ${PIER_USER_SILVERBULLET}:${PIER_PASSWORD_SILVERBULLET}
