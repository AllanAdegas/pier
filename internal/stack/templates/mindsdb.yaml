auth: none
name: MindsDB
description: Plataforma para construir IA a partir dos dados da empresa.
description_en: Platform to build AI from company data.
category: IA
website: https://docs.mindsdb.com/what-is-mindsdb
services:
  mindsdb:
    image: mindsdb/mindsdb:v26.1.0
    private: true
    port: 47335
    path: /api
    data: /mindsdb/var
    env:
      MINDSDB_DOCKER_ENV: 'true'
      MINDSDB_STORAGE_DIR: /mindsdb/var
      FLASK_DEBUG: '0'
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-local}
      LANGFUSE_DEBUG: ${LANGFUSE_DEBUG:-False}
      LANGFUSE_TIMEOUT: ${LANGFUSE_TIMEOUT:-10}
      LANGFUSE_SAMPLE_RATE: ${LANGFUSE_SAMPLE_RATE:-1.0}
      MINDSDB_DB_CON: postgresql://{{postgresql.user}}:{{postgresql.password}}@postgresql/{{postgresql.database}}
with:
  postgresql:
    kind: postgres
    version: '16'
    database: mindsdb-db
