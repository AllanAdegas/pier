name: OpenPanel
description: Alternativa open source ao Mixpanel e ao Plausible para analytics de produto.
category: Analytics
website: https://openpanel.dev/docs
tags:
  - analytics
  - insights
  - privacy
  - mixpanel
  - plausible
  - google
  - alternative
routes:
  - service: openpanel-api
    port: 3000
  - service: openpanel-dashboard
    port: 3000
  - service: openpanel-worker
    port: 3000
compose: |
  services:
    clickhouse:
      image: clickhouse/clickhouse-server:25.10.2.65
      environment:
        - CLICKHOUSE_SKIP_USER_SETUP=1
      volumes:
        - openpanel_clickhouse_data:/var/lib/clickhouse
        - openpanel_clickhouse_logs:/var/log/clickhouse-server
        - content: |-
            <clickhouse>
                <logger>
                    <level>warning</level>
                    <console>true</console>
                </logger>
                <keep_alive_timeout>10</keep_alive_timeout>
                <!-- Stop all the unnecessary logging -->
                <query_thread_log remove="remove"/>
                <query_log remove="remove"/>
                <text_log remove="remove"/>
                <trace_log remove="remove"/>
                <metric_log remove="remove"/>
                <asynchronous_metric_log remove="remove"/>
                <session_log remove="remove"/>
                <part_log remove="remove"/>
                <listen_host>0.0.0.0</listen_host>
                <interserver_listen_host>0.0.0.0</interserver_listen_host>
                <interserver_http_host>opch</interserver_http_host>
                <!-- Disable cgroup memory observer -->
                <cgroups_memory_usage_observer_wait_time>0</cgroups_memory_usage_observer_wait_time>
                <!-- Not used anymore, but kept for backwards compatibility -->
                <macros>
                    <shard>1</shard>
                    <replica>replica1</replica>
                    <cluster>openpanel_cluster</cluster>
                </macros>
            </clickhouse>
          read_only: true
          source: ./clickhouse-config.xml
          target: /etc/clickhouse-server/config.d/op-config.xml
          type: bind
        - content: |
            <clickhouse>
                <profiles>
                    <default>
                        <log_queries>0</log_queries>
                        <log_query_threads>0</log_query_threads>
                    </default>
                </profiles>
            </clickhouse>
          read_only: true
          source: ./clickhouse-user-config.xml
          target: /etc/clickhouse-server/users.d/op-user-config.xml
          type: bind
        - content: |-
            #!/bin/sh
            set -e

            clickhouse client -n <<-EOSQL
              CREATE DATABASE IF NOT EXISTS openpanel;
            EOSQL
          source: ./init-db.sh
          target: /docker-entrypoint-initdb.d/init-db.sh
          type: bind
      healthcheck:
        interval: 10s
        retries: 5
        test:
          - CMD-SHELL
          - clickhouse-client --query "SELECT 1"
        timeout: 5s
      ulimits:
        nofile:
          hard: 262144
          soft: 262144
    openpanel-api:
      image: lindesvard/openpanel-api:2
      command: |
        sh -c "
          echo 'Running migrations...'
          CI=true pnpm -r run migrate:deploy

          pnpm start
        "
      environment:
        - NODE_ENV=production
        - SELF_HOSTED=true
        - API_URL=${PIER_URL_OPENPANEL_API}
        - DASHBOARD_URL=${PIER_URL_OPENPANEL_DASHBOARD}
        - DATABASE_URL=postgres://${PIER_USER_POSTGRES}:${PIER_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
        - DATABASE_URL_DIRECT=postgres://${PIER_USER_POSTGRES}:${PIER_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
        - REDIS_URL=redis://default:${PIER_PASSWORD_REDIS}@redis:6379
        - CLICKHOUSE_URL=http://clickhouse:8123/openpanel
        - COOKIE_SECRET=${PIER_PASSWORD_COOKIESECRET}
        - ALLOW_REGISTRATION=${OPENPANEL_ALLOW_REGISTRATION:-false}
        - ALLOW_INVITATION=${OPENPANEL_ALLOW_INVITATION:-false}
        - EMAIL_SENDER=${OPENPANEL_EMAIL_SENDER}
        - RESEND_API_KEY=${RESEND_API_KEY}
      depends_on:
        clickhouse:
          condition: service_healthy
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        interval: 10s
        retries: 5
        test:
          - CMD-SHELL
          - curl -f http://localhost:3000/healthcheck || exit 1
        timeout: 5s
    openpanel-dashboard:
      image: lindesvard/openpanel-dashboard:2
      environment:
        - NODE_ENV=production
        - SELF_HOSTED=true
        - API_URL=${PIER_URL_OPENPANEL_API}
        - DASHBOARD_URL=${PIER_URL_OPENPANEL_DASHBOARD}
        - DATABASE_URL=postgres://${PIER_USER_POSTGRES}:${PIER_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
        - REDIS_URL=redis://default:${PIER_PASSWORD_REDIS}@redis:6379
        - CLICKHOUSE_URL=http://clickhouse:8123/openpanel
      depends_on:
        clickhouse:
          condition: service_healthy
        openpanel-api:
          condition: service_healthy
        openpanel-worker:
          condition: service_healthy
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        interval: 10s
        retries: 5
        start_period: 15s
        test:
          - CMD-SHELL
          - curl -f http://localhost:3000/api/healthcheck || exit 1
        timeout: 5s
    openpanel-worker:
      image: lindesvard/openpanel-worker:2
      environment:
        - DISABLE_BULLBOARD=${DISABLE_BULLBOARD:-1}
        - NODE_ENV=production
        - SELF_HOSTED=true
        - API_URL=${PIER_URL_OPENPANEL_API}
        - DATABASE_URL=postgres://${PIER_USER_POSTGRES}:${PIER_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
        - DATABASE_URL_DIRECT=postgres://${PIER_USER_POSTGRES}:${PIER_PASSWORD_POSTGRES}@postgres:5432/${OPENPANEL_POSTGRES_DB:-openpanel-db}?schema=public
        - REDIS_URL=redis://default:${PIER_PASSWORD_REDIS}@redis:6379
        - CLICKHOUSE_URL=http://clickhouse:8123/openpanel
      depends_on:
        clickhouse:
          condition: service_healthy
        openpanel-api:
          condition: service_healthy
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      healthcheck:
        interval: 10s
        retries: 5
        start_period: 5s
        test:
          - CMD-SHELL
          - curl -f http://localhost:3000/healthcheck || exit 1
        timeout: 5s
    postgres:
      image: postgres:16-alpine
      environment:
        - POSTGRES_DB=${OPENPANEL_POSTGRES_DB:-openpanel-db}
        - POSTGRES_USER=${PIER_USER_POSTGRES}
        - POSTGRES_PASSWORD=${PIER_PASSWORD_POSTGRES}
      volumes:
        - openpanel_postgres_data:/var/lib/postgresql/data
      healthcheck:
        interval: 10s
        retries: 5
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 5s
    redis:
      image: redis:7.4-alpine
      command: redis-server --requirepass ${PIER_PASSWORD_REDIS} --maxmemory-policy noeviction
      environment:
        - REDIS_PASSWORD=${PIER_PASSWORD_REDIS}
      volumes:
        - openpanel_redis_data:/data
      healthcheck:
        interval: 10s
        retries: 5
        test:
          - CMD
          - redis-cli
          - -a
          - ${PIER_PASSWORD_REDIS}
          - ping
        timeout: 5s
  volumes:
    openpanel_clickhouse_data: null
    openpanel_clickhouse_logs: null
    openpanel_postgres_data: null
    openpanel_redis_data: null
