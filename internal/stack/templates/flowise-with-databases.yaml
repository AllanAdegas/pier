name: Flowise com bancos
description: Ferramenta low-code para fluxos de LLM e agentes de IA; inclui Redis e Postgres.
category: IA
website: https://docs.flowiseai.com/
tags:
  - lowcode
  - nocode
  - ai
  - llm
  - openai
  - anthropic
  - machine-learning
  - rag
routes:
  - service: flowise
    port: 3001
  - service: qdrant
    port: 6333
compose: |
  services:
    flowise:
      image: flowiseai/flowise:latest
      environment:
        - DEBUG=${DEBUG:-false}
        - DISABLE_FLOWISE_TELEMETRY=${DISABLE_FLOWISE_TELEMETRY:-true}
        - PORT=${PORT:-3001}
        - DATABASE_PATH=/root/.flowise
        - APIKEY_PATH=/root/.flowise
        - SECRETKEY_PATH=/root/.flowise
        - LOG_PATH=/root/.flowise/logs
        - BLOB_STORAGE_PATH=/root/.flowise/storage
        - FLOWISE_USERNAME=${PIER_USER_FLOWISE}
        - FLOWISE_PASSWORD=${PIER_PASSWORD_FLOWISE}
      volumes:
        - flowise-data:/root/.flowise
      depends_on:
        pg-record-manager:
          condition: service_healthy
        qdrant:
          condition: service_healthy
        redis-cache:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 3
        test:
          - CMD-SHELL
          - wget -qO- http://127.0.0.1:3001 || exit 1
        timeout: 5s
    pg-record-manager:
      image: postgres:16
      environment:
        - POSTGRES_USER=${PIER_USER_POSTGRES}
        - POSTGRES_PASSWORD=${PIER_PASSWORD_POSTGRES}
        - POSTGRES_DB=${POSTGRES_DB:-pg-record-manager}
      volumes:
        - pg-record-manager-data:/var/lib/postgresql/data
      healthcheck:
        interval: 5s
        retries: 10
        start_period: 20s
        test:
          - CMD-SHELL
          - pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 5s
    qdrant:
      image: qdrant/qdrant:latest
      environment:
        - QDRANT__SERVICE__API_KEY=${PIER_PASSWORD_QDRANTAPIKEY}
      volumes:
        - flowise-qdrant-data:/qdrant/storage
      healthcheck:
        interval: 5s
        retries: 3
        test:
          - CMD-SHELL
          - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
        timeout: 5s
    redis-cache:
      image: redis:7
      volumes:
        - flowise-redis-cache-data:/data
      healthcheck:
        interval: 5s
        retries: 3
        test:
          - CMD-SHELL
          - redis-cli -h localhost -p 6379 ping
        timeout: 5s
  volumes:
    flowise-data: null
    flowise-qdrant-data: null
    flowise-redis-cache-data: null
    pg-record-manager-data: null
