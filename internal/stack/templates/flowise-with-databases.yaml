auth: first-visitor
name: Flowise com bancos
description: Ferramenta low-code para fluxos de LLM e agentes de IA; inclui Redis e Postgres.
description_en: Low-code tool for LLM flows and AI agents; includes Redis and Postgres.
category: IA
website: https://docs.flowiseai.com/
services:
  flowise:
    image: flowiseai/flowise:3.1.4
    port: 3001
    data: /root/.flowise
    env:
      APP_URL: ${PIER_URL_FLOWISE}
      DEBUG: ${DEBUG:-false}
      DISABLE_FLOWISE_TELEMETRY: ${DISABLE_FLOWISE_TELEMETRY:-true}
      PORT: ${PORT:-3001}
      DATABASE_PATH: /root/.flowise
      APIKEY_PATH: /root/.flowise
      SECRETKEY_PATH: /root/.flowise
      LOG_PATH: /root/.flowise/logs
      BLOB_STORAGE_PATH: /root/.flowise/storage
    depends_on:
      pg-record-manager:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
  qdrant:
    image: qdrant/qdrant:v1.20.0
    port: 6333
    data: /qdrant/storage
    env:
      QDRANT__SERVICE__API_KEY: ${PIER_PASSWORD_QDRANTAPIKEY}
    health: tcp
with:
  pg-record-manager:
    kind: postgres
    version: '16'
    database: pg-record-manager
  redis-cache:
    kind: redis
