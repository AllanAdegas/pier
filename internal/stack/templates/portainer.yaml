auth: generated
name: Portainer
description: Interface leve de gestão do Docker.
description_en: Lightweight Docker management interface.
category: Desenvolvimento
website: https://docs.portainer.io
services:
  portainer-init:
    image: busybox:1.37.0
    restart: 'no'
    volumes:
    - portainer_credentials:/credentials
    env:
      ADMIN_PASSWORD: ${PIER_PASSWORD_PORTAINER}
    entrypoint:
    - sh
    - -ec
    - 'umask 077; printf "%s" "$$ADMIN_PASSWORD" > /credentials/admin-password'
  portainer:
    image: portainer/portainer-ce:2.33.7-alpine
    port: 9000
    command: ['--admin-password-file', '/credentials/admin-password']
    depends_on:
      portainer-init:
        condition: service_completed_successfully
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - portainer_data:/data
    - portainer_credentials:/credentials:ro
