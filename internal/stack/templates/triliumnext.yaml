name: TriliumNext Notes
description: Construa a sua base de conhecimento pessoal.
category: Produtividade
website: https://github.com/TriliumNext/Trilium
tags:
  - self-hosted
  - notes
  - todo
  - organize
  - markdown
  - wiki
routes:
  - service: triliumnext
    port: 8080
compose: |
  services:
    triliumnext:
      image: ghcr.io/triliumnext/trilium:stable
      environment:
        - TZ=${TZ:-Europe/Berlin}
      volumes:
        - triliumnext_data:/home/node/trilium-data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - node
          - /usr/src/app/docker_healthcheck.cjs
        timeout: 20s
  volumes:
    triliumnext_data: null
