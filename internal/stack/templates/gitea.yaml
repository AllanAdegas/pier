name: Gitea
description: Hospedagem de repositórios Git leve e autogerenciada.
category: Desenvolvimento
website: https://about.gitea.com
verified: true
routes:
  - service: gitea
    port: 3000
compose: |
  services:
    gitea:
      image: gitea/gitea:1
      environment:
        GITEA__server__ROOT_URL: ${PIER_URL_GITEA:-http://localhost:3000}
        GITEA__security__SECRET_KEY: ${PIER_SECRET_GITEA}
      volumes:
        - data:/data
  volumes:
    data:
