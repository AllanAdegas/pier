name: Martin
description: Servidor de tiles vetoriais a partir de PostGIS, PMTiles e MBTiles.
category: Backend
website: https://maplibre.org/martin/introduction.html/
tags:
  - postgis
  - vector
  - tiles
routes:
  - service: martin
    port: 3000
compose: |
  services:
    martin:
      image: ghcr.io/maplibre/martin:v0.13.0
      environment:
        - HOST=${PIER_URL_MARTIN}
        - DATABASE_URL=postgresql://${PIER_USER_POSTGRES}:${PIER_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-martin-db}
      depends_on:
        postgresql:
          condition: service_healthy
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD
          - wget
          - -q
          - --spider
          - http://127.0.0.1:3000
        timeout: 20s
    postgresql:
      image: postgis/postgis:16-3.4-alpine
      environment:
        - POSTGRES_USER=$PIER_USER_POSTGRES
        - POSTGRES_PASSWORD=$PIER_PASSWORD_POSTGRES
        - POSTGRES_DB=${POSTGRES_DB:-martin-db}
      volumes:
        - martin-postgresql-data:/var/lib/postgresql/data
      healthcheck:
        interval: 5s
        retries: 10
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        timeout: 20s
      platform: linux/amd64
  volumes:
    martin-postgresql-data: null
