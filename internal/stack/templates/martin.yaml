name: Martin
description: Servidor de tiles vetoriais a partir de PostGIS, PMTiles e MBTiles.
description_en: Vector tile server from PostGIS, PMTiles and MBTiles.
category: Backend
website: https://maplibre.org/martin/introduction.html/
services:
  martin:
    image: ghcr.io/maplibre/martin:v0.13.0
    port: 3000
    env:
      HOST: ${PIER_URL_MARTIN}
      DATABASE_URL: postgresql://{{postgresql.user}}:{{postgresql.password}}@postgresql:5432/{{postgresql.database}}
with:
  postgresql:
    kind: postgres
    version: '16'
    flavor: postgis
    database: martin-db
