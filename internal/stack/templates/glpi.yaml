auth: first-visitor
name: GLPI
description: 'Gestão de serviços de TI (ITSM): inventário, help desk e service desk.'
description_en: 'IT service management (ITSM): inventory, help desk and service desk.'
category: Atendimento
website: https://help.glpi-project.org/documentation
services:
  glpi:
    image: glpi/glpi:11
    private: true
    port: 80
    volumes:
    - glpi-data:/var/glpi:rw
    env:
      GLPI_DB_HOST: glpi-db
      GLPI_DB_PORT: '3306'
      GLPI_DB_NAME: '{{glpi-db.database}}'
      GLPI_DB_USER: '{{glpi-db.user}}'
      GLPI_DB_PASSWORD: '{{glpi-db.password}}'
with:
  glpi-db:
    kind: mysql
    version: '8.0'
    database: glpi-db
