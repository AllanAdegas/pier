name: OpenWA
description: Gateway de API do WhatsApp, livre e com painel.
category: Mensageria
website: https://github.com/rmyndharis/OpenWA
tags:
  - whatsapp
  - api
  - gateway
  - messaging
  - automation
  - webhooks
routes:
  - service: openwa
    port: 2785
compose: |
  services:
    openwa:
      image: ghcr.io/rmyndharis/openwa:0.23.1
      environment:
        - NODE_ENV=production
        - HOME=/tmp
        - XDG_CONFIG_HOME=/tmp/.config
        - XDG_CACHE_HOME=/tmp/.cache
        - PORT=2785
        - LOG_LEVEL=${LOG_LEVEL:-info}
        - BASE_URL=${PIER_URL_OPENWA}
        - DASHBOARD_URL=${PIER_URL_OPENWA}
        - API_MASTER_KEY=${PIER_PASSWORD_OPENWA}
        - DATABASE_TYPE=sqlite
        - DATABASE_NAME=./data/openwa.sqlite
        - DATABASE_SYNCHRONIZE=true
        - DATABASE_LOGGING=false
        - ENGINE_TYPE=${ENGINE_TYPE:-whatsapp-web.js}
        - SESSION_DATA_PATH=./data/sessions
        - PUPPETEER_HEADLESS=true
        - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage
        - PUPPETEER_EXECUTABLE_PATH=/usr/local/bin/puppeteer-chrome
        - STORAGE_TYPE=local
        - STORAGE_LOCAL_PATH=./data/media
        - REDIS_ENABLED=false
        - QUEUE_ENABLED=false
        - CACHE_ENABLED=false
        - AUTO_START_SESSIONS=${AUTO_START_SESSIONS:-false}
      volumes:
        - openwa-data:/app/data
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
          - CMD
          - node
          - -e
          - 'require(''http'').get(''http://localhost:2785/api/health/ready'', (r) => process.exit(r.statusCode === 200 ? 0 : 1))'
        timeout: 10s
      cap_add:
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cap_drop:
        - ALL
      mem_limit: ${OPENWA_MEM_LIMIT:-2g}
      pids_limit: ${OPENWA_PIDS_LIMIT:-2048}
      read_only: true
      security_opt:
        - no-new-privileges:true
      tmpfs:
        - /tmp
  volumes:
    openwa-data: null
