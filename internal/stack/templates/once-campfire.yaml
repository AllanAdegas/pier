name: Campfire
description: Chat em grupo simples, sem assinatura.
category: Mensageria
website: https://github.com/basecamp/once-campfire
tags:
  - campfire
  - chat
  - communication
  - rails
  - once
  - basecamp
  - 37signals
routes:
  - service: campfire
    port: 80
compose: |
  services:
    campfire:
      image: ghcr.io/basecamp/once-campfire:${TAG:-main}
      restart: unless-stopped
      environment:
        - SECRET_KEY_BASE=${PIER_PASSWORD_64_CAMPFIRE}
        - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
        - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
        - DISABLE_SSL=${DISABLE_SSL:-true}
        - SSL_DOMAIN=${SSL_DOMAIN:-false}
        - SKIP_TELEMETRY=${SKIP_TELEMETRY:-true}
        - SENTRY_DSN=${SENTRY_DSN}
      volumes:
        - campfire-storage:/rails/storage
      healthcheck:
        interval: 10s
        retries: 5
        test:
          - CMD
          - curl
          - -f
          - http://localhost/up
        timeout: 5s
  volumes:
    campfire-storage: null
