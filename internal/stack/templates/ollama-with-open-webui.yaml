name: Ollama com Open WebUI
description: Modelos de IA locais com uma interface amigável.
description_en: Local AI models with a friendly interface.
category: IA
website: https://docs.openwebui.com
services:
  ollama-api:
    image: ollama/ollama:0.40.16
    data: /root/.ollama
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.13.3
    port: 8080
    data: /app/backend/data
    env:
      OLLAMA_BASE_URL: http://ollama-api:11434
    needs:
    - ollama-api
